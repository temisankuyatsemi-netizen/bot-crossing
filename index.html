<title>Bot Crossing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#030201;overflow:hidden}
canvas{display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#hud{position:fixed;inset:0;pointer-events:none;font-family:'Orbitron',monospace;color:#e8d090}
#topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:14px max(20px,env(safe-area-inset-left,0px));
  background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent);
  border-bottom:1px solid rgba(200,160,80,.15)}
#logo{font-size:clamp(11px,1.8vw,17px);font-weight:900;letter-spacing:.2em;color:#c8a050;
  text-shadow:0 0 20px rgba(200,160,80,.55)}
#hud-clock{font-size:clamp(10px,1.4vw,13px);opacity:.65;letter-spacing:.15em}
#hint{position:absolute;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  font-family:'VT323',monospace;font-size:clamp(12px,1.8vw,16px);
  color:rgba(200,160,80,.45);letter-spacing:.1em;white-space:nowrap;
  animation:fh 8s ease forwards}
@keyframes fh{0%,50%{opacity:1}100%{opacity:0}}
#room-label{position:absolute;bottom:max(52px,env(safe-area-inset-bottom,0px));left:50%;
  transform:translateX(-50%);font-weight:700;font-size:clamp(10px,1.6vw,14px);
  letter-spacing:.3em;color:#c8a050;text-shadow:0 0 14px rgba(200,160,80,.6);
  pointer-events:none;transition:opacity .6s}
</style>

<div id="hud">
  <div id="topbar">
    <div id="logo">⬡ BOT CROSSING · SEWER LAIR</div>
    <div id="hud-clock">00:00:00</div>
  </div>
  <div id="hint">🖱 Drag · Scroll to zoom · Right-drag to pan</div>
  <div id="room-label"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* Scale: 1 unit = 1 cm. Turtles ~170cm. Rooms ~800cm radius. */

// ── scene & renderer ───────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030201);
scene.fog = new THREE.FogExp2(0x060402, 0.00035);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 1, 50000);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── camera orbit ───────────────────────────────────────────────────────────
let camTheta=0.6, camPhi=1.05, camDist=4200;
const camTarget = new THREE.Vector3(0, 200, 200);
let drag=false, rDrag=false, lx=0, ly=0;

const cvs = renderer.domElement;
cvs.addEventListener('mousedown', e => {
  if(e.button===0){drag=true; lx=e.clientX; ly=e.clientY;}
  if(e.button===2){rDrag=true; lx=e.clientX; ly=e.clientY;}
  e.preventDefault();
});
cvs.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('mouseup', () => {drag=false; rDrag=false;});
window.addEventListener('mousemove', e => {
  const dx=e.clientX-lx, dy=e.clientY-ly;
  if(drag){ camTheta-=dx*.006; camPhi=Math.max(.08,Math.min(1.45,camPhi+dy*.006)); }
  if(rDrag){
    const r=new THREE.Vector3(Math.cos(camTheta),0,-Math.sin(camTheta));
    camTarget.addScaledVector(r,-dx*camDist*.0004);
    camTarget.y+=dy*camDist*.0004;
  }
  lx=e.clientX; ly=e.clientY;
});
cvs.addEventListener('wheel', e => {
  camDist=Math.max(300,Math.min(20000,camDist+e.deltaY*3)); e.preventDefault();
},{passive:false});
let tLx=0,tLy=0,tPD=0;
cvs.addEventListener('touchstart',e=>{
  if(e.touches.length===1){drag=true;tLx=e.touches[0].clientX;tLy=e.touches[0].clientY;}
  if(e.touches.length===2){tPD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
  e.preventDefault();
},{passive:false});
cvs.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&drag){
    camTheta-=(e.touches[0].clientX-tLx)*.006;
    camPhi=Math.max(.08,Math.min(1.45,camPhi+(e.touches[0].clientY-tLy)*.006));
    tLx=e.touches[0].clientX;tLy=e.touches[0].clientY;
  }else if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    camDist=Math.max(300,Math.min(20000,camDist+(tPD-d)*10));tPD=d;
  }
  e.preventDefault();
},{passive:false});
cvs.addEventListener('touchend',()=>{drag=false;});

// ── lights ─────────────────────────────────────────────────────────────────
scene.add(new THREE.HemisphereLight(0x181410,0x020100,.45));
const sun=new THREE.DirectionalLight(0xffe8a0,.12);
sun.position.set(800,2000,600); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{near:100,far:8000,left:-3500,right:3500,top:3500,bottom:-3500});
scene.add(sun);

// ── helpers ────────────────────────────────────────────────────────────────
const h2n=s=>parseInt(s.replace('#',''),16);
const hR=s=>parseInt(s.slice(1,3),16);
const hG=s=>parseInt(s.slice(3,5),16);
const hB=s=>parseInt(s.slice(5,7),16);

function brickTex(hex){
  const r=hR(hex),g=hG(hex),b=hB(hex);
  const sz=256,cv=document.createElement('canvas');cv.width=cv.height=sz;
  const ctx=cv.getContext('2d');
  ctx.fillStyle=`rgb(${r*.4|0},${g*.4|0},${b*.4|0})`;ctx.fillRect(0,0,sz,sz);
  const bw=64,bh=26;
  for(let row=0;row<11;row++){
    const off=(row%2)*bw/2;
    for(let col=-1;col<6;col++){
      const bx=col*bw+off,by=row*bh;
      const ns=((Math.sin(bx*.29+by*.73+row*.11)*.5+.5)*50-20)|0;
      ctx.fillStyle=`rgb(${Math.min(255,r+ns)|0},${Math.min(255,g+ns)|0},${Math.min(255,b+ns)|0})`;
      ctx.fillRect(bx+2,by+2,bw-4,bh-4);
    }
  }
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(8,3);
  return t;
}
const M=(col,rough=.9,metal=.05,emit=col,ei=0)=>
  new THREE.MeshStandardMaterial({color:col,roughness:rough,metalness:metal,emissive:emit,emissiveIntensity:ei});

// ── world data (all in cm) ─────────────────────────────────────────────────
// rooms: r=radius, h=height
const ROOMS=[
  {key:'hub',  x:0,    z:0,    r:880, h:720, wall:'#5a3e1e',floor:'#2e2214',accent:'#c8a050',label:'THE SEWER LAIR'},
  {key:'leo',  x:-1700,z:-980, r:660, h:600, wall:'#1e3060',floor:'#141e40',accent:'#4488ff',bandana:'#4488ff',label:"LEO'S DOJO",   name:'LEONARDO'},
  {key:'don',  x:1700, z:-980, r:660, h:600, wall:'#2e1040',floor:'#1e0c2e',accent:'#aa44ee',bandana:'#aa44ee',label:"DON'S LAB",   name:'DONATELLO'},
  {key:'raph', x:-1700,z:980,  r:660, h:600, wall:'#481010',floor:'#2e0c0c',accent:'#ff3333',bandana:'#ff3333',label:"RAPH'S GYM",  name:'RAPHAEL'},
  {key:'mikey',x:1700, z:980,  r:660, h:600, wall:'#3c2008',floor:'#281408',accent:'#ff8800',bandana:'#ff8800',label:"MIKEY'S STUDIO",name:'MICHELANGELO'},
  {key:'split',x:0,    z:1580, r:580, h:550, wall:'#1a2e14',floor:'#101c0c',accent:'#55cc33',bandana:'#55cc33',label:"SPLINTER'S WAR ROOM",name:'SPLINTER',isRat:true},
];
const rMap={};ROOMS.forEach(r=>rMap[r.key]=r);

// ── rooms ──────────────────────────────────────────────────────────────────
ROOMS.forEach(room=>{
  const wallMat=new THREE.MeshStandardMaterial({map:brickTex(room.wall),side:THREE.BackSide,roughness:.94});
  // Floor
  const fl=new THREE.Mesh(new THREE.CircleGeometry(room.r,56),M(h2n(room.floor),.96));
  fl.rotation.x=-Math.PI/2; fl.position.set(room.x,1,room.z); fl.receiveShadow=true; scene.add(fl);
  // Outer wall cylinder (inside face)
  const wm=new THREE.Mesh(new THREE.CylinderGeometry(room.r,room.r,room.h,56,1,true),wallMat);
  wm.position.set(room.x,room.h/2,room.z); scene.add(wm);
  // Ceiling
  const cl=new THREE.Mesh(new THREE.CircleGeometry(room.r,56),M(0x090704,.99));
  cl.rotation.x=Math.PI/2; cl.position.set(room.x,room.h,room.z); scene.add(cl);
  // Glow ring at floor
  const ringMat=new THREE.MeshStandardMaterial({color:h2n(room.accent),emissive:h2n(room.accent),emissiveIntensity:.7});
  const ring=new THREE.Mesh(new THREE.TorusGeometry(room.r-20,8,4,56),ringMat);
  ring.rotation.x=Math.PI/2; ring.position.set(room.x,4,room.z); scene.add(ring);
  // Accent point light
  const pt=new THREE.PointLight(h2n(room.accent),2.2,room.r*4);
  pt.position.set(room.x,room.h*.55,room.z); scene.add(pt);
  room._light=pt;
  // Fill light near floor
  const fl2=new THREE.PointLight(h2n(room.accent),.45,room.r*5.5);
  fl2.position.set(room.x,30,room.z); scene.add(fl2);
});

// ── tunnels ────────────────────────────────────────────────────────────────
function tunnel(r1,r2){
  const dx=r2.x-r1.x,dz=r2.z-r1.z;
  const dist=Math.sqrt(dx*dx+dz*dz), ang=Math.atan2(dx,dz);
  const mx=(r1.x+r2.x)/2,mz=(r1.z+r2.z)/2;
  const tLen=dist-r1.r-r2.r+40,tw=320,th=360;
  const g=new THREE.Group();
  g.position.set(mx,0,mz); g.rotation.y=ang;
  const wt=brickTex('#3a2818'),wm=new THREE.MeshStandardMaterial({map:wt,roughness:.95});
  // Floor
  const fm=new THREE.Mesh(new THREE.BoxGeometry(tLen,15,tw),M(0x181208,.98));
  fm.position.y=7.5; fm.receiveShadow=true; g.add(fm);
  // Walls
  [[-tw/2,tw/2]].flat().forEach((zOff,i)=>{
    const w=new THREE.Mesh(new THREE.BoxGeometry(tLen,th,15),wm);
    w.position.set(0,th/2+15,zOff*(i===0?1:-1)*0+zOff); w.position.z=zOff; g.add(w);
  });
  // Ceiling
  const cm=new THREE.Mesh(new THREE.BoxGeometry(tLen,15,tw),M(0x080604,.99));
  cm.position.y=th+15; g.add(cm);
  // Atmosphere light
  const dl=new THREE.PointLight(0x443322,.5,900);
  dl.position.y=th*.5; g.add(dl);
  // Ceiling pipe
  const pipe=new THREE.Mesh(new THREE.CylinderGeometry(25,25,tLen,10),
    new THREE.MeshStandardMaterial({color:0x3a2e20,roughness:.7,metalness:.4}));
  pipe.rotation.z=Math.PI/2; pipe.position.y=th-10; g.add(pipe);
  scene.add(g);
}
tunnel(rMap.hub,rMap.leo); tunnel(rMap.hub,rMap.don);
tunnel(rMap.hub,rMap.raph); tunnel(rMap.hub,rMap.mikey);
tunnel(rMap.hub,rMap.split);

// ── ground ─────────────────────────────────────────────────────────────────
const gnd=new THREE.Mesh(new THREE.PlaneGeometry(20000,20000),M(0x060402,.99));
gnd.rotation.x=-Math.PI/2; gnd.position.y=-.5; scene.add(gnd);

// ── hub: water pool ────────────────────────────────────────────────────────
const water=new THREE.Mesh(new THREE.CircleGeometry(220,40),
  new THREE.MeshStandardMaterial({color:0x1a3040,roughness:.04,metalness:.7,transparent:true,opacity:.9}));
water.rotation.x=-Math.PI/2; water.position.set(0,2,0); scene.add(water);

// ── wall pipes ─────────────────────────────────────────────────────────────
ROOMS.forEach(room=>{
  const n=room.key==='hub'?4:3;
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2+.4;
    const px=room.x+Math.cos(a)*(room.r-50);
    const pz=room.z+Math.sin(a)*(room.r-50);
    const pipe=new THREE.Mesh(new THREE.CylinderGeometry(28,28,room.h,12),
      new THREE.MeshStandardMaterial({color:0x3a2e20,roughness:.7,metalness:.35}));
    pipe.position.set(px,room.h/2,pz); scene.add(pipe);
    const collar=new THREE.Mesh(new THREE.CylinderGeometry(40,40,25,12),
      new THREE.MeshStandardMaterial({color:0x5a2810,roughness:.8,metalness:.2}));
    collar.position.set(px,room.h*.55,pz); scene.add(collar);
  }
});

// ── furniture ─────────────────────────────────────────────────────────────
function furniture(room){
  const G=new THREE.Group();
  const acc=h2n(room.accent);
  const glowM=new THREE.MeshStandardMaterial({color:acc,emissive:acc,emissiveIntensity:.9,roughness:.3});

  if(room.key==='leo'){
    // Katana rack
    const post=M(0x3a2010,.85);
    [-80,80].forEach(x=>{
      const p=new THREE.Mesh(new THREE.BoxGeometry(15,240,15),post);
      p.position.set(x,120,-room.r+120); G.add(p);
    });
    [60,120,180].forEach(y=>{
      const peg=new THREE.Mesh(new THREE.CylinderGeometry(5,5,200,8),
        new THREE.MeshStandardMaterial({color:0xcccccc,roughness:.3,metalness:.9}));
      peg.rotation.z=Math.PI/2; peg.position.set(0,y,-room.r+120); G.add(peg);
    });
    // Training dummy
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(10,10,220,8),M(0x2a1808,.9));
    pole.position.set(200,110,0); G.add(pole);
    const dummy=new THREE.Mesh(new THREE.CylinderGeometry(40,30,140,10),M(0x3a3028,.8));
    dummy.position.set(200,200,0); G.add(dummy);
    const dHead=new THREE.Mesh(new THREE.SphereGeometry(40,10,8),M(0x2a2018,.85));
    dHead.position.set(200,300,0); G.add(dHead);
  }

  if(room.key==='don'){
    // Workbench
    const bench=new THREE.Mesh(new THREE.BoxGeometry(400,30,140),M(0x4a3018,.8));
    bench.position.set(0,120,-room.r+160); G.add(bench);
    [-170,170].forEach(x=>{
      const leg=new THREE.Mesh(new THREE.BoxGeometry(20,120,20),M(0x2a1808,.9));
      leg.position.set(x,60,-room.r+160); G.add(leg);
    });
    // Monitors
    [-140,0,140].forEach((x,i)=>{
      const scr=new THREE.Mesh(new THREE.BoxGeometry(90,70,8),
        new THREE.MeshStandardMaterial({color:acc,emissive:acc,emissiveIntensity:.5+i*.15,roughness:.2}));
      scr.position.set(x,190,-room.r+170); G.add(scr);
    });
    // Beakers
    for(let i=0;i<5;i++){
      const bk=new THREE.Mesh(new THREE.CylinderGeometry(12,9,40,8),
        new THREE.MeshStandardMaterial({color:acc,transparent:true,opacity:.5,roughness:.1}));
      bk.position.set(-160+i*80,150,-room.r+160); G.add(bk);
    }
  }

  if(room.key==='raph'){
    // Barbell rack
    const rack=new THREE.Mesh(new THREE.BoxGeometry(360,30,80),M(0x282018,.85));
    rack.position.set(0,40,-room.r+140); G.add(rack);
    [-140,-70,0,70,140].forEach(x=>{
      const bar=new THREE.Mesh(new THREE.CylinderGeometry(8,8,80,8),M(0xaaaaaa,.3,.9));
      bar.rotation.z=Math.PI/2; bar.position.set(x,60,-room.r+140); G.add(bar);
      [-1,1].forEach(s=>{
        const wt=new THREE.Mesh(new THREE.CylinderGeometry(28,28,20,14),M(0x1a1818,.7,.5));
        wt.rotation.z=Math.PI/2; wt.position.set(x+s*45,60,-room.r+140); G.add(wt);
      });
    });
    // Heavy bag
    const bag=new THREE.Mesh(new THREE.CylinderGeometry(40,35,180,12),M(0x3a1808,.85));
    bag.position.set(220,220,0); G.add(bag);
    const chain=new THREE.Mesh(new THREE.CylinderGeometry(5,5,140,8),M(0x888888,.4,.8));
    chain.position.set(220,360,0); G.add(chain);
  }

  if(room.key==='mikey'){
    // Pizza tower
    for(let i=0;i<6;i++){
      const pz=new THREE.Mesh(new THREE.CylinderGeometry(60-i*2,60-i*2,15,16),
        new THREE.MeshStandardMaterial({color:0xcc6610,roughness:.7}));
      pz.position.set(-200,15+i*20,50); G.add(pz);
    }
    // Easel
    const eM=M(0x4a2c10,.8);
    [[180,90,-50,.2],[220,90,-50,-.2],[200,70,-90,.6]].forEach(([x,y,z,rz])=>{
      const el=new THREE.Mesh(new THREE.BoxGeometry(10,180,10),eM);
      el.position.set(x,y,z); el.rotation.z=rz; G.add(el);
    });
    const cnv=new THREE.Mesh(new THREE.BoxGeometry(100,120,4),M(0xf5eed8,.5));
    cnv.position.set(200,160,-50); G.add(cnv);
    // Speaker
    const spk=new THREE.Mesh(new THREE.BoxGeometry(80,120,60),M(0x1a1a1a,.9));
    spk.position.set(-room.r+160,80,200); G.add(spk);
    const spkCone=new THREE.Mesh(new THREE.CylinderGeometry(25,35,15,16),glowM);
    spkCone.rotation.x=Math.PI/2; spkCone.position.set(-room.r+160,80,230); G.add(spkCone);
  }

  if(room.key==='split'){
    // Map table
    const table=new THREE.Mesh(new THREE.BoxGeometry(320,20,200),M(0x3a2a10,.8));
    table.position.set(0,100,-room.r+200); G.add(table);
    [[-160,40],[160,40],[-160,-40],[160,-40]].forEach(([x,z])=>{
      const leg=new THREE.Mesh(new THREE.BoxGeometry(20,100,20),M(0x2a1808,.9));
      leg.position.set(x,50,z-room.r+200); G.add(leg);
    });
    [[-.8,.4],[.8,.5],[0,-.4],[.4,-.3],[-.2,.6]].forEach(([fx,fz])=>{
      const pin=new THREE.Mesh(new THREE.CylinderGeometry(5,5,30,6),M(acc,.3));
      pin.position.set(fx*120,125,fz*80-room.r+200); G.add(pin);
      const top=new THREE.Mesh(new THREE.SphereGeometry(12,8,8),glowM);
      top.position.set(fx*120,145,fz*80-room.r+200); G.add(top);
    });
    // Meditation dais
    const dais=new THREE.Mesh(new THREE.CylinderGeometry(120,140,30,18),M(0x1a2410,.9));
    dais.position.set(0,15,200); G.add(dais);
    const mat=new THREE.Mesh(new THREE.CylinderGeometry(80,80,5,18),M(0x223318,.8));
    mat.position.set(0,35,200); G.add(mat);
    // Incense stick
    const inc=new THREE.Mesh(new THREE.CylinderGeometry(3,3,60,6),M(0x8a6040,.6));
    inc.position.set(120,30,200); G.add(inc);
  }

  G.position.set(room.x,0,room.z);
  scene.add(G);
}
ROOMS.filter(r=>r.key!=='hub').forEach(furniture);

// ── turtle characters — matched to TMNT 2012 reference ────────────────────
function buildTurtle(room){
  const G=new THREE.Group();
  // Colors matching reference: vivid green, cream plastron, brown shell, leather pads
  const skinC=0x4ab228, skinDkC=0x2e7010, plastC=0xd4ca7a, shellC=0x7a5a14, padC=0xb87840;
  const skin=M(skinC,.75), skinDk=M(skinDkC,.8);
  const plastM=M(plastC,.65);
  const shellM=new THREE.MeshStandardMaterial({color:shellC,roughness:.6,metalness:.1});
  const scuteM=M(0x5a4010,.65);
  const padM=M(padC,.8);
  const bC=h2n(room.bandana||'#888888');
  const bndM=new THREE.MeshStandardMaterial({color:bC,emissive:bC,emissiveIntensity:.35,roughness:.55});
  const silvM=new THREE.MeshStandardMaterial({color:0xd8d8d8,roughness:.2,metalness:.97});
  const goldM=new THREE.MeshStandardMaterial({color:0xd4a020,roughness:.3,metalness:.9});
  const woodM=M(0x4a2c10,.72);
  const wrpM=M(0x3a1c08,.85); // wrap/strap material

  // ── THIGHS + LEGS ──
  const thighL=new THREE.Mesh(new THREE.CylinderGeometry(30,24,80,12),skin);
  thighL.position.set(-38,104,0); G.add(thighL);
  const thighR=thighL.clone(); thighR.position.x=38; G.add(thighR);
  const shinL=new THREE.Mesh(new THREE.CylinderGeometry(22,18,80,12),skin);
  shinL.position.set(-38,44,4); G.add(shinL);
  const shinR=shinL.clone(); shinR.position.x=38; G.add(shinR);
  // Knee pads
  [-38,38].forEach(x=>{
    const kp=new THREE.Mesh(new THREE.SphereGeometry(26,10,8,0,Math.PI*2,0,Math.PI*.55),padM);
    kp.rotation.x=-Math.PI/3; kp.position.set(x,82,16); G.add(kp);
    // Knee wrap straps
    const ws=new THREE.Mesh(new THREE.CylinderGeometry(23,23,8,12,1,true),wrpM);
    ws.position.set(x,76,0); G.add(ws);
  });
  // Feet — 3-toed turtle feet
  [-38,38].forEach(x=>{
    const foot=new THREE.Mesh(new THREE.SphereGeometry(22,12,8),skinDk);
    foot.scale.set(1.1,.45,1.6); foot.position.set(x,10,15); G.add(foot);
    for(let t=0;t<3;t++){
      const toe=new THREE.Mesh(new THREE.SphereGeometry(8,8,6),skinDk);

}

function buildSplinter(room){
  const G=new THREE.Group();
  // Reference: tall rat elder, dark maroon/brown robes, wise pose
  const fur=M(0x8a6a4a,.8), furDk=M(0x4a2e18,.88), furLt=M(0xb89a7a,.7);
  const robeC=0x5a1a08; // dark maroon like reference
  const robeM=new THREE.MeshStandardMaterial({color:robeC,roughness:.88});
  const innerRobeM=M(0x3a1005,.9);
  const silvM=new THREE.MeshStandardMaterial({color:0xaaaaaa,roughness:.35,metalness:.8});
  const woodM=M(0x5a3010,.7);
  const sashM=M(0x8a1010,.75);

  // Feet (rat-like, longer)
  [-1,1].forEach(s=>{
    const ft=new THREE.Mesh(new THREE.SphereGeometry(18,10,8),furDk);
    ft.scale.set(1.2,.4,2.2); ft.position.set(s*32,8,20); G.add(ft);
  });
  // Lower robe — very wide bell shape
  const robe=new THREE.Mesh(new THREE.CylinderGeometry(30,90,180,16),robeM);
  robe.position.y=90; G.add(robe);
  // Inner robe layer (darker, visible at hem)
  const iRobe=new THREE.Mesh(new THREE.CylinderGeometry(28,92,185,16),innerRobeM);
  iRobe.position.y=88; G.add(iRobe);
  // Torso
  const torso=new THREE.Mesh(new THREE.CylinderGeometry(38,45,130,14),robeM);
  torso.position.y=210; G.add(torso);
  // Sash belt
  const sash=new THREE.Mesh(new THREE.CylinderGeometry(46,46,20,16),sashM);
  sash.position.y=182; G.add(sash);
  // Shoulder mantle
  const shldr=new THREE.Mesh(new THREE.CylinderGeometry(55,40,40,16,1,true),robeM);
  shldr.position.y=268; G.add(shldr);

  // Arms — robed sleeves
  const aL=new THREE.Mesh(new THREE.CylinderGeometry(22,18,100,10),robeM);
  aL.position.set(-68,238,0); aL.rotation.z=.5; G.add(aL);
  const aR=new THREE.Mesh(new THREE.CylinderGeometry(22,18,100,10),robeM);
  aR.position.set(68,238,0); aR.rotation.z=-.5; G.add(aR);
  // Fur hands
  const hL=new THREE.Mesh(new THREE.SphereGeometry(18,10,10),fur);
  hL.scale.set(1,.75,1.2); hL.position.set(-112,198,12); G.add(hL);
  const hR=hL.clone(); hR.position.x=112; G.add(hR);

  // Neck (fur visible above collar)
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(24,30,40,12),fur);
  neck.position.y=288; G.add(neck);

  // ── HEAD — ratlike, elongated ──
  const head=new THREE.Mesh(new THREE.SphereGeometry(48,18,14),fur);
  head.scale.set(.82,.98,1.22); head.position.y=332; G.add(head);
  // Long rat snout — distinctive feature
  const snout=new THREE.Mesh(new THREE.SphereGeometry(26,12,10),fur);
  snout.scale.set(.75,.6,1.6); snout.position.set(0,324,55); G.add(snout);
  const snoutTip=new THREE.Mesh(new THREE.SphereGeometry(15,10,8),furDk);
  snoutTip.scale.set(.7,.55,1); snoutTip.position.set(0,322,72); G.add(snoutTip);
  const nose=new THREE.Mesh(new THREE.SphereGeometry(7,8,8),M(0xdd8899,.5));
  nose.position.set(0,326,80); G.add(nose);
  // Mouth line
  const mouthL=new THREE.Mesh(new THREE.CylinderGeometry(2,2,28,6),furDk);
  mouthL.rotation.z=Math.PI/2; mouthL.position.set(0,314,70); G.add(mouthL);
  // Large round ears — key Splinter feature
  [-1,1].forEach(s=>{
    const ear=new THREE.Mesh(new THREE.SphereGeometry(34,14,10,0,Math.PI*2,0,Math.PI*.62),fur);
    ear.rotation.z=s*.22; ear.position.set(s*44,370,-5); G.add(ear);
    const iEar=new THREE.Mesh(new THREE.SphereGeometry(22,12,8,0,Math.PI*2,0,Math.PI*.55),M(0xdd9999,.7));
    iEar.rotation.z=s*.22; iEar.position.set(s*44,370,0); G.add(iEar);
  });
  // Whiskers
  const wm=M(0xddccbb,.45);
  [-1,1].forEach(s=>{
    for(let w=0;w<4;w++){
      const wh=new THREE.Mesh(new THREE.CylinderGeometry(1.2,.5,80,4),wm);
      wh.position.set(s*22,322-w*3,58);
      wh.rotation.set(0,s*.3*(w+1),Math.PI/2+s*.2+(w*.05)); G.add(wh);
    }
  });
  // Long white beard/mustache — iconic
  const brd=new THREE.Mesh(new THREE.CylinderGeometry(5,1.5,120,8),M(0xfafafa,.5));
  brd.rotation.x=.28; brd.position.set(0,284,52); G.add(brd);
  const brd2=new THREE.Mesh(new THREE.CylinderGeometry(3,1,80,8),M(0xf0f0f0,.5));
  brd2.rotation.x=.35; brd2.position.set(-16,272,56); G.add(brd2);
  const brd3=brd2.clone(); brd3.position.x=16; G.add(brd3);
  // Eyes — small, dark, wise
  [-1,1].forEach(s=>{
    const ey=new THREE.Mesh(new THREE.SphereGeometry(12,10,10),new THREE.MeshStandardMaterial({color:0x180800,roughness:.05,metalness:.7,emissive:0x220800,emissiveIntensity:.4}));
    ey.position.set(s*22,338,48); G.add(ey);
    const gl=new THREE.Mesh(new THREE.SphereGeometry(4.5,6,6),M(0xffffff,.05));
    gl.position.set(s*22+4,341,55); G.add(gl);
  });

  // ── STAFF — tall walking stick ──
  const staff=new THREE.Mesh(new THREE.CylinderGeometry(8,8,480,10),woodM);
  staff.position.set(105,240,0); staff.rotation.z=.06; G.add(staff);
  const sTip=new THREE.Mesh(new THREE.CylinderGeometry(10,7,30,8),silvM);
  sTip.position.set(80,474,0); G.add(sTip);
  // Staff knots
  [80,180,280,370].forEach(py=>{
    const kn=new THREE.Mesh(new THREE.CylinderGeometry(10,10,12,8),woodM);
    kn.position.set(106-py*.006,py,0); kn.rotation.z=.06; G.add(kn);
  });

  // ── TAIL ──
  const tail=new THREE.Mesh(new THREE.CylinderGeometry(14,4,220,10),furDk);
  tail.rotation.x=-.28; tail.rotation.z=.1; tail.position.set(15,45,-72); G.add(tail);

  G.userData={walkPhase:0,bobPhase:Math.random()*Math.PI*2,legL:null,legR:null};
  return G;
}

const chars=[];
ROOMS.filter(r=>r.key!=='hub').forEach(room=>{
  const mesh=room.isRat?buildSplinter(room):buildTurtle(room);
  mesh.position.set(room.x,0,room.z);
  mesh.rotation.y=Math.random()*Math.PI*2;
  scene.add(mesh);
  chars.push({mesh,room});
});

// ── particles ──────────────────────────────────────────────────────────────
const PC=300;
const pPos=new Float32Array(PC*3),pVel=[],pCol=new Float32Array(PC*3);
for(let i=0;i<PC;i++){
  const room=ROOMS[Math.floor(Math.random()*ROOMS.length)];
  const a=Math.random()*Math.PI*2,r=Math.random()*room.r*.75;
  pPos[i*3]=room.x+Math.cos(a)*r; pPos[i*3+1]=Math.random()*room.h*.9; pPos[i*3+2]=room.z+Math.sin(a)*r;
  pVel.push({vx:(Math.random()-.5)*.6,vy:.25+Math.random()*.7,vz:(Math.random()-.5)*.6,room});
  pCol[i*3]=hR(room.accent)/255*.6+.2; pCol[i*3+1]=hG(room.accent)/255*.6+.2; pCol[i*3+2]=hB(room.accent)/255*.6+.2;
}
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
scene.add(new THREE.Points(pGeo,new THREE.PointsMaterial({size:9,vertexColors:true,transparent:true,opacity:.45,sizeAttenuation:true})));

// ── HUD refs ───────────────────────────────────────────────────────────────
const clockEl=document.getElementById('hud-clock');
const labelEl=document.getElementById('room-label');

// ── main loop ──────────────────────────────────────────────────────────────
let t=0;
(function animate(){
  requestAnimationFrame(animate);
  t+=.016;

  camera.position.x=camTarget.x+camDist*Math.sin(camPhi)*Math.sin(camTheta);
  camera.position.y=camTarget.y+camDist*Math.cos(camPhi);
  camera.position.z=camTarget.z+camDist*Math.sin(camPhi)*Math.cos(camTheta);
  camera.lookAt(camTarget);

  chars.forEach(({mesh})=>{
    const ud=mesh.userData;
    ud.bobPhase+=.022; ud.walkPhase+=.032;
    mesh.position.y=Math.sin(ud.bobPhase)*11;
    mesh.rotation.y+=.0025;
    if(ud.legL){ud.legL.rotation.x=Math.sin(ud.walkPhase)*.32; ud.legR.rotation.x=-Math.sin(ud.walkPhase)*.32;}
  });

  ROOMS.forEach(r=>{if(r._light)r._light.intensity=1.9+Math.sin(t*1.4+r.x*.00012)*.5;});
  water.rotation.z+=.0012;

  for(let i=0;i<PC;i++){
    const v=pVel[i],r=v.room;
    pPos[i*3]+=v.vx; pPos[i*3+1]+=v.vy; pPos[i*3+2]+=v.vz;
    if(pPos[i*3+1]>r.h){
      pPos[i*3+1]=5;
      const a=Math.random()*Math.PI*2,rd=Math.random()*r.r*.6;
      pPos[i*3]=r.x+Math.cos(a)*rd; pPos[i*3+2]=r.z+Math.sin(a)*rd;
    }
  }
  pGeo.attributes.position.needsUpdate=true;

  clockEl.textContent=new Date().toLocaleTimeString('en-US',{hour12:false});

  let near=ROOMS[0],minD=Infinity;
  ROOMS.forEach(r=>{const d=Math.hypot(camTarget.x-r.x,camTarget.z-r.z);if(d<minD){minD=d;near=r;}});
  const camD=Math.hypot(camera.position.x-near.x,camera.position.z-near.z);
  labelEl.style.opacity=camD<near.r*2.5?'1':'0';
  labelEl.textContent=near.label;

  renderer.render(scene,camera);
})();
</script>
