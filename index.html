<title>Bot Crossing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  :root { --bg:#0a0e08; --eye:#00e5ff; --gold:#ffd54f; color-scheme:dark; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:'VT323',monospace}
  #three-canvas{position:fixed;inset:0;width:100%!important;height:100%!important}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #topbar{
    position:absolute;top:max(14px,env(safe-area-inset-top,0px));
    left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
    display:flex;align-items:center;justify-content:space-between;gap:8px}
  #logo{font-family:'Orbitron',monospace;font-size:clamp(12px,2vw,18px);font-weight:900;letter-spacing:.2em;
    color:#7fff00;text-shadow:0 0 14px #7fff0088,0 0 30px #7fff0033}
  #clock{font-family:'Orbitron',monospace;font-size:clamp(10px,1.4vw,13px);color:var(--gold);
    letter-spacing:.12em;background:rgba(0,0,0,.6);padding:3px 10px;
    border:1px solid rgba(255,213,79,.3);border-radius:4px;backdrop-filter:blur(4px)}
  #pills{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
  .pill{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:.08em;padding:3px 9px;
    border-radius:4px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);white-space:nowrap}
  #legend{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:4px}
  .leg{display:flex;align-items:center;gap:6px;font-size:14px;letter-spacing:.04em;
    color:#4a6040;background:rgba(0,0,0,.55);padding:3px 8px 3px 5px;
    border-radius:3px;backdrop-filter:blur(4px)}
  .leg-dot{width:7px;height:7px;flex-shrink:0;border-radius:2px}
  #feed{position:absolute;bottom:max(18px,env(safe-area-inset-bottom,0px));
    left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
    display:flex;flex-direction:column;gap:4px;max-height:100px;overflow:hidden}
  .log{font-size:15px;color:#405840;padding:3px 10px;background:rgba(0,10,0,.8);
    border-left:2px solid #1a4a10;border-radius:0 3px 3px 0;backdrop-filter:blur(4px);
    animation:sl .3s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log .who{font-weight:600;margin-right:6px}
  @keyframes sl{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>

<div id="hud">
  <div id="topbar">
    <div id="logo">BOT CROSSING</div>
    <div id="clock">00:00:00</div>
    <div id="pills">
      <div class="pill" id="p-bots" style="border:1px solid rgba(127,255,0,.3);color:#7fff00">TURTLES 0</div>
      <div class="pill" id="p-built" style="border:1px solid rgba(255,213,79,.3);color:#ffd54f">BUILT 0</div>
      <div class="pill" id="p-exp" style="border:1px solid rgba(100,200,50,.3);color:#64c832">WORLD 0%</div>
    </div>
  </div>
  <div id="legend"></div>
  <div id="feed"></div>
</div>

<script>
// ── Clock ─────────────────────────────────────────────────────────
function tickClock(){
  const d=new Date();
  document.getElementById('clock').textContent=
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
tickClock(); setInterval(tickClock,1000);

// ── Sectors — each gets a turtle bandana color ────────────────────
const SECTORS=[
  {key:'content',  label:'CONTENT HUB',        bandana:0x1565c0, hex:'#1e90ff', bandName:'LEONARDO',
   angle:-Math.PI/2,            color:0x1e90ff,
   tasks:['Post AM workout reel','Film healthy meal','Paint timelapse','Cheat day haul','Athlete morning','Cook-along video','Sketch session','Recovery prep']},
  {key:'stocked',  label:'STOCKED',             bandana:0x6a0dad, hex:'#9c27b0', bandName:'DONATELLO',
   angle:-Math.PI/2+(2*Math.PI/5), color:0x9c27b0,
   tasks:['Prototype v2 spec','User research','Pitch deck slide','App wireframe','Backend schema','Supplier outreach','Press kit draft','Demo video']},
  {key:'athletic', label:'ATHLETIC WEAR',       bandana:0xb71c1c, hex:'#f44336', bandName:'RAPHAEL',
   angle:-Math.PI/2+2*(2*Math.PI/5), color:0xf44336,
   tasks:['Design drop concept','Sample request','Launch campaign','Fit model shoot','Brand guide','Collab pitch','Website landing','Size run plan']},
  {key:'creative', label:'CREATIVE COLLECTIVE', bandana:0xe65100, hex:'#ff9800', bandName:'MICHELANGELO',
   angle:-Math.PI/2+3*(2*Math.PI/5), color:0xff9800,
   tasks:['Gallery concept','Merch design','Zine layout','Exhibition pitch','Community event','Digital drop','Collab artist DM','Editorial shoot']},
  {key:'hq',       label:'HQ / OPS',            bandana:0x1b5e20, hex:'#4caf50', bandName:'SPLINTER',
   angle:-Math.PI/2+4*(2*Math.PI/5), color:0x4caf50,
   tasks:['Sprint planning','OKR review','Budget model','Roadmap update','Team stand-up','Metrics dashboard','Risk log','Weekly recap']},
];

const legendEl=document.getElementById('legend');
SECTORS.forEach(s=>{
  const el=document.createElement('div'); el.className='leg';
  el.innerHTML=`<div class="leg-dot" style="background:${s.hex}"></div>${s.bandName} · ${s.label}`;
  legendEl.appendChild(el);
});

// ── Three.js ──────────────────────────────────────────────────────
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030806);
scene.fog=new THREE.FogExp2(0x030806,0.055);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.domElement.id='three-canvas';
document.body.insertBefore(renderer.domElement,document.getElementById('hud'));

const camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,.1,200);
camera.position.set(0,14,10); camera.lookAt(0,0,0);

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// Lights
scene.add(new THREE.AmbientLight(0x102008,3.5));
const sun=new THREE.DirectionalLight(0x80ff40,1.8);
sun.position.set(6,14,8); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=.5; sun.shadow.camera.far=60;
sun.shadow.camera.left=sun.shadow.camera.bottom=-15;
sun.shadow.camera.right=sun.shadow.camera.top=15;
scene.add(sun);
scene.add(Object.assign(new THREE.DirectionalLight(0x004020,.5),{position:new THREE.Vector3(-8,5,-5)}));
const coreLight=new THREE.PointLight(0x40ff40,4,10);
coreLight.position.set(0,.8,0); scene.add(coreLight);

// Stars
const sverts=[];
for(let i=0;i<1600;i++){
  const t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1),r=65+Math.random()*35;
  sverts.push(Math.sin(p)*Math.cos(t)*r,Math.sin(p)*Math.sin(t)*r,Math.cos(p)*r);
}
const sg=new THREE.BufferGeometry();
sg.setAttribute('position',new THREE.Float32BufferAttribute(sverts,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0x80c880,size:.15})));

// ── World ─────────────────────────────────────────────────────────
let worldRadius=0, worldTarget=3.5, worldMax=10;
const BLOCK_SIZE=1;

// Voxel world — store placed blocks
const blockMap=new Map();

// Ground plane (dark)
const groundGeo=new THREE.BoxGeometry(worldMax*2+2,.3,worldMax*2+2);
const groundMat=new THREE.MeshLambertMaterial({color:0x0a1808});
const groundMesh=new THREE.Mesh(groundGeo,groundMat);
groundMesh.receiveShadow=true; groundMesh.position.y=-.15;
scene.add(groundMesh);

// Grass blocks on ground (placed dynamically as world grows)
const grassPool=[];
function ensureGrassBlocks(){
  const r=Math.floor(worldRadius);
  for(let x=-r;x<=r;x++){
    for(let z=-r;z<=r;z++){
      if(x*x+z*z>worldRadius*worldRadius) continue;
      const k=`${x},${z}`;
      if(blockMap.has(k)) continue;
      const geo=new THREE.BoxGeometry(BLOCK_SIZE,.32,BLOCK_SIZE);
      // grass color varies slightly per block
      const hue=0.3+Math.random()*.05;
      const bright=.16+Math.random()*.06;
      const col=new THREE.Color().setHSL(hue,0.65,bright);
      const mat=new THREE.MeshLambertMaterial({color:col});
      const mesh=new THREE.Mesh(geo,mat);
      mesh.castShadow=false; mesh.receiveShadow=true;
      mesh.position.set(x+Math.random()*.0,0,z+Math.random()*.0);
      scene.add(mesh); blockMap.set(k,mesh);
    }
  }
}

// Edge ring
const ringGeo=new THREE.TorusGeometry(1,.07,8,128);
const ringMat=new THREE.MeshBasicMaterial({color:0x40ff40,transparent:true,opacity:.7});
const ring=new THREE.Mesh(ringGeo,ringMat);
ring.rotation.x=-Math.PI/2; ring.position.y=.18; scene.add(ring);

// Center core block (Minecraft beacon style)
const beaconGeo=new THREE.BoxGeometry(.6,.6,.6);
const beaconMat=new THREE.MeshBasicMaterial({color:0x40ff80,transparent:true,opacity:.85});
const beaconMesh=new THREE.Mesh(beaconGeo,beaconMat);
beaconMesh.position.y=.5; scene.add(beaconMesh);

// Beacon beam
const beamGeo=new THREE.CylinderGeometry(.08,.08,50,8);
const beamMat=new THREE.MeshBasicMaterial({color:0x40ff40,transparent:true,opacity:.12});
const beamMesh=new THREE.Mesh(beamGeo,beamMat);
beamMesh.position.set(0,25,.0); scene.add(beamMesh);

// ── NINJA TURTLE bot — Minecraft-voxel style ──────────────────────
// All geometry is BoxGeometry (no curves, true voxel)
function buildTurtleBot(sector,isManager){
  const g=new THREE.Group();
  const skinColor=isManager?0x2d5a1b:0x3a7a20; // green skin
  const shellColor=0x4a3a10; // dark brown shell
  const shellHighlight=0x6a5520;
  const bandColor=sector.bandana;
  const eyeWhite=0xeeeeff;
  const eyePupil=0x111122;
  const bandTailColor=bandColor;

  function box(w,h,d,col,emissive=null,emInt=0){
    const geo=new THREE.BoxGeometry(w,h,d);
    const mat=new THREE.MeshLambertMaterial({color:col});
    if(emissive!==null){mat.emissive=new THREE.Color(emissive);mat.emissiveIntensity=emInt;}
    const m=new THREE.Mesh(geo,mat);
    m.castShadow=true; m.receiveShadow=true; return m;
  }

  // LEGS (2 blocks)
  const legL=box(.28,.55,.28,skinColor); legL.position.set(-.17,-.55,0); g.add(legL);
  const legR=box(.28,.55,.28,skinColor); legR.position.set(.17,-.55,0); g.add(legR);

  // FEET
  const footL=box(.3,.14,.38,0x2a5010); footL.position.set(-.17,-.86,.05); g.add(footL);
  const footR=box(.3,.14,.38,0x2a5010); footR.position.set(.17,-.86,.05); g.add(footR);

  // TORSO (wider — turtle body)
  const torsoW=isManager?.78:.7;
  const torso=box(torsoW,.62,.44,skinColor); torso.position.set(0,.0,0); g.add(torso);

  // SHELL on back (flat slab + segments)
  const shell=box(torsoW-.06,.56,.18,shellColor); shell.position.set(0,.02,-.26); g.add(shell);
  // shell segment lines (boxes on top of shell)
  for(let sy=0;sy<2;sy++) for(let sx=0;sx<2;sx++){
    const seg=box(.26,.22,.04,shellHighlight);
    seg.position.set((sx-.5)*.24+.06,(sy-.5)*.22,-.33); g.add(seg);
  }
  // shell rim
  const shellRim=box(torsoW+.04,.6,.06,0x5a4a18); shellRim.position.set(0,.02,-.18); g.add(shellRim);

  // BELT / wrapping (colored strip at waist)
  const belt=box(torsoW+.02,.1,.48,bandColor); belt.position.set(0,-.08,-.02); g.add(belt);
  // knee pads
  const kneL=box(.32,.16,.32,bandColor); kneL.position.set(-.17,-.3,0); g.add(kneL);
  const kneR=box(.32,.16,.32,bandColor); kneR.position.set(.17,-.3,0); g.add(kneR);

  // ARMS — turtle arms are chunky
  const armW=isManager?.24:.22;
  const armPivotL=new THREE.Group(); armPivotL.position.set(-(torsoW*.5+armW*.5+.02),.15,0);
  const armMeshL=box(armW,.55,armW,skinColor); armMeshL.position.y=-.2; armPivotL.add(armMeshL);
  g.add(armPivotL);
  const armPivotR=new THREE.Group(); armPivotR.position.set(torsoW*.5+armW*.5+.02,.15,0);
  const armMeshR=box(armW,.55,armW,skinColor); armMeshR.position.y=-.2; armPivotR.add(armMeshR);
  g.add(armPivotR);

  // Elbow pads
  const elbL=box(armW+.06,.16,armW+.06,bandColor); elbL.position.set(0,-.1,0); armPivotL.add(elbL);
  const elbR=box(armW+.06,.16,armW+.06,bandColor); elbR.position.set(0,-.1,0); armPivotR.add(elbR);

  // FISTS (block fists)
  const fistL=box(.28,.28,.28,skinColor); fistL.position.set(0,-.48,0); armPivotL.add(fistL);
  const fistR=box(.28,.28,.28,skinColor); fistR.position.set(0,-.48,0); armPivotR.add(fistR);

  // NECK
  const neck=box(.3,.18,.3,skinColor); neck.position.set(0,.4,0); g.add(neck);

  // HEAD — wide square turtle head
  const headGroup=new THREE.Group(); headGroup.position.set(0,.58,0);
  const headW=isManager?.68:.62;
  const headBlock=box(headW,.54,.52,skinColor); headBlock.position.y=.27; headGroup.add(headBlock);

  // BANDANA — colored band across face, tied at back with tails
  const band=box(headW+.04,.2,.08,bandColor); band.position.set(0,.34,.3); headGroup.add(band);
  const bandBack=box(.06,.18,.55,bandColor); bandBack.position.set(0,.34,-.02); headGroup.add(bandBack);
  // bandana knot
  const knot=box(.14,.14,.1,bandTailColor); knot.position.set(0,.34,-.32); headGroup.add(knot);
  // bandana tails hanging
  const tailL=box(.08,.28,.06,bandTailColor); tailL.position.set(-.12,.18,-.3); tailL.rotation.z=.15; headGroup.add(tailL);
  const tailR=box(.08,.28,.06,bandTailColor); tailR.position.set(.12,.18,-.3); tailR.rotation.z=-.15; headGroup.add(tailR);

  // EYES — white square eyes with square pupils
  const eyeL=box(.18,.16,.06,eyeWhite); eyeL.position.set(-.14,.36,.3); headGroup.add(eyeL);
  const eyeR=box(.18,.16,.06,eyeWhite); eyeR.position.set(.14,.36,.3); headGroup.add(eyeR);
  const pupL=box(.09,.09,.06,eyePupil); pupL.position.set(-.14,.36,.33); headGroup.add(pupL);
  const pupR=box(.09,.09,.06,eyePupil); pupR.position.set(.14,.36,.33); headGroup.add(pupR);
  // eye glow
  const eyeGlow=new THREE.PointLight(bandColor,.4,1.5);
  eyeGlow.position.set(0,.36,.35); headGroup.add(eyeGlow);

  // NOSE
  const nose=box(.12,.1,.06,0x2a5010); nose.position.set(0,.26,.31); headGroup.add(nose);

  // MOUTH (line)
  const mouth=box(.22,.05,.04,0x1a3a08); mouth.position.set(0,.18,.31); headGroup.add(mouth);

  // Manager gets a HEADBAND / crown
  if(isManager){
    const crown=box(headW+.06,.14,.54,0xffd700); crown.position.set(0,.56,.01); headGroup.add(crown);
    // crown points
    for(let i=0;i<3;i++){
      const pt=box(.1,.22,.1,0xffcc00); pt.position.set((i-1)*.22,.72,.01); headGroup.add(pt);
    }
  }

  g.add(headGroup);

  // Weapons slot (manager has staff, others have tools)
  if(isManager){
    const staff=box(.06,1.1,.06,0x6a4010); staff.position.set(.5,.1,-.1);
    const staffTop=box(.18,.18,.18,0xffd700); staffTop.position.set(.5,.68,-.1);
    g.add(staff); g.add(staffTop);
  }

  g.userData={legL,legR,armPivotL,armPivotR,headGroup,eyeGlow,belt,isManager};
  g.scale.setScalar(isManager?0.82:0.58);
  return g;
}

// ── Minecraft structures ──────────────────────────────────────────
const structures=[];
function spawnStructure(x,z,sector){
  const g=new THREE.Group();
  function vox(w,h,d,col){
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:col}));
    m.castShadow=true; m.receiveShadow=true; return m;
  }
  const c=sector.bandana;

  switch(sector.key){
    case 'content': {
      // Camera tower
      const base=vox(.7,.7,.7,0x334444); base.position.y=.35; g.add(base);
      const tower=vox(.4,.8,.4,0x445555); tower.position.y=1.1; g.add(tower);
      const lens=vox(.35,.35,.35,c); lens.position.set(0,1.6,.2); g.add(lens);
      const beam=vox(.06,.06,.5,c); beam.position.set(0,1.6,.5); beam.material.emissive=new THREE.Color(c); beam.material.emissiveIntensity=.4; g.add(beam);
      break;}
    case 'stocked': {
      // Crate stack
      for(let i=0;i<3;i++){
        const cr=vox(.7-(i*.05),.55-(i*.03),.7-(i*.05),i===0?0x6a4a18:i===1?0x7a5a22:c);
        cr.position.y=.28+i*.56; g.add(cr);
      }
      break;}
    case 'athletic': {
      // Podium
      for(let i=0;i<3;i++){
        const b=vox(.9-(i*.22),.35,.9-(i*.22),i===0?0x880000:i===1?c:0xcc3333);
        b.position.y=.18+i*.35; g.add(b);
      }
      const star=vox(.22,.22,.22,0xffdd00); star.position.y=1.28; star.material.emissive=new THREE.Color(0xffdd00); star.material.emissiveIntensity=.5; g.add(star);
      break;}
    case 'creative': {
      // Art easel (blocky)
      const canvas=vox(.65,.55,.06,0xeef0e0); canvas.position.set(0,.7,.05); g.add(canvas);
      // colored patch on canvas
      const patch=vox(.4,.3,.06,c); patch.position.set(0,.7,.09); g.add(patch);
      const leg1=vox(.07,.65,.07,0x6a5020); leg1.position.set(-.2,.28,-.15); leg1.rotation.x=.2; g.add(leg1);
      const leg2=vox(.07,.65,.07,0x6a5020); leg2.position.set(.2,.28,-.15); leg2.rotation.x=.2; g.add(leg2);
      break;}
    case 'hq': {
      // Command block (minecraft tribute)
      const cmd=vox(.9,.9,.9,0x6633aa);
      cmd.material.emissive=new THREE.Color(c); cmd.material.emissiveIntensity=.15;
      cmd.position.y=.45; g.add(cmd);
      // X pattern
      const x1=vox(.72,.12,.12,c); x1.position.y=.45; x1.material.emissive=new THREE.Color(c); x1.material.emissiveIntensity=.4; g.add(x1);
      const x2=vox(.12,.72,.12,c); x2.position.y=.45; x2.material.emissive=new THREE.Color(c); x2.material.emissiveIntensity=.4; g.add(x2);
      const antenna=vox(.1,1.1,.1,0x442266); antenna.position.y=1.35; g.add(antenna);
      const tip=vox(.18,.18,.18,c); tip.position.y=1.97; tip.material.emissive=new THREE.Color(c); tip.material.emissiveIntensity=.6; g.add(tip);
      break;}
  }

  // point light under
  const pl=new THREE.PointLight(sector.color,.4,3);
  pl.position.y=.5; g.add(pl);
  g.position.set(x,.01,z);
  g.scale.setScalar(.01);
  scene.add(g);
  structures.push({mesh:g,target:.7+Math.random()*.4,age:0,sector});
}

// ── Particles (block debris) ──────────────────────────────────────
const particleGroups=[];
function spawnParticles(x,z,color){
  const group=new THREE.Group();
  const vels=[];
  for(let i=0;i<10;i++){
    const s=.06+Math.random()*.1;
    const cube=new THREE.Mesh(new THREE.BoxGeometry(s,s,s),new THREE.MeshLambertMaterial({color}));
    cube.position.set(x,0.3,z);
    const a=Math.random()*Math.PI*2;
    vels.push({vx:Math.cos(a)*.07,vy:.06+Math.random()*.1,vz:Math.sin(a)*.07});
    scene.add(cube); group.userData[`c${i}`]={mesh:cube,...vels[i]};
  }
  group.userData.life=1; group.userData.vels=vels; group.userData.count=10;
  scene.add(group); particleGroups.push(group);
}

// ── Bot class ─────────────────────────────────────────────────────
const bots=[];
const MAX_BOTS=SECTORS.length*4;

class TurtleBot {
  constructor(sector,isManager=false){
    this.sector=sector; this.isManager=isManager;
    this.mesh=buildTurtleBot(sector,isManager);
    const a=sector.angle+(Math.random()-.5)*.5;
    const r=isManager?.6:1.2+Math.random()*2.2;
    this.mesh.position.set(Math.cos(a)*r,.01,Math.sin(a)*r);
    this.mesh.rotation.y=Math.random()*Math.PI*2;
    scene.add(this.mesh);
    this.tx=this.mesh.position.x; this.tz=this.mesh.position.z;
    this.speed=isManager?.014:.02+Math.random()*.012;
    this.state='idle'; this.buildTimer=0; this.buildPos=null;
    this.idleTimer=Math.floor(Math.random()*80);
    this.t=Math.random()*100;
    this.name=isManager?`MASTER-${sector.key.toUpperCase().slice(0,4)}`:`${sector.bandName.slice(0,3)}-${String(Math.floor(Math.random()*99)).padStart(2,'0')}`;
    this.scaleT=this.mesh.scale.x; this.mesh.scale.setScalar(.01);
    this.built=0;
  }

  update(dt){
    this.t+=dt;
    const u=this.mesh.userData;

    // grow in
    if(this.mesh.scale.x<this.scaleT) this.mesh.scale.setScalar(Math.min(this.scaleT,this.mesh.scale.x+.04));

    // eye glow pulse
    u.eyeGlow.intensity=.3+Math.sin(this.t*2.2)*.15;

    if(this.state==='idle'){
      // head bob
      if(u.headGroup) u.headGroup.rotation.y=Math.sin(this.t*.7)*.15;
      if(--this.idleTimer<=0){this.chooseTarget();this.state='walk';} return;
    }

    if(this.state==='build'){
      // arm swing while building
      if(u.armPivotL) u.armPivotL.rotation.x=(-Math.PI*.6)+Math.sin(this.t*4)*.35;
      if(u.armPivotR) u.armPivotR.rotation.x=(-Math.PI*.5)+Math.sin(this.t*4+1.2)*.35;
      if(u.headGroup) u.headGroup.rotation.x=-.25;
      if(--this.buildTimer<=0) this.finishBuild(); return;
    }

    const dx=this.tx-this.mesh.position.x, dz=this.tz-this.mesh.position.z;
    const dist=Math.sqrt(dx*dx+dz*dz);
    if(dist<.06){
      this.mesh.position.x=this.tx; this.mesh.position.z=this.tz;
      const r=Math.sqrt(this.mesh.position.x**2+this.mesh.position.z**2);
      if(r<worldRadius*.86&&Math.random()<.55&&!this.isManager){
        this.state='build'; this.buildTimer=70+Math.random()*80;
        this.buildPos={x:this.mesh.position.x,z:this.mesh.position.z};
      } else { this.state='idle'; this.idleTimer=30+Math.floor(Math.random()*60); }
    } else {
      this.mesh.rotation.y=Math.atan2(dx,dz);
      this.mesh.position.x+=dx/dist*this.speed;
      this.mesh.position.z+=dz/dist*this.speed;
      // walk bounce
      const wb=Math.sin(this.t*7)*dt*.006;
      this.mesh.position.y=.01+Math.abs(Math.sin(this.t*7))*.04;
      // leg swing
      if(u.legL) u.legL.rotation.x=Math.sin(this.t*7)*.3;
      if(u.legR) u.legR.rotation.x=-Math.sin(this.t*7)*.3;
      if(u.armPivotL) u.armPivotL.rotation.x=-Math.sin(this.t*7)*.25;
      if(u.armPivotR) u.armPivotR.rotation.x=Math.sin(this.t*7)*.25;
      if(u.headGroup) { u.headGroup.rotation.x=0; u.headGroup.rotation.y=Math.sin(this.t*3)*.08; }
    }
  }

  chooseTarget(){
    const a=this.sector.angle+(Math.random()-.5)*(this.isManager?.7:1.05);
    const r=this.isManager?.4+Math.random()*worldRadius*.35:.2+Math.random()*worldRadius*.8;
    this.tx=Math.cos(a)*r; this.tz=Math.sin(a)*r;
  }

  finishBuild(){
    spawnStructure(this.buildPos.x,this.buildPos.z,this.sector);
    spawnParticles(this.buildPos.x,this.buildPos.z,this.sector.color);
    this.built++; this.state='idle'; this.idleTimer=20;
    if(this.mesh.userData.armPivotL) this.mesh.userData.armPivotL.rotation.x=0;
    if(this.mesh.userData.armPivotR) this.mesh.userData.armPivotR.rotation.x=0;
    if(this.mesh.userData.headGroup) this.mesh.userData.headGroup.rotation.x=0;
    const tasks=this.sector.tasks;
    addLog(this.sector,this.name,tasks[Math.floor(Math.random()*tasks.length)]);
    updateStats();
  }
}

// ── Feed & stats ──────────────────────────────────────────────────
function addLog(sector,name,msg){
  const feed=document.getElementById('feed');
  const el=document.createElement('div'); el.className='log';
  el.style.borderLeftColor=sector.hex;
  el.innerHTML=`<span class="who" style="color:${sector.hex}">${name}</span>${msg}`;
  feed.prepend(el);
  while(feed.children.length>3) feed.removeChild(feed.lastChild);
}
function updateStats(){
  document.getElementById('p-bots').textContent=`TURTLES ${bots.length}`;
  document.getElementById('p-built').textContent=`BUILT ${structures.length}`;
  document.getElementById('p-exp').textContent=`WORLD ${Math.round(worldRadius/worldMax*100)}%`;
}

// ── Main loop ─────────────────────────────────────────────────────
const clock=new THREE.Clock();
let totalFrames=0, spawnTimer=0, growTimer=0;

function loop(){
  requestAnimationFrame(loop);
  const dt=clock.getDelta()*60;
  totalFrames++;

  // World grow
  worldRadius+=(worldTarget-worldRadius)*.016;
  ring.scale.setScalar(worldRadius/worldMax);
  growTimer+=dt;
  if(growTimer>200){ worldTarget=Math.min(worldMax,worldTarget+.6+Math.random()*.8); growTimer=0; }
  if(totalFrames%8===0) ensureGrassBlocks();

  // Spawn turtles
  spawnTimer+=dt;
  if(spawnTimer>260&&bots.length<MAX_BOTS&&worldRadius>2){
    SECTORS.forEach(s=>{
      if(!bots.some(b=>b.isManager&&b.sector===s)){
        const b=new TurtleBot(s,true); bots.push(b);
        addLog(s,b.name,`Sensei of ${s.label}`);
        updateStats();
      }
    });
    if(bots.length<MAX_BOTS){
      const s=SECTORS[Math.floor(Math.random()*SECTORS.length)];
      const b=new TurtleBot(s,false); bots.push(b);
      addLog(s,b.name,`COWABUNGA!`);
      updateStats();
    }
    spawnTimer=0;
  }

  // Update bots
  bots.forEach(b=>{
    const r=Math.sqrt(b.mesh.position.x**2+b.mesh.position.z**2);
    if(r>worldRadius*.9&&b.state==='walk'){ b.tx=b.mesh.position.x*.35; b.tz=b.mesh.position.z*.35; }
    b.update(dt);
  });

  // Grow structures
  structures.forEach(s=>{
    s.age+=dt;
    if(s.mesh.scale.x<s.target) s.mesh.scale.setScalar(Math.min(s.target,s.mesh.scale.x+.05*dt));
    s.mesh.rotation.y+=.002*dt;
  });

  // Block particles
  for(let i=particleGroups.length-1;i>=0;i--){
    const pg=particleGroups[i];
    pg.userData.life-=.018*dt;
    for(let j=0;j<pg.userData.count;j++){
      const cv=pg.userData[`c${j}`];
      if(!cv||!cv.mesh) continue;
      cv.mesh.position.x+=cv.vx*dt; cv.mesh.position.y+=cv.vy*dt; cv.mesh.position.z+=cv.vz*dt;
      cv.vy-=.002*dt;
      cv.mesh.material.opacity=pg.userData.life;
      cv.mesh.material.transparent=true;
      cv.mesh.rotation.x+=.05*dt; cv.mesh.rotation.z+=.04*dt;
    }
    if(pg.userData.life<=0){
      for(let j=0;j<pg.userData.count;j++){
        const cv=pg.userData[`c${j}`]; if(cv&&cv.mesh) scene.remove(cv.mesh);
      }
      scene.remove(pg); particleGroups.splice(i,1);
    }
  }

  // Core pulse
  const cp=Date.now()*.001;
  coreLight.intensity=3+Math.sin(cp*2)*1;
  beaconMesh.material.opacity=.7+Math.sin(cp*1.5)*.2;
  beamMesh.material.opacity=.08+Math.sin(cp)*.04;
  beaconMesh.rotation.y+=.01*dt;

  // Slow camera orbit
  const ca=totalFrames*.0004;
  camera.position.x=Math.sin(ca)*14;
  camera.position.z=Math.cos(ca)*11;
  camera.position.y=12.5+Math.sin(ca*.4);
  camera.lookAt(0,.5,0);

  // Manager check-ins
  if(totalFrames%320===0){
    const mgrs=bots.filter(b=>b.isManager);
    if(mgrs.length){
      const m=mgrs[Math.floor(Math.random()*mgrs.length)];
      const lines=['Turtle power!','Delegating tasks','Shell check — all clear','Reviewing sector','Syncing the crew'];
      addLog(m.sector,m.name,lines[Math.floor(Math.random()*lines.length)]);
    }
  }

  renderer.render(scene,camera);
}

setTimeout(()=>{
  worldTarget=3.2;
  addLog(SECTORS[4],'MASTER-HQ','Bot Crossing awakens...');
  loop();
},100);
</script>
