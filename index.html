<title>Bot Crossing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#030201;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#topbar{position:absolute;top:max(14px,env(safe-area-inset-top,0px));
left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
display:flex;align-items:center;justify-content:space-between;gap:8px}
#logo{font-family:'Orbitron',monospace;font-size:clamp(11px,1.8vw,16px);font-weight:900;
letter-spacing:.18em;color:#b89050;text-shadow:0 0 16px #b8905066,0 0 40px #b8905022}
#clock{font-family:'Orbitron',monospace;font-size:clamp(9px,1.3vw,12px);color:#608850;
letter-spacing:.1em;background:rgba(0,0,0,.75);padding:3px 10px;
border:1px solid rgba(80,120,40,.35);border-radius:3px}
#feed{position:absolute;bottom:max(14px,env(safe-area-inset-bottom,0px));
left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
display:flex;flex-direction:column;gap:4px;max-height:90px;overflow:hidden}
.log{font-family:'VT323',monospace;font-size:15px;color:#485848;padding:4px 12px;
background:rgba(2,4,2,.92);border-left:2px solid #304820;border-radius:0 3px 3px 0;
animation:sl .35s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .who{font-weight:600;margin-right:7px}
@keyframes sl{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#cam-label{position:absolute;bottom:max(120px,120px);left:50%;transform:translateX(-50%);
font-family:'Orbitron',monospace;font-size:clamp(9px,1.2vw,11px);font-weight:700;
letter-spacing:.22em;color:rgba(180,150,80,.55);text-align:center;pointer-events:none}
</style>

<canvas id="c"></canvas>
<div id="hud">
  <div id="topbar">
    <div id="logo">BOT CROSSING Â· SEWER LAIR</div>
    <div id="clock">00:00:00</div>
  </div>
  <div id="feed"></div>
  <div id="cam-label"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ââ Renderer & Scene âââââââââââââââââââââââââââââââââââââââââââââ
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ReinhardToneMapping;
renderer.toneMappingExposure = 1.8;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020100);
scene.fog = new THREE.FogExp2(0x020100, 0.038);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 250);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

// ââ Rooms & Tunnel Config âââââââââââââââââââââââââââââââââââââââââ
const ROOMS = [
  {key:'hub',   label:'THE SEWER LAIR',       x:0,   z:0,   color:0xc8a050, radius:5.0, name:'HUB',          tasks:null, isTurtle:false},
  {key:'leo',   label:"LEO'S DOJO",            x:-13, z:-10, color:0x2266cc, radius:3.8, name:'LEONARDO',      bandana:0x2266cc,
    tasks:['Post AM workout reel','Morning training film','Technique breakdown','Athlete routine','Discipline post','Kata session reel']},
  {key:'don',   label:"DON'S LAB",             x:13,  z:-10, color:0x8822bb, radius:3.8, name:'DONATELLO',     bandana:0x8822bb,
    tasks:['Prototype v2 spec','User research loop','App wireframe','Backend schema','Supplier outreach','Pitch deck slide']},
  {key:'raph',  label:"RAPH'S GYM",            x:-13, z:10,  color:0xcc2222, radius:3.8, name:'RAPHAEL',       bandana:0xcc2222,
    tasks:['Design drop concept','Launch campaign','Sample request','Brand guide','Collab pitch','Drop teaser reel']},
  {key:'mikey', label:"MIKEY'S STUDIO",        x:13,  z:10,  color:0xdd7700, radius:3.8, name:'MICHELANGELO',  bandana:0xdd7700,
    tasks:['Gallery concept','Merch design','Cheat day haul','Cook-along video','COWABUNGA post','Art timelapse']},
  {key:'spl',   label:"SPLINTER'S WAR ROOM",   x:0,   z:15,  color:0x449933, radius:3.5, name:'SPLINTER',      bandana:0x449933, isSplinter:true,
    tasks:['Sprint planning','OKR review','Roadmap update','Team stand-up','Weekly recap','Assess the mission']},
];

const TUNNELS = [
  {from:'hub',to:'leo'},{from:'hub',to:'don'},
  {from:'hub',to:'raph'},{from:'hub',to:'mikey'},{from:'hub',to:'spl'},
];

// ââ Shared Materials ââââââââââââââââââââââââââââââââââââââââââââââ
const M = {
  brick:  new THREE.MeshStandardMaterial({color:0x1a1008, roughness:0.95, metalness:0.0}),
  floor:  new THREE.MeshStandardMaterial({color:0x0d0a06, roughness:1.0,  metalness:0.0}),
  ground: new THREE.MeshStandardMaterial({color:0x050402, roughness:1.0,  metalness:0.0}),
  water:  new THREE.MeshStandardMaterial({color:0x0a1828, roughness:0.05, metalness:0.6, transparent:true, opacity:0.82}),
  green:  new THREE.MeshStandardMaterial({color:0x3a7820, roughness:0.8,  metalness:0.0}),
  shell:  new THREE.MeshStandardMaterial({color:0x3d2e10, roughness:0.85, metalness:0.0}),
  bodyGreen: new THREE.MeshStandardMaterial({color:0x3a8020, roughness:0.8, metalness:0.0}),
};

// ââ Ambient & Directional Light âââââââââââââââââââââââââââââââââââ
scene.add(new THREE.AmbientLight(0x110e08, 0.25));
const dirLight = new THREE.DirectionalLight(0xffe8a0, 0.15);
dirLight.position.set(0, 20, 0);
scene.add(dirLight);

// ââ Ground ââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
const groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(120, 120, 1, 1), M.ground);
groundMesh.rotation.x = -Math.PI/2;
groundMesh.receiveShadow = true;
scene.add(groundMesh);

// ââ Build Rooms âââââââââââââââââââââââââââââââââââââââââââââââââââ
ROOMS.forEach(room => {
  const g = new THREE.Group();
  g.position.set(room.x, 0, room.z);
  scene.add(g);
  room.group = g;

  // Platform disk
  const platGeo = new THREE.CylinderGeometry(room.radius, room.radius+0.35, 0.35, 32);
  const platMat = new THREE.MeshStandardMaterial({color:0x0b0b07, roughness:0.95});
  const plat = new THREE.Mesh(platGeo, platMat);
  plat.position.y = 0.175;
  plat.receiveShadow = true;
  g.add(plat);

  // Brick wall segments
  const nWalls = Math.round(room.radius * 3.6);
  for (let i = 0; i < nWalls; i++) {
    const ang = (i/nWalls)*Math.PI*2;
    const ww = (Math.PI*2*room.radius/nWalls)*0.88;
    const wGeo = new THREE.BoxGeometry(ww, 2.0, 0.42);
    const w = new THREE.Mesh(wGeo, M.brick);
    w.position.set(Math.cos(ang)*(room.radius+0.22), 1.35, Math.sin(ang)*(room.radius+0.22));
    w.rotation.y = ang + Math.PI/2;
    w.castShadow = true; w.receiveShadow = true;
    g.add(w);
  }

  // Glowing accent ring at platform edge
  const ringGeo = new THREE.TorusGeometry(room.radius-0.05, 0.07, 8, 64);
  const ringMat = new THREE.MeshStandardMaterial({
    color:room.color, emissive:room.color, emissiveIntensity:0.9
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI/2;
  ring.position.y = 0.38;
  g.add(ring);
  room.ringMat = ringMat;

  // Point light above room center
  const ptLight = new THREE.PointLight(room.color, 1.4, room.radius*4.2, 2);
  ptLight.position.set(0, 5.5, 0);
  ptLight.castShadow = true;
  ptLight.shadow.mapSize.set(512, 512);
  g.add(ptLight);
  room.ptLight = ptLight;

  // Ceiling lamp fixture
  const lampGeo = new THREE.CylinderGeometry(0.08, 0.22, 0.3, 8);
  const lampMat = new THREE.MeshStandardMaterial({color:0x2a2010, roughness:0.6, metalness:0.5});
  const lamp = new THREE.Mesh(lampGeo, lampMat);
  lamp.position.y = 5.8;
  g.add(lamp);
  const bulbGeo = new THREE.SphereGeometry(0.14, 8, 6);
  const bulbMat = new THREE.MeshStandardMaterial({
    color:room.color, emissive:room.color, emissiveIntensity:2.0
  });
  const bulb = new THREE.Mesh(bulbGeo, bulbMat);
  bulb.position.y = 5.45;
  g.add(bulb);
  room.bulbMat = bulbMat;

  // Hub extras: water channel, manhole
  if (room.key === 'hub') {
    const waterGeo = new THREE.BoxGeometry(2.8, 0.08, 5.0);
    const water = new THREE.Mesh(waterGeo, M.water);
    water.position.set(0, 0.4, 0.5);
    g.add(water);
    room.waterMesh = water;

    // Manhole circle
    const mhGeo = new THREE.CylinderGeometry(0.9, 0.9, 0.08, 24);
    const mhMat = new THREE.MeshStandardMaterial({color:0x2a1e08, roughness:0.7, metalness:0.4});
    const mh = new THREE.Mesh(mhGeo, mhMat);
    mh.position.set(0, 0.38, -2.5);
    g.add(mh);
    // Manhole glow from above
    const mhLight = new THREE.SpotLight(0xffe880, 0.8, 8, Math.PI/10, 0.5, 2);
    mhLight.position.set(0, 7, -2.5);
    mhLight.target.position.set(0, 0, -2.5);
    g.add(mhLight); g.add(mhLight.target);
  }
});

// ââ Build Tunnels âââââââââââââââââââââââââââââââââââââââââââââââââ
TUNNELS.forEach(tn => {
  const r1 = ROOMS.find(r => r.key === tn.from);
  const r2 = ROOMS.find(r => r.key === tn.to);
  const v1 = new THREE.Vector3(r1.x, 0, r1.z);
  const v2 = new THREE.Vector3(r2.x, 0, r2.z);
  const dir = v2.clone().sub(v1);
  const len = dir.length();
  const usable = len - r1.radius - r2.radius - 0.4;
  if (usable <= 0) return;
  const mid = v1.clone().add(dir.clone().normalize().multiplyScalar(r1.radius + usable/2 + 0.2));
  const ang = Math.atan2(dir.x, dir.z);

  // Floor
  const fGeo = new THREE.BoxGeometry(1.9, 0.2, usable);
  const fMesh = new THREE.Mesh(fGeo, M.floor);
  fMesh.position.set(mid.x, 0.1, mid.z);
  fMesh.rotation.y = ang;
  fMesh.receiveShadow = true;
  scene.add(fMesh);

  // Side walls
  [-1, 1].forEach(side => {
    const wGeo = new THREE.BoxGeometry(0.3, 1.6, usable);
    const wMesh = new THREE.Mesh(wGeo, M.brick);
    wMesh.position.set(
      mid.x + Math.cos(ang)*side*0.95,
      0.9,
      mid.z - Math.sin(ang)*side*0.95
    );
    wMesh.rotation.y = ang;
    wMesh.castShadow = true; wMesh.receiveShadow = true;
    scene.add(wMesh);
  });

  // Pipe along tunnel wall
  const pGeo = new THREE.CylinderGeometry(0.09, 0.09, usable, 8);
  const pMat = new THREE.MeshStandardMaterial({color:0x4a3010, roughness:0.8, metalness:0.25});
  const pipe = new THREE.Mesh(pGeo, pMat);
  pipe.position.set(mid.x + Math.cos(ang)*0.7, 1.4, mid.z - Math.sin(ang)*0.7);
  pipe.rotation.set(0, ang, Math.PI/2);
  scene.add(pipe);
});

// ââ Ambient Sewer Pipes (crossing the ground) âââââââââââââââââââââ
[[-5,0,0,40,0],[5,0.15,0,35,0.05],[0,0.25,3,28,Math.PI/2],[0,0.32,-4,22,Math.PI/2]].forEach(([px,py,pz,plen,ra]) => {
  const pGeo = new THREE.CylinderGeometry(0.14, 0.14, plen, 8);
  const pMat = new THREE.MeshStandardMaterial({color:0x3a2808, roughness:0.85, metalness:0.3});
  const p = new THREE.Mesh(pGeo, pMat);
  p.position.set(px, py + 0.25, pz);
  p.rotation.set(0, ra, Math.PI/2);
  scene.add(p);
});

// ââ Turtle Factory ââââââââââââââââââââââââââââââââââââââââââââââââ
function mkTurtle(room) {
  const g = new THREE.Group();
  const c = room.bandana || 0x888888;

  if (room.isSplinter) {
    // Robe body
    const bodyGeo = new THREE.SphereGeometry(0.52, 12, 8);
    const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({color:0x2e3820, roughness:0.9}));
    body.scale.y = 0.78;
    body.position.y = 0.52;
    g.add(body);
    // Head
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 8),
      new THREE.MeshStandardMaterial({color:0x5a4030, roughness:0.8}));
    head.position.set(0, 1.12, 0.08);
    g.add(head);
    // Snout
    const snout = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6),
      new THREE.MeshStandardMaterial({color:0x4a3020, roughness:0.85}));
    snout.scale.set(1, 0.7, 1.2);
    snout.position.set(0, 1.06, 0.38);
    g.add(snout);
    // Ears
    [-1,1].forEach(s => {
      const ear = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6),
        new THREE.MeshStandardMaterial({color:0x5a4030, roughness:0.8}));
      ear.position.set(s*0.22, 1.36, 0.02);
      g.add(ear);
      const innerEar = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 5),
        new THREE.MeshStandardMaterial({color:0x8a5040, roughness:0.8}));
      innerEar.position.set(s*0.22, 1.36, 0.08);
      g.add(innerEar);
    });
    // Eyes (glowing)
    [-1,1].forEach(s => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.055, 6, 6),
        new THREE.MeshStandardMaterial({color:0x88ff44, emissive:0x44ff00, emissiveIntensity:1.2}));
      eye.position.set(s*0.1, 1.14, 0.36);
      g.add(eye);
    });
    // Staff
    const staff = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.025, 1.9, 6),
      new THREE.MeshStandardMaterial({color:0x6a4818, roughness:0.8}));
    staff.position.set(0.32, 0.82, -0.08);
    staff.rotation.z = 0.28;
    g.add(staff);
    // Robe details (simple vertical cylinder stripes)
    const robe = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.52, 0.7, 16),
      new THREE.MeshStandardMaterial({color:0x1e2814, roughness:0.9}));
    robe.position.y = 0.38;
    g.add(robe);
  } else {
    // Shell (flattened sphere)
    const shellGeo = new THREE.SphereGeometry(0.52, 14, 10);
    const shell = new THREE.Mesh(shellGeo, M.shell);
    shell.scale.y = 0.52;
    shell.position.y = 0.48;
    g.add(shell);

    // Shell ridge lines (dark torus rings) - 2 cross rings
    const ridgeMat = new THREE.MeshStandardMaterial({color:0x1a1208, roughness:0.9});
    [0, Math.PI/2].forEach(ra => {
      const ridge = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.025, 6, 18), ridgeMat);
      ridge.scale.y = 0.52;
      ridge.position.y = 0.48;
      ridge.rotation.y = ra;
      g.add(ridge);
    });

    // Body underside
    const bodyBot = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.44, 0.28, 16), M.green);
    bodyBot.position.y = 0.22;
    g.add(bodyBot);

    // Head
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 10, 8), M.bodyGreen);
    head.position.set(0, 0.74, 0.36);
    g.add(head);

    // Bandana strip
    const bandMat = new THREE.MeshStandardMaterial({
      color:c, emissive:c, emissiveIntensity:0.35, roughness:0.75
    });
    const band = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.09), bandMat);
    band.position.set(0, 0.8, 0.48);
    g.add(band);
    room.bandanaMat = bandMat;

    // Bandana tails (2 strips hanging back)
    const tailMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(c).multiplyScalar(0.55).getHex(), roughness:0.8
    });
    [-0.12, 0.12].forEach((ox, i) => {
      const tail = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.16, 0.04), tailMat);
      tail.position.set(ox, 0.65, 0.26);
      tail.rotation.z = (i === 0 ? -0.2 : 0.2);
      g.add(tail);
    });

    // Eyes (colored irises, glowing)
    const eyeMat = new THREE.MeshStandardMaterial({color:c, emissive:c, emissiveIntensity:0.75});
    [-0.09, 0.09].forEach(ex => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.055, 6, 6), eyeMat);
      eye.position.set(ex, 0.8, 0.57);
      g.add(eye);
    });

    // Limbs (4 small spheres)
    const limbMat = new THREE.MeshStandardMaterial({color:0x2d6018, roughness:0.9});
    const LIMB_ANGLES = [
      Math.PI*0.125, Math.PI*0.875, Math.PI*1.125, Math.PI*1.875
    ];
    LIMB_ANGLES.forEach((ang, idx) => {
      const limb = new THREE.Mesh(new THREE.SphereGeometry(0.13, 7, 6), limbMat);
      limb.position.set(Math.sin(ang)*0.54, 0.2, Math.cos(ang)*0.54);
      limb.userData.idx = idx;
      limb.userData.baseY = 0.2;
      g.add(limb);
    });
  }

  // Work glow light
  const workLight = new THREE.PointLight(c, 0, 2.5, 2);
  workLight.position.y = 1.8;
  g.add(workLight);
  g.userData.workLight = workLight;
  g.userData.room = room;

  return g;
}

// ââ Turtle State Machines âââââââââââââââââââââââââââââââââââââââââ
const TURTLES = ROOMS.filter(r => r.bandana).map(room => {
  const group = mkTurtle(room);
  group.position.set(room.x, 0, room.z);
  scene.add(group);
  return {
    room, group,
    x: room.x, z: room.z,
    tx: room.x, tz: room.z,
    walkPhase: Math.random()*Math.PI*2,
    state: 'idle',
    idleTimer: Math.random()*80+20,
    buildTimer: 0,
  };
});

// ââ Steam Particle System âââââââââââââââââââââââââââââââââââââââââ
const STEAM_COUNT = 80;
const steamPositions = new Float32Array(STEAM_COUNT * 3);
const steamVelocities = [];
const steamLife = new Float32Array(STEAM_COUNT);
for (let i = 0; i < STEAM_COUNT; i++) {
  steamPositions[i*3] = (Math.random()-0.5)*20;
  steamPositions[i*3+1] = Math.random()*5;
  steamPositions[i*3+2] = (Math.random()-0.5)*20;
  steamVelocities.push({vx:(Math.random()-.5)*0.3, vy:0.4+Math.random()*0.3, vz:(Math.random()-.5)*0.3});
  steamLife[i] = Math.random();
}
const steamGeo = new THREE.BufferGeometry();
steamGeo.setAttribute('position', new THREE.BufferAttribute(steamPositions, 3));
const steamMat = new THREE.PointsMaterial({color:0x8a7a50, size:0.22, transparent:true, opacity:0.18, sizeAttenuation:true, depthWrite:false});
const steamPoints = new THREE.Points(steamGeo, steamMat);
scene.add(steamPoints);

// ââ Camera Positions ââââââââââââââââââââââââââââââââââââââââââââââ
const CAM_SHOTS = [
  // Hub overview
  {pos:[0, 14, 18],       target:[0, 0, 0]},
  // Leo
  {pos:[-18, 8, -6],      target:[-13, 0.5, -10]},
  // Don
  {pos:[18, 8, -6],       target:[13, 0.5, -10]},
  // Raph
  {pos:[-18, 8, 14],      target:[-13, 0.5, 10]},
  // Mikey
  {pos:[18, 8, 14],       target:[13, 0.5, 10]},
  // Splinter
  {pos:[0, 8, 22],        target:[0, 0.5, 15]},
  // Cinematic wide (all rooms)
  {pos:[0, 30, 22],       target:[0, 0, 2]},
];

let camIdx = 0, camTimer = 0;
const CAM_HOLD = 7.5;
const camPos = new THREE.Vector3(0, 14, 18);
const camLook = new THREE.Vector3(0, 0, 0);
const camPosTarget = new THREE.Vector3(0, 14, 18);
const camLookTarget = new THREE.Vector3(0, 0, 0);
camera.position.copy(camPos);
camera.lookAt(camLook);

// ââ HUD clock âââââââââââââââââââââââââââââââââââââââââââââââââââââ
function tickClock() {
  const d = new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2,'0')+':'+
    String(d.getMinutes()).padStart(2,'0')+':'+
    String(d.getSeconds()).padStart(2,'0');
}
tickClock(); setInterval(tickClock, 1000);

function addLog(room, msg) {
  const feed = document.getElementById('feed');
  const el = document.createElement('div');
  el.className = 'log';
  const hex = '#' + room.color.toString(16).padStart(6,'0');
  el.style.borderLeftColor = hex;
  el.innerHTML = `<span class="who" style="color:${hex}">${room.name}</span>${msg}`;
  feed.prepend(el);
  while (feed.children.length > 3) feed.removeChild(feed.lastChild);
}

// ââ Render Loop âââââââââââââââââââââââââââââââââââââââââââââââââââ
const clock = new THREE.Clock();
let frame = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.08);
  const t = clock.getElapsedTime();
  frame++;

  // Camera sequence
  camTimer += dt;
  if (camTimer >= CAM_HOLD) {
    camTimer = 0;
    camIdx = (camIdx + 1) % CAM_SHOTS.length;
    const sh = CAM_SHOTS[camIdx];
    camPosTarget.set(...sh.pos);
    camLookTarget.set(...sh.target);
    // Label based on room
    const room = camIdx < ROOMS.length ? ROOMS[camIdx] : ROOMS[0];
    document.getElementById('cam-label').textContent = room.label;
  }
  camPos.lerp(camPosTarget, dt * 1.1);
  camLook.lerp(camLookTarget, dt * 1.3);
  camera.position.copy(camPos);
  camera.lookAt(camLook);

  // Room light & ring pulse
  ROOMS.forEach(room => {
    if (room.ptLight) {
      room.ptLight.intensity = 1.2 + Math.sin(t*1.4 + room.x*0.2)*0.35;
    }
    if (room.ringMat) {
      room.ringMat.emissiveIntensity = 0.6 + Math.sin(t*2.1 + room.z*0.15)*0.35;
    }
    if (room.bulbMat) {
      room.bulbMat.emissiveIntensity = 1.8 + Math.sin(t*1.4 + room.x*0.2)*0.5;
    }
    if (room.waterMesh) {
      room.waterMesh.material.opacity = 0.75 + Math.sin(t*1.8)*0.08;
    }
  });

  // Steam particles
  const sPos = steamGeo.attributes.position.array;
  for (let i = 0; i < STEAM_COUNT; i++) {
    steamLife[i] += dt * (0.25 + Math.random()*0.1);
    if (steamLife[i] > 1) {
      // Reset to a sewer vent position
      const room = ROOMS[Math.floor(Math.random()*ROOMS.length)];
      sPos[i*3]   = room.x + (Math.random()-.5)*room.radius*1.2;
      sPos[i*3+1] = 0.3;
      sPos[i*3+2] = room.z + (Math.random()-.5)*room.radius*1.2;
      steamVelocities[i].vx = (Math.random()-.5)*0.4;
      steamVelocities[i].vy = 0.35 + Math.random()*0.35;
      steamVelocities[i].vz = (Math.random()-.5)*0.4;
      steamLife[i] = 0;
    } else {
      sPos[i*3]   += steamVelocities[i].vx * dt;
      sPos[i*3+1] += steamVelocities[i].vy * dt;
      sPos[i*3+2] += steamVelocities[i].vz * dt;
    }
  }
  steamGeo.attributes.position.needsUpdate = true;
  steamMat.opacity = 0.16 + Math.sin(t*0.8)*0.04;

  // Turtle AI & animation
  TURTLES.forEach(ts => {
    const { group, room } = ts;

    // Animate limbs
    group.children.forEach(child => {
      if (child.userData.idx !== undefined) {
        const swing = ts.state === 'walk'
          ? Math.sin(ts.walkPhase*4 + child.userData.idx * Math.PI*0.5) * 0.12
          : 0;
        child.position.y = child.userData.baseY + swing;
      }
    });

    if (ts.state === 'idle') {
      group.userData.workLight.intensity = 0;
      ts.idleTimer -= dt;
      if (ts.idleTimer <= 0) {
        const ang = Math.random()*Math.PI*2;
        const dist = Math.random()*(room.radius - 0.9);
        ts.tx = room.x + Math.cos(ang)*dist;
        ts.tz = room.z + Math.sin(ang)*dist;
        ts.state = 'walk';
      }
    } else if (ts.state === 'walk') {
      const dx = ts.tx - ts.x, dz = ts.tz - ts.z;
      const dist = Math.sqrt(dx*dx + dz*dz);
      if (dist < 0.25) {
        ts.x = ts.tx; ts.tz = ts.tz;
        ts.state = Math.random() < 0.5 ? 'build' : 'idle';
        ts.idleTimer = 45 + Math.random()*75;
        ts.buildTimer = 70 + Math.random()*100;
      } else {
        const spd = 2.8;
        ts.x += (dx/dist)*spd*dt;
        ts.z += (dz/dist)*spd*dt;
        ts.walkPhase += dt*3.2;
        group.rotation.y = Math.atan2(dx, dz);
      }
      group.userData.workLight.intensity *= (1 - dt*8);
    } else { // build
      ts.buildTimer -= dt;
      ts.walkPhase += dt*0.3;
      group.userData.workLight.intensity = 1.4 + Math.sin(t*9)*0.6;
      if (ts.buildTimer <= 0) {
        ts.state = 'idle';
        ts.idleTimer = 30 + Math.random()*30;
        group.userData.workLight.intensity = 0;
        addLog(room, room.tasks[Math.floor(Math.random()*room.tasks.length)]);
      }
    }

    // Bob
    const bob = ts.state === 'walk' ? Math.abs(Math.sin(ts.walkPhase*2))*0.07 : 0;
    group.position.set(ts.x, bob, ts.z);
  });

  renderer.render(scene, camera);
}

addLog(ROOMS.find(r => r.key==='spl'), 'Entering the lair...');
document.getElementById('cam-label').textContent = ROOMS[0].label;
animate();
</script>
