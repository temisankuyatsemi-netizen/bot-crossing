<title>Bot Crossing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#050302;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #topbar{position:absolute;top:max(14px,env(safe-area-inset-top,0px));
    left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
    display:flex;align-items:center;justify-content:space-between;gap:8px}
  #logo{font-family:'Orbitron',monospace;font-size:clamp(11px,1.8vw,16px);font-weight:900;
    letter-spacing:.18em;color:#c8a060;text-shadow:0 0 12px #c8a06088}
  #clock{font-family:'Orbitron',monospace;font-size:clamp(9px,1.3vw,12px);color:#7aaa60;
    letter-spacing:.1em;background:rgba(0,0,0,.7);padding:3px 9px;
    border:1px solid rgba(100,160,60,.3);border-radius:3px}
  #feed{position:absolute;bottom:max(14px,env(safe-area-inset-bottom,0px));
    left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
    display:flex;flex-direction:column;gap:4px;max-height:90px;overflow:hidden}
  .log{font-family:'VT323',monospace;font-size:15px;color:#506050;padding:3px 10px;
    background:rgba(2,5,2,.88);border-left:2px solid #2a4a1a;border-radius:0 3px 3px 0;
    animation:sl .3s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log .who{font-weight:600;margin-right:6px}
  @keyframes sl{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  #room-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    font-family:'VT323',monospace;font-size:clamp(16px,3vw,26px);letter-spacing:.15em;
    color:rgba(200,170,100,.0);text-align:center;pointer-events:none;transition:color .5s}
</style>

<canvas id="c"></canvas>
<div id="hud">
  <div id="topbar">
    <div id="logo">BOT CROSSING · SEWER LAIR</div>
    <div id="clock">00:00:00</div>
  </div>
  <div id="feed"></div>
  <div id="room-label"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);

// Clock
function tickClock(){
  const d = new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
tickClock(); setInterval(tickClock, 1000);

// ── Camera ────────────────────────────────────────────────────────
const cam = { x:0, y:0, zoom:1, tx:0, ty:0, tz:1 };

// ── World coords → screen ─────────────────────────────────────────
function ws(wx, wy){ return { sx:(wx - cam.x)*cam.zoom + W/2, sy:(wy - cam.y)*cam.zoom + H/2 }; }
function scl(v){ return v * cam.zoom; }

// ── Rooms ─────────────────────────────────────────────────────────
const ROOMS = [
  { key:'hub',      label:'THE LAIR',           cx:0,    cy:0,    r:260, color:'#8a7040', glow:'rgba(180,140,60,0.15)',  dark:'#1a1208' },
  { key:'leo',      label:"LEO'S DOJO",          cx:-520, cy:-300, r:200, color:'#1e90ff', glow:'rgba(30,144,255,0.2)', dark:'#060c18',
    bandana:'#1e90ff', name:'LEONARDO',   sector:'content',
    tasks:['Post AM workout reel','Morning training','Film technique','Athlete routine','Discipline post'] },
  { key:'don',      label:"DON'S LAB",           cx:520,  cy:-300, r:200, color:'#9c27b0', glow:'rgba(156,39,176,0.2)', dark:'#0e0614',
    bandana:'#9c27b0', name:'DONATELLO',  sector:'stocked',
    tasks:['Prototype v2','User research','App wireframe','Backend schema','Pitch deck'] },
  { key:'raph',     label:"RAPH'S GYM",          cx:-520, cy:300,  r:200, color:'#f44336', glow:'rgba(244,67,54,0.2)',  dark:'#180606',
    bandana:'#f44336', name:'RAPHAEL',    sector:'athletic',
    tasks:['Design drop concept','Launch campaign','Sample request','Brand guide','Collab pitch'] },
  { key:'mikey',    label:"MIKEY'S STUDIO",      cx:520,  cy:300,  r:200, color:'#ff9800', glow:'rgba(255,152,0,0.2)',  dark:'#180a00',
    bandana:'#ff9800', name:'MICHELANGELO',sector:'creative',
    tasks:['Gallery concept','Merch design','COWABUNGA post','Cheat day haul','Cook-along video'] },
  { key:'splinter', label:"SPLINTER'S WAR ROOM", cx:0,    cy:480,  r:180, color:'#4caf50', glow:'rgba(76,175,80,0.2)', dark:'#040e04',
    bandana:'#4caf50', name:'SPLINTER',   sector:'hq',
    tasks:['Sprint planning','OKR review','Roadmap update','Team stand-up','Weekly recap'] },
];

// ── Tunnels connecting hub to rooms ───────────────────────────────
const TUNNELS = [
  { from:'hub', to:'leo',      w:80 },
  { from:'hub', to:'don',      w:80 },
  { from:'hub', to:'raph',     w:80 },
  { from:'hub', to:'mikey',    w:80 },
  { from:'hub', to:'splinter', w:80 },
];

// ── Particles (steam, drips, sparks) ─────────────────────────────
const particles = [];
function spawnSteam(x, y, color){
  for(let i=0;i<4;i++) particles.push({
    x, y, vx:(Math.random()-.5)*.4, vy:-.5-Math.random()*.5,
    life:1, decay:.008+Math.random()*.006, r:3+Math.random()*5,
    color, type:'steam'
  });
}
function spawnDrip(x, y){
  particles.push({ x, y, vx:0, vy:.3+Math.random()*.3, life:1, decay:.015, r:2, color:'#2a4a6a', type:'drip' });
}
function spawnSpark(x, y, color){
  for(let i=0;i<6;i++){
    const a=Math.random()*Math.PI*2;
    particles.push({ x, y, vx:Math.cos(a)*(1+Math.random()*3), vy:Math.sin(a)*(1+Math.random()*3)-1,
      life:1, decay:.04+Math.random()*.04, r:2, color, type:'spark' });
  }
}

// ── Draw a sewer room ─────────────────────────────────────────────
function drawRoom(room, t) {
  const { sx: cx, sy: cy } = ws(room.cx, room.cy);
  const r = scl(room.r);

  // Room floor (rough circle)
  const floorGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  floorGrad.addColorStop(0, lighten(room.dark, 15));
  floorGrad.addColorStop(.6, room.dark);
  floorGrad.addColorStop(1, '#050302');
  ctx.fillStyle = floorGrad;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();

  // Brick texture lines (radial)
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.clip();
  ctx.strokeStyle = `rgba(0,0,0,0.25)`; ctx.lineWidth = scl(1);
  for(let ri=1; ri<=4; ri++){
    ctx.beginPath(); ctx.arc(cx, cy, r*(ri/4), 0, Math.PI*2); ctx.stroke();
  }
  for(let a=0; a<Math.PI*2; a+=Math.PI/6){
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r); ctx.stroke();
  }
  ctx.restore();

  // Room glow
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  glow.addColorStop(0, room.glow);
  glow.addColorStop(.5, room.glow.replace('0.2','0.07').replace('0.15','0.05'));
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();

  // Room-specific furniture
  drawRoomFurniture(room, cx, cy, r, t);

  // Wall ring
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = `rgba(${hexToRgb(room.color)},0.35)`; ctx.lineWidth = scl(4); ctx.stroke();
  ctx.strokeStyle = `rgba(0,0,0,0.7)`; ctx.lineWidth = scl(1.5); ctx.stroke();

  // Room label
  if(r > 60){
    ctx.save();
    ctx.font = `${scl(13)}px 'VT323', monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = `rgba(${hexToRgb(room.color)},0.55)`;
    ctx.fillText(room.label, cx, cy - r + scl(14));
    ctx.restore();
  }
}

function drawRoomFurniture(room, cx, cy, r, t) {
  const s = scl;
  const pulse = Math.sin(t*.03)*.5+.5;

  switch(room.key){
    case 'hub': {
      // Sewer water channel (oval)
      ctx.fillStyle = '#0a1e2a';
      ctx.beginPath(); ctx.ellipse(cx, cy+s(20), s(80), s(40), 0, 0, Math.PI*2); ctx.fill();
      // water shimmer
      ctx.strokeStyle=`rgba(20,80,120,${0.3+pulse*.2})`; ctx.lineWidth=s(2);
      for(let i=0;i<3;i++){
        ctx.beginPath();
        ctx.moveTo(cx-s(60+i*5), cy+s(10+i*8));
        ctx.bezierCurveTo(cx-s(20),cy+s(5+i*8),cx+s(20),cy+s(35+i*8),cx+s(60+i*5),cy+s(10+i*8));
        ctx.stroke();
      }
      // manhole cover
      ctx.fillStyle='#2a2010'; ctx.beginPath(); ctx.arc(cx, cy-s(60), s(30), 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle='#c8a040'; ctx.lineWidth=s(3);
      ctx.beginPath(); ctx.arc(cx, cy-s(60), s(28), 0, Math.PI*2); ctx.stroke();
      // light from manhole
      const mhl = ctx.createRadialGradient(cx, cy-s(60), 0, cx, cy-s(60), s(60));
      mhl.addColorStop(0, `rgba(255,220,100,${0.15+pulse*.1})`); mhl.addColorStop(1,'transparent');
      ctx.fillStyle=mhl; ctx.beginPath(); ctx.arc(cx,cy-s(60),s(60),0,Math.PI*2); ctx.fill();
      // TV/crate in corner
      ctx.fillStyle='#1a1408';
      ctx.beginPath(); ctx.roundRect(cx-s(120), cy-s(30), s(40),s(30),s(4)); ctx.fill();
      ctx.fillStyle=`rgba(${hexToRgb('#c8a040')},${0.3+pulse*.3})`;
      ctx.beginPath(); ctx.roundRect(cx-s(118), cy-s(28), s(36),s(22),s(2)); ctx.fill();
      break;
    }
    case 'leo': {
      // Dojo — training dummy + weapons rack
      // Tatami mat
      ctx.fillStyle='#1a1408'; ctx.beginPath(); ctx.ellipse(cx,cy,s(110),s(70),0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#3a2a10'; ctx.lineWidth=s(2);
      for(let i=-2;i<=2;i++) for(let j=-1;j<=1;j++){
        ctx.beginPath();
        ctx.rect(cx+i*s(44)-s(22), cy+j*s(44)-s(22), s(42),s(42)); ctx.stroke();
      }
      // Training dummy
      ctx.fillStyle='#3a2010';
      ctx.beginPath(); ctx.arc(cx-s(80), cy, s(12), 0, Math.PI*2); ctx.fill();
      ctx.fillRect(cx-s(83), cy, s(6), s(40));
      // Weapons rack (katana silhouettes)
      ctx.strokeStyle='#8888aa'; ctx.lineWidth=s(2);
      for(let i=0;i<3;i++){
        ctx.save(); ctx.translate(cx+s(80), cy-s(50)+i*s(20));
        ctx.rotate(-.3);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(s(50),s(10)); ctx.stroke();
        ctx.restore();
      }
      // Glow on mat
      const lg=ctx.createRadialGradient(cx,cy,0,cx,cy,s(80));
      lg.addColorStop(0,`rgba(30,144,255,0.06)`); lg.addColorStop(1,'transparent');
      ctx.fillStyle=lg; ctx.beginPath(); ctx.arc(cx,cy,s(120),0,Math.PI*2); ctx.fill();
      break;
    }
    case 'don': {
      // Lab — computer screens, beakers, cables
      // Main desk
      ctx.fillStyle='#0e0a14';
      ctx.beginPath(); ctx.roundRect(cx-s(90),cy-s(20),s(180),s(50),s(5)); ctx.fill();
      // Screens
      for(let i=0;i<3;i++){
        const sx=cx-s(70)+i*s(60), sy=cy-s(50);
        ctx.fillStyle='#0a0010';
        ctx.beginPath(); ctx.roundRect(sx-s(20),sy-s(25),s(40),s(30),s(3)); ctx.fill();
        ctx.fillStyle=`rgba(${hexToRgb('#9c27b0')},${0.2+pulse*.4})`;
        ctx.beginPath(); ctx.roundRect(sx-s(18),sy-s(23),s(36),s(26),s(2)); ctx.fill();
        // code lines on screen
        ctx.fillStyle=`rgba(200,150,255,${0.4+pulse*.2})`;
        for(let l=0;l<3;l++) ctx.fillRect(sx-s(14), sy-s(18)+l*s(7), s(10+Math.random()*18), s(3));
      }
      // Beakers
      for(let i=0;i<2;i++){
        const bx=cx+s(60+i*25), by=cy-s(5);
        ctx.strokeStyle='#6040a0'; ctx.lineWidth=s(1.5);
        ctx.beginPath(); ctx.moveTo(bx-s(8),by-s(20)); ctx.lineTo(bx-s(10),by); ctx.lineTo(bx+s(10),by); ctx.lineTo(bx+s(8),by-s(20)); ctx.stroke();
        ctx.fillStyle=`rgba(180,80,255,${0.2+pulse*.15})`;
        ctx.beginPath(); ctx.ellipse(bx,by-s(3),s(8),s(4),0,0,Math.PI*2); ctx.fill();
      }
      break;
    }
    case 'raph': {
      // Gym — weights, punching bag
      // Floor mats
      ctx.fillStyle='#1a0808';
      ctx.beginPath(); ctx.roundRect(cx-s(90),cy-s(60),s(180),s(120),s(8)); ctx.fill();
      // Punching bag
      ctx.fillStyle='#3a1008'; ctx.beginPath(); ctx.ellipse(cx-s(60), cy, s(18), s(35), 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle='#c83030'; ctx.lineWidth=s(2);
      ctx.beginPath(); ctx.moveTo(cx-s(60),cy-s(35)); ctx.lineTo(cx-s(60),cy-s(60)); ctx.stroke();
      ctx.fillStyle='#8a1010'; ctx.beginPath(); ctx.arc(cx-s(60),cy-s(60),s(5),0,Math.PI*2); ctx.fill();
      // Barbell
      ctx.strokeStyle='#707070'; ctx.lineWidth=s(4);
      ctx.beginPath(); ctx.moveTo(cx+s(30),cy+s(30)); ctx.lineTo(cx+s(100),cy+s(30)); ctx.stroke();
      for(let i=0;i<2;i++){
        const wx=cx+s(30+i*70);
        ctx.fillStyle='#404040';
        ctx.beginPath(); ctx.ellipse(wx,cy+s(30),s(8),s(16),0,0,Math.PI*2); ctx.fill();
      }
      // Motivational glow
      const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,s(100));
      rg.addColorStop(0,`rgba(244,67,54,0.07)`); rg.addColorStop(1,'transparent');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(cx,cy,s(140),0,Math.PI*2); ctx.fill();
      break;
    }
    case 'mikey': {
      // Studio — easel, pizza boxes, speakers
      // Pizza boxes stack
      for(let i=0;i<3;i++){
        ctx.fillStyle=i===0?'#3a2010':'#2a1808';
        ctx.beginPath(); ctx.roundRect(cx-s(90+i*2),cy+s(30+i*8),s(40),s(6),s(1)); ctx.fill();
      }
      // Easel
      ctx.strokeStyle='#6a4020'; ctx.lineWidth=s(3);
      ctx.beginPath(); ctx.moveTo(cx+s(60),cy-s(60)); ctx.lineTo(cx+s(50),cy+s(40)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx+s(60),cy-s(60)); ctx.lineTo(cx+s(80),cy+s(40)); ctx.stroke();
      // Canvas
      ctx.fillStyle='#1a1410';
      ctx.beginPath(); ctx.roundRect(cx+s(38),cy-s(55),s(44),s(55),s(3)); ctx.fill();
      ctx.fillStyle=`rgba(${hexToRgb('#ff9800')},${0.15+pulse*.2})`;
      ctx.beginPath(); ctx.roundRect(cx+s(40),cy-s(53),s(40),s(45),s(2)); ctx.fill();
      // Speaker glow
      const mg=ctx.createRadialGradient(cx,cy,0,cx,cy,s(100));
      mg.addColorStop(0,`rgba(255,152,0,0.08)`); mg.addColorStop(1,'transparent');
      ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(cx,cy,s(130),0,Math.PI*2); ctx.fill();
      break;
    }
    case 'splinter': {
      // War room — map table, incense, throne
      // Map table
      ctx.fillStyle='#0a0e08';
      ctx.beginPath(); ctx.ellipse(cx, cy, s(80), s(50), 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle='#2a4a1a'; ctx.lineWidth=s(1.5);
      ctx.beginPath(); ctx.ellipse(cx, cy, s(78), s(48), 0, 0, Math.PI*2); ctx.stroke();
      // Map lines
      ctx.strokeStyle=`rgba(80,160,50,${0.2+pulse*.15})`; ctx.lineWidth=s(1);
      for(let i=0;i<5;i++){
        ctx.beginPath();
        ctx.moveTo(cx-s(60)+i*s(24), cy-s(30));
        ctx.lineTo(cx-s(70)+i*s(28), cy+s(30)); ctx.stroke();
      }
      // Incense smoke
      for(let i=0;i<2;i++){
        const ix=cx+s(-30+i*60), iy=cy-s(40);
        ctx.strokeStyle=`rgba(200,160,80,${0.1+pulse*.1})`; ctx.lineWidth=s(1.5);
        ctx.beginPath();
        ctx.moveTo(ix, iy);
        ctx.bezierCurveTo(ix-s(8),iy-s(15),ix+s(8),iy-s(30),ix,iy-s(45));
        ctx.stroke();
      }
      // Splinter's throne (top of room)
      ctx.fillStyle='#1a1008';
      ctx.beginPath(); ctx.roundRect(cx-s(25), cy-s(100), s(50), s(40), [s(6),s(6),0,0]); ctx.fill();
      ctx.strokeStyle='rgba(200,160,50,.4)'; ctx.lineWidth=s(2);
      ctx.beginPath(); ctx.roundRect(cx-s(24), cy-s(99), s(48), s(38), [s(5),s(5),0,0]); ctx.stroke();
      break;
    }
  }
}

// ── Draw tunnels ──────────────────────────────────────────────────
function drawTunnel(t1, t2) {
  const r1 = ROOMS.find(r=>r.key===t1.from), r2 = ROOMS.find(r=>r.key===t1.to);
  const p1 = ws(r1.cx, r1.cy), p2 = ws(r2.cx, r2.cy);
  const w = scl(t1.w);

  const dx=p2.sx-p1.sx, dy=p2.sy-p1.sy, len=Math.sqrt(dx*dx+dy*dy);
  const nx=(-dy/len)*w*.5, ny=(dx/len)*w*.5;

  // Tunnel floor
  ctx.fillStyle = '#0a0806';
  ctx.beginPath();
  ctx.moveTo(p1.sx+nx, p1.sy+ny);
  ctx.lineTo(p2.sx+nx, p2.sy+ny);
  ctx.lineTo(p2.sx-nx, p2.sy-ny);
  ctx.lineTo(p1.sx-nx, p1.sy-ny);
  ctx.closePath(); ctx.fill();

  // Brick lines along tunnel
  const steps = Math.floor(len / scl(40));
  ctx.strokeStyle='rgba(0,0,0,.3)'; ctx.lineWidth=scl(1);
  for(let i=1;i<steps;i++){
    const prog=i/steps;
    const bx=p1.sx+dx*prog, by=p1.sy+dy*prog;
    ctx.beginPath();
    ctx.moveTo(bx+nx*.9, by+ny*.9);
    ctx.lineTo(bx-nx*.9, by-ny*.9);
    ctx.stroke();
  }

  // Pipe along ceiling
  ctx.strokeStyle='rgba(80,60,30,.5)'; ctx.lineWidth=scl(6);
  ctx.beginPath(); ctx.moveTo(p1.sx+nx*.7, p1.sy+ny*.7); ctx.lineTo(p2.sx+nx*.7, p2.sy+ny*.7); ctx.stroke();
  ctx.strokeStyle='rgba(60,45,20,.4)'; ctx.lineWidth=scl(4);
  ctx.beginPath(); ctx.moveTo(p1.sx+nx*.7, p1.sy+ny*.7); ctx.lineTo(p2.sx+nx*.7, p2.sy+ny*.7); ctx.stroke();

  // Glow inside tunnel from room color
  const tg = ctx.createLinearGradient(p1.sx, p1.sy, p2.sx, p2.sy);
  tg.addColorStop(0, `rgba(${hexToRgb(r1.color)},0.04)`);
  tg.addColorStop(1, `rgba(${hexToRgb(r2.color)},0.06)`);
  ctx.fillStyle=tg;
  ctx.beginPath();
  ctx.moveTo(p1.sx+nx*.8, p1.sy+ny*.8);
  ctx.lineTo(p2.sx+nx*.8, p2.sy+ny*.8);
  ctx.lineTo(p2.sx-nx*.8, p2.sy-ny*.8);
  ctx.lineTo(p1.sx-nx*.8, p1.sy-ny*.8);
  ctx.closePath(); ctx.fill();
}

// ── Draw a Turtle character (top-down cinematic) ──────────────────
function drawTurtle(x, y, room, walkPhase, buildPhase, opacity, isWorking) {
  if(opacity<=0) return;
  const s = scl;
  const { sx, sy } = ws(x, y);
  const sc = room ? scl(18) : scl(22);
  const bandana = room ? room.bandana : '#888';
  const glow = room ? room.color : '#888';

  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.translate(sx, sy);

  const wobble = Math.sin(walkPhase * 4) * (isWorking ? 1 : 2);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(wobble*.3, sc*.15, sc*.6, sc*.3, 0, 0, Math.PI*2); ctx.fill();

  // Shell (main body - oval)
  const shellGrad = ctx.createRadialGradient(-sc*.15, -sc*.1, 0, 0, 0, sc*.9);
  shellGrad.addColorStop(0, '#5a4818');
  shellGrad.addColorStop(.5, '#3a2e0e');
  shellGrad.addColorStop(1, '#1e1808');
  ctx.fillStyle = shellGrad;
  ctx.beginPath(); ctx.ellipse(0, 0, sc*.75, sc*.8, wobble*.03, 0, Math.PI*2); ctx.fill();

  // Shell segments
  ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=sc*.08;
  ctx.beginPath(); ctx.moveTo(-sc*.3, 0); ctx.lineTo(sc*.3, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -sc*.3); ctx.lineTo(0, sc*.3); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 0, sc*.45, sc*.5, 0, 0, Math.PI*2); ctx.stroke();

  // Skin (arms/legs visible around shell)
  ctx.fillStyle = '#3a7a20';
  // legs
  for(let i=0;i<4;i++){
    const la = (i/4)*Math.PI*2 + Math.PI*.125;
    const lw = i%2===0 ? Math.sin(walkPhase*4)*.12 : -Math.sin(walkPhase*4)*.12;
    ctx.beginPath();
    ctx.ellipse(Math.cos(la)*sc*.75, Math.sin(la)*sc*.75+lw*sc, sc*.18, sc*.22, la, 0, Math.PI*2);
    ctx.fill();
  }

  // Head (top circle)
  const headGrad = ctx.createRadialGradient(-sc*.1, -sc*.85, 0, 0, -sc*.82, sc*.38);
  headGrad.addColorStop(0, '#4a9028'); headGrad.addColorStop(1, '#2a5a14');
  ctx.fillStyle = headGrad;
  ctx.beginPath(); ctx.arc(0, -sc*.82, sc*.35, 0, Math.PI*2); ctx.fill();

  // Bandana (colored mask over eyes)
  ctx.fillStyle = bandana;
  ctx.beginPath(); ctx.roundRect(-sc*.34, -sc*1.02, sc*.68, sc*.2, sc*.04); ctx.fill();

  // Bandana eye holes
  ctx.fillStyle = '#111a0a';
  ctx.beginPath(); ctx.ellipse(-sc*.12, -sc*.92, sc*.1, sc*.07, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(sc*.12, -sc*.92, sc*.1, sc*.07, 0, 0, Math.PI*2); ctx.fill();

  // Eye glow
  ctx.fillStyle = glow;
  ctx.shadowColor = glow; ctx.shadowBlur = sc*.5;
  ctx.beginPath(); ctx.ellipse(-sc*.12, -sc*.93, sc*.05, sc*.04, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(sc*.12, -sc*.93, sc*.05, sc*.04, 0, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // Bandana tails (behind head)
  ctx.fillStyle = shadeColor(bandana, -20);
  ctx.beginPath(); ctx.moveTo(sc*.1, -sc*.88); ctx.lineTo(sc*.22, -sc*.65); ctx.lineTo(sc*.08, -sc*.62); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(sc*.15, -sc*.88); ctx.lineTo(sc*.32, -sc*.58); ctx.lineTo(sc*.18, -sc*.56); ctx.closePath(); ctx.fill();

  // Build indicator
  if(isWorking){
    ctx.fillStyle = glow; ctx.shadowColor=glow; ctx.shadowBlur=sc*.8;
    ctx.font = `${sc*.8}px VT323, monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('⚙', 0, -sc*1.5);
    ctx.shadowBlur=0;
  }

  ctx.restore();
}

// ── Turtle bots ───────────────────────────────────────────────────
const turtles = ROOMS.filter(r=>r.bandana).map(room => ({
  room,
  x: room.cx + (Math.random()-.5)*60,
  y: room.cy + (Math.random()-.5)*60,
  tx: room.cx, ty: room.cy,
  walkPhase: Math.random()*10,
  buildPhase: 0,
  state: 'idle',
  idleTimer: Math.random()*100,
  buildTimer: 0,
  opacity: 0,
  built: 0,
}));

// ── Ambient steam sources ─────────────────────────────────────────
const steamSources = [
  { x:0, y:-50, color:'rgba(150,130,80,', timer:0 },
  { x:-200, y:100, color:'rgba(100,150,200,', timer:30 },
  { x:200, y:100, color:'rgba(150,100,80,', timer:60 },
];

// ── Camera slowly drifts between rooms ───────────────────────────
let camTarget = 0, camTimer = 0;
const camSequence = [0, 1, 2, 3, 4, 5]; // hub + 5 rooms

// ── Helpers ───────────────────────────────────────────────────────
function hexToRgb(hex){
  const n=parseInt(hex.replace('#',''),16);
  return `${(n>>16)&255},${(n>>8)&255},${n&255}`;
}
function shadeColor(hex, p){
  const n=parseInt(hex.replace('#',''),16);
  const r=Math.max(0,Math.min(255,((n>>16)&255)+p));
  const g=Math.max(0,Math.min(255,((n>>8)&255)+p));
  const b=Math.max(0,Math.min(255,(n&255)+p));
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}
function lighten(hex, p){ return shadeColor(hex, p); }

// Feed
function addLog(room, msg){
  const feed = document.getElementById('feed');
  const el = document.createElement('div'); el.className='log';
  el.style.borderLeftColor = room.bandana;
  el.innerHTML = `<span class="who" style="color:${room.bandana}">${room.name}</span>${msg}`;
  feed.prepend(el);
  while(feed.children.length>3) feed.removeChild(feed.lastChild);
}

// ── Main loop ─────────────────────────────────────────────────────
let frame=0, lastT=0;

function loop(ts){
  requestAnimationFrame(loop);
  const dt = Math.min((ts-lastT)/16.67, 3); lastT=ts; frame++;

  // Camera drift
  camTimer += dt;
  if(camTimer > 280){
    camTarget = (camTarget+1)%camSequence.length;
    camTimer = 0;
  }
  const tr = ROOMS[camSequence[camTarget]];
  const tzoom = camTarget===0 ? 0.58 : 0.82;
  cam.tx = tr.cx; cam.ty = tr.cy; cam.tz = tzoom;
  cam.x += (cam.tx - cam.x) * 0.018 * dt;
  cam.y += (cam.ty - cam.y) * 0.018 * dt;
  cam.zoom += (cam.tz - cam.zoom) * 0.018 * dt;

  // Steam
  steamSources.forEach(ss=>{
    ss.timer += dt;
    if(ss.timer > 18){ spawnSteam(ss.x, ss.y, ss.color); ss.timer=0; }
  });
  // Random drips from pipes
  if(frame%45===0) spawnDrip(
    ROOMS[Math.floor(Math.random()*ROOMS.length)].cx + (Math.random()-.5)*100,
    ROOMS[Math.floor(Math.random()*ROOMS.length)].cy - 60
  );

  // Update particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=p.decay*dt;
    if(p.type==='steam') p.r+=0.08*dt;
    if(p.life<=0) particles.splice(i,1);
  }

  // Update turtles
  turtles.forEach(t=>{
    if(t.opacity<1) t.opacity=Math.min(1,t.opacity+0.012*dt);
    if(t.state==='idle'){
      if((t.idleTimer-=dt)<=0){
        // Choose new spot in room
        const a=Math.random()*Math.PI*2, r=Math.random()*t.room.r*.6;
        t.tx=t.room.cx+Math.cos(a)*r; t.ty=t.room.cy+Math.sin(a)*r;
        t.state='walk';
      }
    } else if(t.state==='walk'){
      const dx=t.tx-t.x, dy=t.ty-t.y, d=Math.sqrt(dx*dx+dy*dy);
      if(d<4){ t.x=t.tx; t.y=t.ty; t.state=Math.random()<.5?'build':'idle'; t.idleTimer=60+Math.random()*100; t.buildTimer=80+Math.random()*100; }
      else { t.x+=dx/d*1.8*dt; t.y+=dy/d*1.8*dt; t.walkPhase+=dt*.18; }
    } else if(t.state==='build'){
      t.buildPhase+=dt; t.walkPhase+=dt*.08;
      if((t.buildTimer-=dt)<=0){
        t.state='idle'; t.idleTimer=40; t.buildPhase=0; t.built++;
        spawnSpark(t.x, t.y, t.room.bandana);
        const tasks=t.room.tasks;
        addLog(t.room, tasks[Math.floor(Math.random()*tasks.length)]);
      }
    }
  });

  // ── DRAW ─────────────────────────────────────────────────────
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#050302'; ctx.fillRect(0,0,W,H);

  // Deep background dirt
  const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);
  bg.addColorStop(0,'#0d0a06'); bg.addColorStop(1,'#020100');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // Draw tunnels first (behind rooms)
  TUNNELS.forEach(t=>drawTunnel(t));

  // Draw rooms
  ROOMS.forEach(r=>drawRoom(r, frame));

  // Draw particles
  particles.forEach(p=>{
    const {sx,sy}=ws(p.x,p.y);
    ctx.globalAlpha=p.life*(p.type==='steam'?.25:.9);
    if(p.type==='steam'){
      const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,scl(p.r));
      sg.addColorStop(0, p.color+'0.15)'); sg.addColorStop(1,p.color+'0)');
      ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sx,sy,scl(p.r),0,Math.PI*2); ctx.fill();
    } else if(p.type==='drip'){
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.ellipse(sx,sy,scl(1.5),scl(2.5),0,0,Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=scl(4);
      ctx.beginPath(); ctx.arc(sx,sy,scl(p.r),0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }
    ctx.globalAlpha=1;
  });

  // Draw turtles
  turtles.forEach(t=>drawTurtle(t.x, t.y, t.room, t.walkPhase, t.buildPhase, t.opacity, t.state==='build'));

  // Vignette
  const vig=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.8);
  vig.addColorStop(0,'transparent'); vig.addColorStop(1,'rgba(0,0,0,0.75)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);

  // Film grain (subtle)
  if(frame%2===0){
    ctx.globalAlpha=0.022;
    for(let i=0;i<400;i++){
      ctx.fillStyle=Math.random()>.5?'#fff':'#000';
      ctx.fillRect(Math.random()*W, Math.random()*H, 1.5, 1.5);
    }
    ctx.globalAlpha=1;
  }

  // Room label overlay
  const rl=document.getElementById('room-label');
  if(camTarget>0) rl.textContent=ROOMS[camSequence[camTarget]].label;
  else rl.textContent='THE SEWER LAIR';
}

addLog(ROOMS.find(r=>r.key==='splinter'), 'Entering the lair...');
requestAnimationFrame(loop);
</script>
