<title>Bot Crossing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#030201;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #topbar{position:absolute;top:max(14px,env(safe-area-inset-top,0px));
    left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
    display:flex;align-items:center;justify-content:space-between;gap:8px}
  #logo{font-family:'Orbitron',monospace;font-size:clamp(11px,1.8vw,16px);font-weight:900;
    letter-spacing:.18em;color:#b89050;text-shadow:0 0 16px #b8905066,0 0 40px #b8905022}
  #clock{font-family:'Orbitron',monospace;font-size:clamp(9px,1.3vw,12px);color:#608850;
    letter-spacing:.1em;background:rgba(0,0,0,.75);padding:3px 10px;
    border:1px solid rgba(80,120,40,.35);border-radius:3px}
  #feed{position:absolute;bottom:max(14px,env(safe-area-inset-bottom,0px));
    left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
    display:flex;flex-direction:column;gap:4px;max-height:90px;overflow:hidden}
  .log{font-family:'VT323',monospace;font-size:15px;color:#485848;padding:4px 12px;
    background:rgba(2,4,2,.92);border-left:2px solid #304820;border-radius:0 3px 3px 0;
    animation:sl .35s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log .who{font-weight:600;margin-right:7px}
  @keyframes sl{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  #cam-label{position:absolute;bottom:max(120px,120px);left:50%;transform:translateX(-50%);
    font-family:'Orbitron',monospace;font-size:clamp(9px,1.2vw,11px);font-weight:700;
    letter-spacing:.22em;color:rgba(180,150,80,.55);text-align:center;pointer-events:none}
</style>

<canvas id="c"></canvas>
<div id="hud">
  <div id="topbar">
    <div id="logo">BOT CROSSING · SEWER LAIR</div>
    <div id="clock">00:00:00</div>
  </div>
  <div id="feed"></div>
  <div id="cam-label"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
resize(); window.addEventListener('resize', resize);

// ── Clock ─────────────────────────────────────────────────────────
function tickClock(){
  const d=new Date();
  document.getElementById('clock').textContent=
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
tickClock(); setInterval(tickClock,1000);

// ── Camera ────────────────────────────────────────────────────────
const cam={x:0,y:0,zoom:.6,tx:0,ty:0,tz:.6};
function ws(wx,wy){return{sx:(wx-cam.x)*cam.zoom+W/2, sy:(wy-cam.y)*cam.zoom+H/2};}
function scl(v){return v*cam.zoom;}

// ── Color utils ───────────────────────────────────────────────────
function hexRgb(h){const n=parseInt(h.replace('#',''),16);return`${(n>>16)&255},${(n>>8)&255},${n&255}`;}
function shade(hex,p){
  const n=parseInt(hex.replace('#',''),16);
  const r=Math.max(0,Math.min(255,((n>>16)&255)+p));
  const g=Math.max(0,Math.min(255,((n>>8)&255)+p));
  const b=Math.max(0,Math.min(255,(n&255)+p));
  return`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}
function rgba(hex,a){return`rgba(${hexRgb(hex)},${a})`;}

// ── Rooms ─────────────────────────────────────────────────────────
const ROOMS=[
  {key:'hub',      label:'THE SEWER LAIR', cx:0,    cy:0,    r:270, wallColor:'#5a3e1e', floorColor:'#2e2214', accentColor:'#c8a050', isTurtle:false},
  {key:'leo',      label:"LEO'S DOJO",     cx:-530, cy:-310, r:210, wallColor:'#1e3060', floorColor:'#141e40', accentColor:'#4488ff',
   bandana:'#4488ff', name:'LEONARDO', tasks:['Post AM workout reel','Morning training film','Technique breakdown','Athlete routine','Discipline post','Kata session reel']},
  {key:'don',      label:"DON'S LAB",      cx:530,  cy:-310, r:210, wallColor:'#2e1040', floorColor:'#1e0c2e', accentColor:'#aa44ee',
   bandana:'#aa44ee', name:'DONATELLO', tasks:['Prototype v2 spec','User research loop','App wireframe','Backend schema','Supplier outreach','Pitch deck slide']},
  {key:'raph',     label:"RAPH'S GYM",     cx:-530, cy:310,  r:210, wallColor:'#481010', floorColor:'#2e0c0c', accentColor:'#ff3333',
   bandana:'#ff3333', name:'RAPHAEL', tasks:['Design drop concept','Launch campaign','Sample request','Brand guide','Collab pitch','Drop teaser reel']},
  {key:'mikey',    label:"MIKEY'S STUDIO", cx:530,  cy:310,  r:210, wallColor:'#3c2008', floorColor:'#281408', accentColor:'#ff8800',
   bandana:'#ff8800', name:'MICHELANGELO', tasks:['Gallery concept','Merch design','Cheat day haul','Cook-along video','COWABUNGA post','Art timelapse']},
  {key:'splinter', label:"SPLINTER'S WAR ROOM", cx:0, cy:490, r:190, wallColor:'#1a2e14', floorColor:'#101c0c', accentColor:'#55cc33',
   bandana:'#55cc33', name:'SPLINTER', isSplinter:true, tasks:['Sprint planning','OKR review','Roadmap update','Team stand-up','Weekly recap','Assess the mission']},
];

const TUNNELS=[
  {from:'hub',to:'leo',w:90},{from:'hub',to:'don',w:90},
  {from:'hub',to:'raph',w:90},{from:'hub',to:'mikey',w:90},
  {from:'hub',to:'splinter',w:90},
];

// ── Particles ─────────────────────────────────────────────────────
const parts=[];
function steam(x,y,col,n=3){
  for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-.5)*.35,vy:-.55-Math.random()*.4,
    life:1,decay:.006+Math.random()*.005,r:2+Math.random()*4,col,type:'steam'});
}
function drip(x,y){
  parts.push({x,y,vx:0,vy:.35+Math.random()*.2,life:1,decay:.014,r:1.8,col:'#1a3a5a',type:'drip'});
}
function spark(x,y,col){
  for(let i=0;i<7;i++){const a=Math.random()*Math.PI*2;
    parts.push({x,y,vx:Math.cos(a)*(1.5+Math.random()*2.5),vy:Math.sin(a)*(1.5+Math.random()*2.5)-.5,
      life:1,decay:.05+Math.random()*.04,r:2,col,type:'spark'});}
}

// ── Brick texture helper ──────────────────────────────────────────
function drawBricks(cx,cy,r,wallCol,t){
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();
  // Mortar base
  ctx.fillStyle=shade(wallCol,-15);
  ctx.fillRect(cx-r,cy-r,r*2,r*2);
  // Brick rows
  const bh=scl(18), bw=scl(36);
  ctx.fillStyle=wallCol;
  for(let row=0;row<Math.ceil(r*2/bh)+1;row++){
    const oy=(row%2)*(bw*.5);
    for(let col=0;col<Math.ceil(r*2/bw)+2;col++){
      const bx=cx-r+col*bw-oy, by=cy-r+row*bh;
      const noise=Math.sin(bx*0.13+by*0.17)*3;
      ctx.fillStyle=`rgb(${parseInt(wallCol.slice(1,3),16)+noise|0},${parseInt(wallCol.slice(3,5),16)+noise|0},${parseInt(wallCol.slice(5,7),16)+noise|0})`;
      ctx.fillRect(bx+1,by+1,bw-2,bh-2);
    }
  }
  // Mortar lines — subtle darker
  ctx.strokeStyle=`rgba(0,0,0,.35)`; ctx.lineWidth=1;
  for(let row=0;row<Math.ceil(r*2/bh)+1;row++){
    ctx.beginPath(); ctx.moveTo(cx-r,cy-r+row*bh); ctx.lineTo(cx+r,cy-r+row*bh); ctx.stroke();
    const oy=(row%2)*(bw*.5);
    for(let col=0;col<Math.ceil(r*2/bw)+2;col++){
      const bx=cx-r+col*bw-oy;
      ctx.beginPath(); ctx.moveTo(bx,cy-r+row*bh); ctx.lineTo(bx,cy-r+(row+1)*bh); ctx.stroke();
    }
  }
  ctx.restore();
}

// ── Floor texture helper ──────────────────────────────────────────
function drawFloor(cx,cy,r,floorCol,accentCol){
  // Wet concrete floor with puddles
  const fg=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  fg.addColorStop(0,shade(floorCol,12));
  fg.addColorStop(.6,floorCol);
  fg.addColorStop(1,shade(floorCol,-10));
  ctx.fillStyle=fg;
  ctx.beginPath(); ctx.arc(cx,cy,r*.97,0,Math.PI*2); ctx.fill();

  // Floor cracks
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r*.97,0,Math.PI*2); ctx.clip();
  ctx.strokeStyle=`rgba(0,0,0,.25)`; ctx.lineWidth=scl(.8);
  for(let i=0;i<5;i++){
    const a=Math.random()*Math.PI*2, cr=Math.random()*r*.7;
    const x1=cx+Math.cos(a)*cr*.2, y1=cy+Math.sin(a)*cr*.2;
    const x2=cx+Math.cos(a+.3)*cr, y2=cy+Math.sin(a+.3)*cr;
    ctx.beginPath(); ctx.moveTo(x1,y1);
    ctx.bezierCurveTo(x1+(x2-x1)*.3+(Math.random()-.5)*scl(20),y1+(y2-y1)*.3+(Math.random()-.5)*scl(20),
      x1+(x2-x1)*.7+(Math.random()-.5)*scl(20),y1+(y2-y1)*.7+(Math.random()-.5)*scl(20),x2,y2);
    ctx.stroke();
  }
  // Puddle reflections
  for(let i=0;i<3;i++){
    const px=cx+(Math.random()-.5)*r*.8, py=cy+(Math.random()-.5)*r*.8;
    const pr=scl(8+Math.random()*18);
    const pg=ctx.createRadialGradient(px,py,0,px,py,pr);
    pg.addColorStop(0,rgba(accentCol,.08));
    pg.addColorStop(1,'transparent');
    ctx.fillStyle=pg; ctx.beginPath(); ctx.ellipse(px,py,pr,pr*.35,0,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// ── 3D box helper (isometric look on top-down canvas) ────────────
function box3d(x,y,w,h,depth,topCol,sideCol,frontCol){
  // top face
  ctx.fillStyle=topCol;
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.fill();
  // right side
  ctx.fillStyle=sideCol;
  ctx.beginPath(); ctx.moveTo(x+w,y); ctx.lineTo(x+w+depth,y-depth*.5); ctx.lineTo(x+w+depth,y+h-depth*.5); ctx.lineTo(x+w,y+h); ctx.closePath(); ctx.fill();
  // front face
  ctx.fillStyle=frontCol;
  ctx.beginPath(); ctx.moveTo(x,y+h); ctx.lineTo(x+w,y+h); ctx.lineTo(x+w+depth,y+h-depth*.5); ctx.lineTo(x+depth,y+h-depth*.5); ctx.closePath(); ctx.fill();
  // edges
  ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=scl(.6);
  ctx.strokeRect(x,y,w,h);
  ctx.beginPath(); ctx.moveTo(x+w,y); ctx.lineTo(x+w+depth,y-depth*.5); ctx.lineTo(x+w+depth,y+h-depth*.5); ctx.lineTo(x+w,y+h); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y+h); ctx.lineTo(x+depth,y+h-depth*.5); ctx.lineTo(x+w+depth,y+h-depth*.5); ctx.stroke();
}

// ── Room furniture ────────────────────────────────────────────────
function drawFurniture(room,cx,cy,r,t){
  const s=scl;
  const p=Math.sin(t*.03)*.5+.5;
  const c=room.accentColor;

  switch(room.key){
    case 'hub':{
      // Sewer channel — long oval water feature
      ctx.fillStyle='#0a1828';
      ctx.beginPath(); ctx.ellipse(cx,cy+s(30),s(100),s(48),0,0,Math.PI*2); ctx.fill();
      // Water surface shimmer layers
      for(let i=0;i<4;i++){
        ctx.strokeStyle=`rgba(20,90,150,${.12+i*.04+p*.06})`; ctx.lineWidth=s(1.2);
        ctx.beginPath();
        ctx.moveTo(cx-s(80+i*3),cy+s(18+i*7));
        ctx.bezierCurveTo(cx-s(30),cy+s(12+i*7),cx+s(30),cy+s(42+i*7),cx+s(80+i*3),cy+s(18+i*7));
        ctx.stroke();
      }
      // Manhole above
      ctx.fillStyle='#1e1608';
      ctx.beginPath(); ctx.arc(cx,cy-s(80),s(35),0,Math.PI*2); ctx.fill();
      // Manhole ring detail
      ctx.strokeStyle='#a08030'; ctx.lineWidth=s(4);
      ctx.beginPath(); ctx.arc(cx,cy-s(80),s(33),0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle='#605020'; ctx.lineWidth=s(2);
      for(let a=0;a<Math.PI*2;a+=Math.PI/4){
        ctx.beginPath(); ctx.moveTo(cx,cy-s(80));
        ctx.lineTo(cx+Math.cos(a)*s(33),cy-s(80)+Math.sin(a)*s(33)); ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(cx,cy-s(80),s(15),0,Math.PI*2); ctx.stroke();
      // Manhole light shaft
      const mhl=ctx.createRadialGradient(cx,cy-s(80),0,cx,cy-s(80),s(80));
      mhl.addColorStop(0,`rgba(255,230,120,${.18+p*.08})`);
      mhl.addColorStop(.4,`rgba(200,170,80,${.06+p*.03})`);
      mhl.addColorStop(1,'transparent');
      ctx.fillStyle=mhl; ctx.beginPath(); ctx.arc(cx,cy-s(80),s(80),0,Math.PI*2); ctx.fill();
      // Old TV on crate
      ctx.fillStyle='#1c1408'; ctx.beginPath(); ctx.roundRect(cx-s(130),cy-s(45),s(55),s(40),s(3)); ctx.fill();
      ctx.fillStyle='#0c0c08'; ctx.beginPath(); ctx.roundRect(cx-s(126),cy-s(41),s(44),s(28),s(2)); ctx.fill();
      ctx.fillStyle=`rgba(${hexRgb(c)},${.2+p*.3})`;
      ctx.beginPath(); ctx.roundRect(cx-s(125),cy-s(40),s(42),s(26),s(2)); ctx.fill();
      // Pipes on wall
      ctx.strokeStyle='#6a5020'; ctx.lineWidth=s(8);
      ctx.beginPath(); ctx.moveTo(cx-s(200),cy+s(60)); ctx.lineTo(cx+s(200),cy+s(60)); ctx.stroke();
      ctx.strokeStyle='#4a3810'; ctx.lineWidth=s(5);
      ctx.beginPath(); ctx.moveTo(cx-s(200),cy+s(60)); ctx.lineTo(cx+s(200),cy+s(60)); ctx.stroke();
      // Pipe bolts
      for(let i=-3;i<=3;i++){
        ctx.fillStyle='#3a2808';
        ctx.beginPath(); ctx.arc(cx+i*s(60),cy+s(60),s(4),0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#6a5020'; ctx.lineWidth=s(1.5);
        ctx.beginPath(); ctx.arc(cx+i*s(60),cy+s(60),s(4),0,Math.PI*2); ctx.stroke();
      }
      // Pizza box on crate
      ctx.fillStyle='#3a2010'; ctx.beginPath(); ctx.roundRect(cx+s(90),cy-s(10),s(50),s(50),s(2)); ctx.fill();
      ctx.fillStyle='#2a1808'; ctx.beginPath(); ctx.roundRect(cx+s(92),cy-s(8),s(46),s(5),s(1)); ctx.fill();
      break;
    }
    case 'leo':{
      // ─ LEO'S DOJO: discipline, training, content filming ─
      // Tatami mats — grid pattern
      ctx.save();
      ctx.beginPath(); ctx.arc(cx,cy,r*.85,0,Math.PI*2); ctx.clip();
      for(let row=0;row<5;row++) for(let col=0;col<5;col++){
        const tx=cx-s(90)+col*s(40), ty=cy-s(90)+row*s(40);
        ctx.fillStyle=row%2===col%2?'#1c140a':'#181008';
        ctx.fillRect(tx+s(1),ty+s(1),s(38),s(38));
        ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=s(1);
        ctx.strokeRect(tx+s(1),ty+s(1),s(38),s(38));
      }
      ctx.restore();

      // Training dummy (3D cylinder)
      box3d(cx-s(98),cy-s(25),s(16),s(58),s(6),'#5a3a18','#3a2210','#4a2e14');
      ctx.fillStyle='#4a2e10';
      ctx.beginPath(); ctx.ellipse(cx-s(90),cy-s(28),s(14),s(10),0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#6a4a20'; ctx.lineWidth=s(1.5);
      ctx.beginPath(); ctx.ellipse(cx-s(90),cy-s(28),s(14),s(10),0,0,Math.PI*2); ctx.stroke();
      // Dummy arms
      ctx.strokeStyle='#5a3a18'; ctx.lineWidth=s(5);
      ctx.beginPath(); ctx.moveTo(cx-s(90)-s(18),cy-s(14)); ctx.lineTo(cx-s(90)+s(18),cy-s(14)); ctx.stroke();

      // Katana rack (3D)
      box3d(cx+s(68),cy-s(85),s(14),s(78),s(5),'#1a1408','#100e04','#161206');
      for(let k=0;k<3;k++){
        ctx.strokeStyle='rgba(190,200,220,.75)'; ctx.lineWidth=s(2);
        ctx.beginPath(); ctx.moveTo(cx+s(75),cy-s(78)+k*s(24)); ctx.lineTo(cx+s(75)+s(58),cy-s(67)+k*s(24)); ctx.stroke();
        ctx.fillStyle='#b09030';
        ctx.beginPath(); ctx.ellipse(cx+s(78),cy-s(76)+k*s(24),s(5),s(3),-.3,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#5a3010'; ctx.lineWidth=s(2.5);
        ctx.beginPath(); ctx.moveTo(cx+s(75),cy-s(78)+k*s(24)); ctx.lineTo(cx+s(67),cy-s(67)+k*s(24)); ctx.stroke();
      }

      // ─ Camera/tripod for filming workouts ─
      const tpx=cx-s(60), tpy=cy+s(30);
      ctx.strokeStyle='#404850'; ctx.lineWidth=s(2.5);
      ctx.beginPath(); ctx.moveTo(tpx,tpy-s(35)); ctx.lineTo(tpx-s(18),tpy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(tpx,tpy-s(35)); ctx.lineTo(tpx+s(18),tpy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(tpx,tpy-s(35)); ctx.lineTo(tpx,tpy); ctx.stroke();
      // Camera body (3D box)
      box3d(tpx-s(14),tpy-s(50),s(28),s(16),s(7),'#252830','#151820','#1e2028');
      // Camera lens
      const lensG=ctx.createRadialGradient(tpx+s(10),tpy-s(43),0,tpx+s(10),tpy-s(43),s(7));
      lensG.addColorStop(0,'#c0d0e0');lensG.addColorStop(.5,'#3a4a60');lensG.addColorStop(1,'#0a0e14');
      ctx.fillStyle=lensG;ctx.beginPath();ctx.ellipse(tpx+s(10),tpy-s(43),s(7),s(6),0,0,Math.PI*2);ctx.fill();
      // REC indicator
      if(p>.5){
        ctx.fillStyle='#cc1010';ctx.shadowColor='#ff3030';ctx.shadowBlur=s(4);
        ctx.beginPath();ctx.arc(tpx-s(8),tpy-s(48),s(2.5),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
      }

      // ─ Content schedule whiteboard ─
      box3d(cx+s(55),cy+s(40),s(60),s(40),s(4),'#0a0e14','#060810','#080c12');
      ctx.fillStyle='#0e1420';ctx.fillRect(cx+s(56),cy+s(41),s(58),s(38));
      ctx.font=`bold ${s(5)}px Orbitron,monospace`;ctx.textAlign='left';
      const schedule=['AM: TRAIN+FILM','10AM: EDIT','PM: POST','TOMORROW:','  KATA SERIES'];
      schedule.forEach((line,i)=>{
        ctx.fillStyle=i===0?rgba(c,.65):`rgba(${hexRgb(c)},.3)`;
        ctx.fillText(line,cx+s(59),cy+s(49)+i*s(7));
      });

      // Candles
      for(let ci=0;ci<2;ci++){
        const candleX=cx+s(-30+ci*60), candleY=cy+s(70);
        ctx.fillStyle='#d4c090';
        ctx.beginPath(); ctx.roundRect(candleX-s(4),candleY-s(20),s(8),s(20),s(2)); ctx.fill();
        const fg2=ctx.createRadialGradient(candleX,candleY-s(24),0,candleX,candleY-s(24),s(10));
        fg2.addColorStop(0,'rgba(255,240,120,.9)');fg2.addColorStop(.4,'rgba(255,120,30,.4)');fg2.addColorStop(1,'transparent');
        ctx.fillStyle=fg2;ctx.beginPath();ctx.arc(candleX,candleY-s(24),s(10),0,Math.PI*2);ctx.fill();
      }
      const lg=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      lg.addColorStop(0,rgba(c,.07));lg.addColorStop(1,'transparent');
      ctx.fillStyle=lg;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
      break;
    }
    case 'don':{
      // ─ DON'S LAB: invention prototypes, triple monitors, schematics ─
      // Main workbench (3D box)
      box3d(cx-s(115),cy-s(22),s(230),s(58),s(8),'#140a1e','#0c0614','#1a0c28');

      // Triple monitors on bench back
      for(let i=0;i<3;i++){
        const mx=cx-s(80)+i*s(72), my=cy-s(88);
        // Monitor 3D body
        box3d(mx-s(28),my-s(26),s(56),s(36),s(5),'#0a0614','#060410','#0e0818');
        // Screen glow
        const screenCols=['#001a33','#1a0033','#001a33'];
        ctx.fillStyle=screenCols[i]; ctx.beginPath(); ctx.roundRect(mx-s(24),my-s(23),s(48),s(30),s(2)); ctx.fill();
        // Code / UI on screens
        if(i===0){
          // Code editor
          for(let l=0;l<5;l++){const ll=s(10+Math.sin(l*1.8+t*.015)*10);ctx.fillStyle=`rgba(${hexRgb(c)},${.25+p*.2})`;ctx.fillRect(mx-s(21),my-s(20)+l*s(5),ll,s(2));}
          ctx.fillStyle=`rgba(${hexRgb(c)},.5)`;ctx.fillRect(mx-s(21),my-s(18),s(6),s(2));
        } else if(i===1){
          // Wireframe prototype mock
          ctx.strokeStyle=rgba(c,.5);ctx.lineWidth=s(1);

      ctx.beginPath(); ctx.moveTo(cx+s(41),cy+s(22)); ctx.lineTo(cx+s(74),cy+s(22)); ctx.stroke();
      // Painting in progress — abstract expressionist

      for(let pi=0;pi<8;pi++){

      frames.forEach((f,fi)=>{

        ctx.strokeRect(cx+f.x+s(2),cy+f.y+s(2),f.w-s(4),f.h-s(4));

        box3d(cx-s(112),cy+s(28+pb*9),s(52),s(8),s(4),pb%2===0?'#3a2010':'#2a1808',pb%2===0?'#2a1808':'#1e1206','#1a1006');
        ctx.fillStyle=rgba('#dd7700',.12); ctx.font=`${s(5)}px monospace`; ctx.textAlign='center';

        ctx.strokeStyle=rgba(c,0.25+Math.abs(Math.sin(t*.05+sp))*.35); ctx.lineWidth=s(2);
        ctx.beginPath(); ctx.arc(spx,cy-s(6),s(12),0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.arc(spx,cy+s(12),s(6),0,Math.PI*2); ctx.stroke();
        // Waveform bars
        for(let wb=0;wb<5;wb++){
          const wh=s(4+Math.abs(Math.sin(t*.08+sp+wb*.8))*10);
          ctx.fillStyle=rgba(c,.3+Math.abs(Math.sin(t*.08+sp+wb*.8))*.4);
          ctx.fillRect(spx-s(10)+wb*s(5),cy+s(20)-wh*.5,s(3),wh);

      break;
    }
    case 'splinter':{
      // Stone floor pattern
      ctx.save();
      ctx.beginPath(); ctx.arc(cx,cy,r*.9,0,Math.PI*2); ctx.clip();

      ctx.beginPath(); ctx.ellipse(cx,cy+s(28),s(45),s(28),0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(80,140,40,.5)'; ctx.lineWidth=s(1.5);
      ctx.beginPath(); ctx.ellipse(cx,cy+s(28),s(43),s(26),0,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(cx,cy+s(28),s(30),s(18),0,0,Math.PI*2); ctx.stroke();
      // 3D Map table
      box3d(cx-s(62),cy-s(88),s(124),s(60),s(10),'#0e1408','#080e04','#0a1006');
      ctx.strokeStyle='rgba(60,100,30,.6)'; ctx.lineWidth=s(2);
      ctx.beginPath(); ctx.rect(cx-s(58),cy-s(85),s(116),s(54)); ctx.stroke();
      // Tactical map grid
      ctx.strokeStyle=rgba(c,.12); ctx.lineWidth=s(.8);
      for(let mg=0;mg<6;mg++){
        ctx.beginPath(); ctx.moveTo(cx-s(58)+mg*s(20),cy-s(85)); ctx.lineTo(cx-s(58)+mg*s(20),cy-s(31)); ctx.stroke();

        ctx.beginPath(); ctx.moveTo(cx-s(58),cy-s(85)+mg*s(18)); ctx.lineTo(cx+s(58),cy-s(85)+mg*s(18)); ctx.stroke();
      }
      // Tactical pins on map
      const pins=[{px:-30,py:-72,col:'#ff2222'},{px:10,py:-60,col:'#ffaa00'},{px:-10,py:-48,col:'#2266cc'},{px:30,py:-66,col:'#ff2222'}];
      pins.forEach(pin=>{

        ctx.beginPath(); ctx.moveTo(cx+s(pin.px),cy+s(pin.py)); ctx.lineTo(cx+s(pin.px+4),cy+s(pin.py-10)); ctx.stroke();
      });

      box3d(cx+s(75),cy-s(20),s(42),s(55),s(5),'#0f1a08','#0a1204','#0d1806');

      ['PHASE I','PHASE II','EXECUTE'].forEach((ln,li)=>{
        ctx.fillText(ln,cx+s(78),cy+s(-10+li*14));
        ctx.fillStyle=rgba(c,.15); ctx.fillRect(cx+s(78),cy+s(-6+li*14),s(35),s(1));
        ctx.fillStyle=rgba(c,.3);
      });
      // Incense with animated smoke

        ctx.strokeStyle=`rgba(180,150,100,${.1+p*.08})`; ctx.lineWidth=s(1);

        ctx.stroke();
      }
      const sg2=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      sg2.addColorStop(0,rgba(c,.07)); sg2.addColorStop(1,'transparent');
      ctx.fillStyle=sg2; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();

    }
  }
}

// ── Draw a Turtle (top-down, realistic curved) ────────────────────
function drawTurtle(x,y,room,walkPhase,buildPhase,opacity,isWorking){
  if(opacity<=0) return;
  const {sx,sy}=ws(x,y);
  const sc=scl(20);
  const bandana=room.bandana;
  const isSplinter=room.isSplinter||false;

  ctx.save();
  ctx.globalAlpha=opacity;
  ctx.translate(sx,sy);

  const bob=Math.abs(Math.sin(walkPhase*4))*sc*.04;

  if(isSplinter){
    // ── SPLINTER — RAT ─────────────────────────────────────────
    const rs=sc*1.05;

    // Shadow
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(0,rs*.1,rs*.7,rs*.28,0,0,Math.PI*2); ctx.fill();

    // Robe / body (hunched rat shape)
    const robeG=ctx.createRadialGradient(-rs*.1,-rs*.05,0,0,0,rs*.85);
    robeG.addColorStop(0,'#2e3820'); robeG.addColorStop(.6,'#1e2814'); robeG.addColorStop(1,'#101408');
    ctx.fillStyle=robeG;
    ctx.beginPath(); ctx.ellipse(0,0,rs*.72,rs*.78,0,0,Math.PI*2); ctx.fill();
    // Robe detail lines
    ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=rs*.04;
    ctx.beginPath(); ctx.moveTo(0,-rs*.4); ctx.lineTo(-rs*.1,rs*.4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-rs*.4); ctx.lineTo(rs*.1,rs*.4); ctx.stroke();

    // Paws (small, dark)
    for(let pi=0;pi<4;pi++){
      const pa=(pi/4)*Math.PI*2+Math.PI*.125;
      const pw=pi%2===0?Math.sin(walkPhase*4)*.08:-Math.sin(walkPhase*4)*.08;
      ctx.fillStyle='#5a4030';
      ctx.beginPath(); ctx.ellipse(Math.cos(pa)*rs*.68,Math.sin(pa)*rs*.65+pw*rs,rs*.13,rs*.16,pa,0,Math.PI*2); ctx.fill();
    }

    // Tail
    ctx.strokeStyle='#5a4030'; ctx.lineWidth=rs*.08;
    ctx.beginPath();
    ctx.moveTo(rs*.3,rs*.5);
    ctx.bezierCurveTo(rs*.6,rs*.7,rs*.9,rs*.4,rs*.85,-rs*.1);
    ctx.stroke();
    ctx.strokeStyle='#4a3020'; ctx.lineWidth=rs*.04;
    ctx.beginPath();
    ctx.moveTo(rs*.3,rs*.5);
    ctx.bezierCurveTo(rs*.6,rs*.7,rs*.9,rs*.4,rs*.85,-rs*.1);
    ctx.stroke();

    // Head — elongated snout
    ctx.save();
    ctx.translate(0,-rs*.85);

    // Ears (round, on top)
    for(let e=0;e<2;e++){
      const ex=(e-.5)*rs*.5;
      ctx.fillStyle='#5a4030';
      ctx.beginPath(); ctx.arc(ex,-rs*.1,rs*.18,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#8a5040';
      ctx.beginPath(); ctx.arc(ex,-rs*.1,rs*.1,0,Math.PI*2); ctx.fill();
    }

    // Skull
    const headG=ctx.createRadialGradient(-rs*.08,-rs*.05,0,0,0,rs*.4);
    headG.addColorStop(0,'#6a5040'); headG.addColorStop(.5,'#4a3828'); headG.addColorStop(1,'#302418');
    ctx.fillStyle=headG;
    ctx.beginPath(); ctx.ellipse(0,-rs*.02,rs*.36,rs*.32,0,0,Math.PI*2); ctx.fill();

    // Snout (elongated forward — pointing down in top-down)
    ctx.fillStyle='#5a4030';
    ctx.beginPath();
    ctx.ellipse(0,rs*.22,rs*.22,rs*.3,.0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#4a3020';
    ctx.beginPath();
    ctx.ellipse(0,rs*.28,rs*.18,rs*.24,0,0,Math.PI*2); ctx.fill();

    // Nose (pink, tip of snout)
    ctx.fillStyle='#c87070';
    ctx.beginPath(); ctx.ellipse(0,rs*.43,rs*.09,rs*.07,0,0,Math.PI*2); ctx.fill();

    // Nostrils
    ctx.fillStyle='rgba(0,0,0,.5)';
    ctx.beginPath(); ctx.ellipse(-rs*.04,rs*.44,rs*.03,rs*.025,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(rs*.04,rs*.44,rs*.03,rs*.025,0,0,Math.PI*2); ctx.fill();

    // Whiskers
    ctx.strokeStyle='rgba(220,200,170,.55)'; ctx.lineWidth=rs*.018;
    for(let w=0;w<3;w++){
      const wy=rs*(.25+w*.07);
      ctx.beginPath(); ctx.moveTo(-rs*.1,wy); ctx.lineTo(-rs*.55,wy-rs*(.05-w*.02)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(rs*.1,wy);  ctx.lineTo(rs*.55,wy-rs*(.05-w*.02));  ctx.stroke();
    }

    // Eyes (beady, dark, with green glow)
    ctx.fillStyle='#c0a070';
    ctx.beginPath(); ctx.ellipse(-rs*.14,rs*.05,rs*.06,rs*.055,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(rs*.14,rs*.05,rs*.06,rs*.055,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1a1008';
    ctx.beginPath(); ctx.ellipse(-rs*.14,rs*.05,rs*.04,rs*.038,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(rs*.14,rs*.05,rs*.04,rs*.038,0,0,Math.PI*2); ctx.fill();
    // Eye gleam
    ctx.fillStyle='rgba(180,220,100,.7)';
    ctx.shadowColor='#449933'; ctx.shadowBlur=rs*.4;
    ctx.beginPath(); ctx.arc(-rs*.12,rs*.03,rs*.015,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(rs*.12,rs*.03,rs*.015,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;

    // Robes collar visible around head
    ctx.strokeStyle='rgba(40,55,25,.6)'; ctx.lineWidth=rs*.06;
    ctx.beginPath(); ctx.arc(0,0,rs*.3,Math.PI*.6,Math.PI*2.4); ctx.stroke();

    ctx.restore();

    // Staff
    ctx.strokeStyle='#6a4818'; ctx.lineWidth=rs*.1;
    ctx.beginPath(); ctx.moveTo(-rs*.3,rs*.6); ctx.lineTo(rs*.4,-rs*.85); ctx.stroke();
    ctx.fillStyle='#8a6020';
    ctx.beginPath(); ctx.arc(rs*.4,-rs*.85,rs*.1,0,Math.PI*2); ctx.fill();

  } else {
    // ── TURTLE — humanoid top-down ────────────────────────────────
    const ts = sc * 1.15;
    const swing = Math.sin(walkPhase * 4);
    const bk = room.bandana;
    const bkDk = shade(bk, -50);
    const bkLt = shade(bk, 40);
    const skinDk = '#2a6010';
    const skin = '#3a8820';
    const skinLt = '#52aa30';

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.beginPath(); ctx.ellipse(0, ts*.18, ts*.72, ts*.3, 0, 0, Math.PI*2); ctx.fill();

    // ── LEGS ──────────────────────────────────────────────────────
    const lSwingL = swing * ts * .18;
    const lSwingR = -swing * ts * .18;
    // Left leg + foot
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.ellipse(-ts*.26, ts*.72+lSwingL, ts*.15, ts*.26, .12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = skinDk;
    ctx.beginPath(); ctx.ellipse(-ts*.3, ts*.98+lSwingL, ts*.12, ts*.1, .25, 0, Math.PI*2); ctx.fill();
    // claws
    for(let c=0;c<3;c++){
      ctx.fillStyle='#1a4808';
      ctx.beginPath(); ctx.ellipse(-ts*.22+c*ts*.08, ts*1.06+lSwingL, ts*.03, ts*.05, c*.2-.2, 0, Math.PI*2); ctx.fill();
    }
    // Right leg + foot
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.ellipse(ts*.26, ts*.72+lSwingR, ts*.15, ts*.26, -.12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = skinDk;
    ctx.beginPath(); ctx.ellipse(ts*.3, ts*.98+lSwingR, ts*.12, ts*.1, -.25, 0, Math.PI*2); ctx.fill();
    for(let c=0;c<3;c++){
      ctx.fillStyle='#1a4808';
      ctx.beginPath(); ctx.ellipse(ts*.18+c*ts*.08, ts*1.06+lSwingR, ts*.03, ts*.05, -c*.2+.2, 0, Math.PI*2); ctx.fill();
    }

    // ── LEFT ARM ──────────────────────────────────────────────────
    const aSwingL = -swing * ts * .1;
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.ellipse(-ts*.86+aSwingL, -ts*.08, ts*.15, ts*.28, -.25, 0, Math.PI*2); ctx.fill();
    // left hand fist
    ctx.beginPath(); ctx.arc(-ts*.97+aSwingL, -ts*.22, ts*.12, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = skinDk; ctx.lineWidth = ts*.025;
    ctx.beginPath(); ctx.arc(-ts*.97+aSwingL, -ts*.22, ts*.1, 0, Math.PI*2); ctx.stroke();

    // ── RIGHT ARM (weapon arm) ────────────────────────────────────
    const aSwingR = swing * ts * .1;
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.ellipse(ts*.86+aSwingR, -ts*.08, ts*.15, ts*.28, .25, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ts*.97+aSwingR, -ts*.22, ts*.12, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = skinDk; ctx.lineWidth = ts*.025;
    ctx.beginPath(); ctx.arc(ts*.97+aSwingR, -ts*.22, ts*.1, 0, Math.PI*2); ctx.stroke();

    // ── WEAPON ────────────────────────────────────────────────────
    const key = room.key;
    if(key==='leo'){
      // Dual katana — one in each hand, blades pointing forward/diagonal
      const katAngle = -.55 + swing*.08;
      [[ts*.97+aSwingR,-ts*.22,katAngle],[ts*-.97+aSwingL,-ts*.22,katAngle+.3]].forEach(([hx,hy,ang])=>{
        ctx.save(); ctx.translate(hx,hy); ctx.rotate(ang);
        // Handle wrap
        ctx.strokeStyle='#5a3010'; ctx.lineWidth=ts*.08;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,ts*.25); ctx.stroke();
        ctx.strokeStyle='rgba(200,150,80,.6)'; ctx.lineWidth=ts*.03;
        for(let w=0;w<4;w++) { ctx.beginPath(); ctx.moveTo(-ts*.04,ts*.04+w*ts*.055); ctx.lineTo(ts*.04,ts*.06+w*ts*.055); ctx.stroke(); }
        // Guard
        ctx.fillStyle='#b09030'; ctx.beginPath(); ctx.ellipse(0,ts*.25,ts*.1,ts*.04,0,0,Math.PI*2); ctx.fill();
        // Blade (silver)
        const blG=ctx.createLinearGradient(-ts*.03,ts*.25,-ts*.01,ts*.25-ts*.8);
        blG.addColorStop(0,'#a0a8b8'); blG.addColorStop(.5,'#d8e0f0'); blG.addColorStop(1,'rgba(200,210,230,0)');
        ctx.fillStyle=blG;
        ctx.beginPath(); ctx.moveTo(-ts*.03,ts*.25); ctx.lineTo(ts*.03,ts*.25); ctx.lineTo(ts*.005,ts*.25-ts*.8); ctx.closePath(); ctx.fill();
        ctx.strokeStyle='rgba(160,170,190,.4)'; ctx.lineWidth=ts*.01;
        ctx.beginPath(); ctx.moveTo(0,ts*.28); ctx.lineTo(ts*.005,ts*.25-ts*.8); ctx.stroke();
        ctx.restore();
      });
    } else if(key==='don'){
      // Bo staff — long pole through both hands
      const staffAng = -.4 + swing*.04;
      ctx.save(); ctx.translate(0,0); ctx.rotate(staffAng);
      const staffG=ctx.createLinearGradient(-ts*1.5,-ts*.05,ts*1.5,ts*.05);
      staffG.addColorStop(0,'#3a2008'); staffG.addColorStop(.3,'#6a4020'); staffG.addColorStop(.7,'#6a4020'); staffG.addColorStop(1,'#3a2008');
      ctx.fillStyle=staffG;
      ctx.beginPath(); ctx.roundRect(-ts*1.45,-ts*.04,ts*2.9,ts*.08,ts*.04); ctx.fill();
      ctx.strokeStyle='rgba(200,150,80,.3)'; ctx.lineWidth=ts*.015;
      ctx.beginPath(); ctx.moveTo(-ts*1.45,-ts*.025); ctx.lineTo(ts*1.45,-ts*.025); ctx.stroke();
      // Staff tips
      ctx.fillStyle='#b08030';
      ctx.beginPath(); ctx.ellipse(-ts*1.44,0,ts*.06,ts*.06,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(ts*1.44,0,ts*.06,ts*.06,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    } else if(key==='raph'){
      // Dual sai — pronged weapons
      [[-ts*.97+aSwingL,-ts*.22,-1],[ts*.97+aSwingR,-ts*.22,1]].forEach(([hx,hy,side])=>{
        ctx.save(); ctx.translate(hx,hy); ctx.rotate(side*-.4+swing*.06*side);
        // Handle
        ctx.strokeStyle='#4a2808'; ctx.lineWidth=ts*.1;
        ctx.beginPath(); ctx.moveTo(0,ts*.12); ctx.lineTo(0,-ts*.35); ctx.stroke();
        // Main prong
        ctx.strokeStyle='#c0c8d8'; ctx.lineWidth=ts*.06;
        ctx.beginPath(); ctx.moveTo(0,-ts*.35); ctx.lineTo(0,-ts*.9); ctx.stroke();
        ctx.strokeStyle='#e0e8f0'; ctx.lineWidth=ts*.025;
        ctx.beginPath(); ctx.moveTo(0,-ts*.38); ctx.lineTo(side*ts*.02,-ts*.9); ctx.stroke();
        // Side prongs (the sai's guard)
        ctx.strokeStyle='#c0c8d8'; ctx.lineWidth=ts*.04;
        ctx.beginPath(); ctx.moveTo(-side*ts*.06,-ts*.3); ctx.lineTo(-side*ts*.22,-ts*.52); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(side*ts*.06,-ts*.3); ctx.lineTo(side*ts*.22,-ts*.52); ctx.stroke();
        // Tips
        ctx.fillStyle='#d0d8e8';
        ctx.beginPath(); ctx.arc(0,-ts*.9,ts*.03,0,Math.PI*2); ctx.fill();
        ctx.restore();
      });
    } else if(key==='mikey'){
      // Nunchaku — chain between hands, spinning
      const spin = walkPhase * 3;
      const chainAng = spin * .8;
      const cx1=-ts*.97+aSwingL, cy1=-ts*.22;
      const cx2=ts*.97+aSwingR,  cy2=-ts*.22;
      // Chain
      ctx.strokeStyle='rgba(180,160,120,.5)'; ctx.lineWidth=ts*.025;
      ctx.setLineDash([ts*.03,ts*.04]);
      ctx.beginPath(); ctx.moveTo(cx1,cy1); ctx.quadraticCurveTo(0,cy1-ts*.3+Math.sin(spin)*ts*.15,cx2,cy2); ctx.stroke();
      ctx.setLineDash([]);
      // Handles (nunchaku sticks)
      [[cx1,cy1,chainAng-.8],[cx2,cy2,-chainAng+.8]].forEach(([hx,hy,ang])=>{
        ctx.save(); ctx.translate(hx,hy); ctx.rotate(ang);
        const nhG=ctx.createLinearGradient(-ts*.06,0,ts*.06,0);
        nhG.addColorStop(0,'#3a2008'); nhG.addColorStop(.5,'#6a4020'); nhG.addColorStop(1,'#3a2008');
        ctx.fillStyle=nhG;
        ctx.beginPath(); ctx.roundRect(-ts*.055,-ts*.38,ts*.11,ts*.55,ts*.04); ctx.fill();
        // Wrapping
        ctx.strokeStyle='rgba(200,150,80,.4)'; ctx.lineWidth=ts*.02;
        for(let w=0;w<4;w++){ctx.beginPath();ctx.moveTo(-ts*.055,-ts*.28+w*ts*.08);ctx.lineTo(ts*.055,-ts*.26+w*ts*.08);ctx.stroke();}
        ctx.restore();
      });
    }

    // ── SHELL ─────────────────────────────────────────────────────
    const shellG = ctx.createRadialGradient(-ts*.15,-ts*.1,0,0,0,ts*.85);
    shellG.addColorStop(0,'#8a6e28');
    shellG.addColorStop(.4,'#6a5218');
    shellG.addColorStop(.75,'#4a3a0e');
    shellG.addColorStop(1,'#2e2408');
    ctx.fillStyle = shellG;
    ctx.beginPath(); ctx.ellipse(0,0,ts*.72,ts*.78,0,0,Math.PI*2); ctx.fill();
    // Shell rim highlight
    ctx.strokeStyle='rgba(255,255,200,.08)'; ctx.lineWidth=ts*.04;
    ctx.beginPath(); ctx.ellipse(-ts*.12,-ts*.14,ts*.48,ts*.52,-.2,0,Math.PI); ctx.stroke();
    // Scute pattern
    ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.lineWidth=ts*.055;
    ctx.beginPath(); ctx.ellipse(0,-ts*.1,ts*.28,ts*.3,0,0,Math.PI*2); ctx.stroke();
    for(let i=0;i<5;i++){
      const sa=(i/5)*Math.PI*2-Math.PI*.5;
      ctx.beginPath(); ctx.ellipse(Math.cos(sa)*ts*.44,Math.sin(sa)*ts*.42+ts*.04,ts*.18,ts*.2,sa,0,Math.PI*2); ctx.stroke();
    }
    // Accent stripe on shell (character color)
    ctx.strokeStyle=rgba(bk,.22); ctx.lineWidth=ts*.05;
    ctx.beginPath(); ctx.ellipse(0,0,ts*.68,ts*.74,0,0,Math.PI*2); ctx.stroke();

    // ── NECK ──────────────────────────────────────────────────────
    const nkG=ctx.createLinearGradient(-ts*.16,-ts*.52,ts*.12,-ts*.65);
    nkG.addColorStop(0,skinDk); nkG.addColorStop(1,skin);
    ctx.fillStyle=nkG;
    ctx.beginPath(); ctx.ellipse(0,-ts*.56,ts*.16,ts*.22,0,0,Math.PI*2); ctx.fill();

    // ── HEAD ──────────────────────────────────────────────────────
    const hdG=ctx.createRadialGradient(-ts*.1,-ts*.88,ts*.04,0,-ts*.86,ts*.36);
    hdG.addColorStop(0,skinLt); hdG.addColorStop(.5,skin); hdG.addColorStop(1,skinDk);
    ctx.fillStyle=hdG;
    ctx.beginPath(); ctx.ellipse(0,-ts*.84,ts*.33,ts*.31,0,0,Math.PI*2); ctx.fill();

    // Chin/jaw
    ctx.fillStyle=shade(skin,-10);
    ctx.beginPath(); ctx.ellipse(0,-ts*.72,ts*.2,ts*.1,0,0,Math.PI*2); ctx.fill();

    // Bandana mask (covers forehead + eyes)
    ctx.shadowColor=bk; ctx.shadowBlur=ts*.3;
    ctx.fillStyle=bk;
    ctx.beginPath(); ctx.roundRect(-ts*.35,-ts*1.0,ts*.7,ts*.2,ts*.05); ctx.fill();
    ctx.shadowBlur=0;
    // Mask highlight
    ctx.fillStyle=bkLt;
    ctx.beginPath(); ctx.roundRect(-ts*.32,-ts*.99,ts*.64,ts*.05,ts*.02); ctx.fill();
    // Mask bottom edge
    ctx.fillStyle=bkDk;
    ctx.beginPath(); ctx.roundRect(-ts*.34,-ts*.83,ts*.68,ts*.03,ts*.01); ctx.fill();

    // Eye holes — white sclera visible
    ctx.fillStyle='rgba(240,240,220,.9)';
    ctx.beginPath(); ctx.ellipse(-ts*.11,-ts*.91,ts*.075,ts*.062,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(ts*.11,-ts*.91,ts*.075,ts*.062,0,0,Math.PI*2); ctx.fill();
    // Iris (bandana color tinted)
    ctx.fillStyle=shade(bk,10);
    ctx.beginPath(); ctx.ellipse(-ts*.11,-ts*.912,ts*.046,ts*.042,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(ts*.11,-ts*.912,ts*.046,ts*.042,0,0,Math.PI*2); ctx.fill();
    // Pupils
    ctx.fillStyle='#060606';
    ctx.beginPath(); ctx.ellipse(-ts*.11,-ts*.912,ts*.026,ts*.026,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(ts*.11,-ts*.912,ts*.026,ts*.026,0,0,Math.PI*2); ctx.fill();
    // Eye shine
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(-ts*.1,-ts*.922,ts*.012,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ts*.12,-ts*.922,ts*.012,0,Math.PI*2); ctx.fill();
    // Glow through eye holes
    ctx.shadowColor=bk; ctx.shadowBlur=ts*.5;
    ctx.fillStyle=rgba(bk,.55);
    ctx.beginPath(); ctx.ellipse(-ts*.11,-ts*.912,ts*.035,ts*.03,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(ts*.11,-ts*.912,ts*.035,ts*.03,0,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;

    // Bandana knot + tails (behind/side of head)
    ctx.fillStyle=bkDk;
    ctx.beginPath();
    ctx.moveTo(ts*.06,-ts*.84); ctx.quadraticCurveTo(ts*.3,-ts*.66,ts*.24,-ts*.52);
    ctx.lineTo(ts*.12,-ts*.54); ctx.quadraticCurveTo(ts*.16,-ts*.68,ts*.0,-ts*.82); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(ts*.13,-ts*.86); ctx.quadraticCurveTo(ts*.42,-ts*.6,ts*.34,-ts*.46);
    ctx.lineTo(ts*.2,-ts*.48); ctx.quadraticCurveTo(ts*.24,-ts*.62,ts*.08,-ts*.8); ctx.closePath(); ctx.fill();

    // Nostril slits
    ctx.fillStyle='rgba(0,0,0,.5)';
    ctx.beginPath(); ctx.ellipse(-ts*.04,-ts*.73,ts*.025,ts*.016,.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(ts*.04,-ts*.73,ts*.025,ts*.016,-.3,0,Math.PI*2); ctx.fill();
  }

  // Working indicator
  if(isWorking){
    ctx.shadowColor=room.bandana; ctx.shadowBlur=sc*.6;
    ctx.fillStyle=room.bandana;
    ctx.font=`${sc*.75}px VT323,monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('⚙',0,-sc*(isSplinter?2.1:1.65));
    ctx.shadowBlur=0;
  }

  ctx.restore();
}

// ── Draw tunnels ──────────────────────────────────────────────────
function drawTunnel(tn){
  const r1=ROOMS.find(r=>r.key===tn.from), r2=ROOMS.find(r=>r.key===tn.to);
  const p1=ws(r1.cx,r1.cy), p2=ws(r2.cx,r2.cy);
  const hw=scl(tn.w)*.5;
  const dx=p2.sx-p1.sx, dy=p2.sy-p1.sy, len=Math.sqrt(dx*dx+dy*dy);
  const nx=(-dy/len)*hw, ny=(dx/len)*hw;

  // Tunnel wall (outer)
  ctx.fillStyle='#080604';
  ctx.beginPath();
  ctx.moveTo(p1.sx+nx*1.2,p1.sy+ny*1.2); ctx.lineTo(p2.sx+nx*1.2,p2.sy+ny*1.2);
  ctx.lineTo(p2.sx-nx*1.2,p2.sy-ny*1.2); ctx.lineTo(p1.sx-nx*1.2,p1.sy-ny*1.2);
  ctx.closePath(); ctx.fill();

  // Tunnel floor
  const tfG=ctx.createLinearGradient(p1.sx,p1.sy,p2.sx,p2.sy);
  tfG.addColorStop(0,r1.floorColor); tfG.addColorStop(1,r2.floorColor);
  ctx.fillStyle=tfG;
  ctx.beginPath();
  ctx.moveTo(p1.sx+nx,p1.sy+ny); ctx.lineTo(p2.sx+nx,p2.sy+ny);
  ctx.lineTo(p2.sx-nx,p2.sy-ny); ctx.lineTo(p1.sx-nx,p1.sy-ny);
  ctx.closePath(); ctx.fill();

  // Wet floor sheen
  ctx.fillStyle='rgba(255,255,255,.015)';
  ctx.beginPath();
  ctx.moveTo(p1.sx+nx*.1,p1.sy+ny*.1); ctx.lineTo(p2.sx+nx*.1,p2.sy+ny*.1);
  ctx.lineTo(p2.sx+nx*.3,p2.sy+ny*.3); ctx.lineTo(p1.sx+nx*.3,p1.sy+ny*.3);
  ctx.closePath(); ctx.fill();

  // Brick cross-lines
  const steps=Math.floor(len/scl(36));
  ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=scl(1);
  for(let i=1;i<steps;i++){
    const prog=i/steps, bx=p1.sx+dx*prog, by=p1.sy+dy*prog;
    ctx.beginPath(); ctx.moveTo(bx+nx*.92,by+ny*.92); ctx.lineTo(bx-nx*.92,by-ny*.92); ctx.stroke();
  }

  // Pipe (runs along one wall)
  ctx.strokeStyle='#5a4018'; ctx.lineWidth=scl(7);
  ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(p1.sx+nx*.78,p1.sy+ny*.78); ctx.lineTo(p2.sx+nx*.78,p2.sy+ny*.78); ctx.stroke();
  ctx.strokeStyle='#3a2808'; ctx.lineWidth=scl(4);
  ctx.beginPath(); ctx.moveTo(p1.sx+nx*.78,p1.sy+ny*.78); ctx.lineTo(p2.sx+nx*.78,p2.sy+ny*.78); ctx.stroke();
  // Pipe highlight
  ctx.strokeStyle='rgba(120,90,40,.3)'; ctx.lineWidth=scl(1.5);
  ctx.beginPath(); ctx.moveTo(p1.sx+nx*.72,p1.sy+ny*.72); ctx.lineTo(p2.sx+nx*.72,p2.sy+ny*.72); ctx.stroke();
  ctx.lineCap='butt';

  // Glow bleed from rooms
  const tg=ctx.createLinearGradient(p1.sx,p1.sy,p2.sx,p2.sy);
  tg.addColorStop(0,rgba(r1.accentColor,.05));
  tg.addColorStop(.5,'transparent');
  tg.addColorStop(1,rgba(r2.accentColor,.05));
  ctx.fillStyle=tg;
  ctx.beginPath();
  ctx.moveTo(p1.sx+nx*.85,p1.sy+ny*.85); ctx.lineTo(p2.sx+nx*.85,p2.sy+ny*.85);
  ctx.lineTo(p2.sx-nx*.85,p2.sy-ny*.85); ctx.lineTo(p1.sx-nx*.85,p1.sy-ny*.85);
  ctx.closePath(); ctx.fill();
}

// ── Draw room ─────────────────────────────────────────────────────
function drawRoom(room,t){
  const {sx:cx,sy:cy}=ws(room.cx,room.cy);
  const r=scl(room.r);

  // Walls (brick ring)
  drawBricks(cx,cy,r,room.wallColor,t);

  // Floor inside
  drawFloor(cx,cy,r*.94,room.floorColor,room.accentColor);

  // Furniture
  drawFurniture(room,cx,cy,r,t);

  // Room edge wall shadow
  const edgeShadow=ctx.createRadialGradient(cx,cy,r*.72,cx,cy,r);
  edgeShadow.addColorStop(0,'transparent');
  edgeShadow.addColorStop(1,'rgba(0,0,0,.6)');
  ctx.fillStyle=edgeShadow;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();

  // Accent rim glow
  ctx.beginPath(); ctx.arc(cx,cy,r*.96,0,Math.PI*2);
  ctx.strokeStyle=rgba(room.accentColor,.2); ctx.lineWidth=scl(3); ctx.stroke();

  // Room label
  if(r>50){
    ctx.save();
    ctx.font=`bold ${scl(11)}px 'Orbitron',monospace`;
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillStyle=rgba(room.accentColor,.45);
    ctx.fillText(room.label,cx,cy-r+scl(12));
    ctx.restore();
  }
}

// ── Turtles ───────────────────────────────────────────────────────
const turtles=ROOMS.filter(r=>r.bandana).map(room=>({
  room, x:room.cx+(Math.random()-.5)*50, y:room.cy+(Math.random()-.5)*50,
  tx:room.cx, ty:room.cy, walkPhase:Math.random()*10,
  buildPhase:0, state:'idle', idleTimer:Math.random()*80,
  buildTimer:0, opacity:0, built:0,
}));

// ── Ambient steam ─────────────────────────────────────────────────
const steamPts=[{x:0,y:-60,col:'rgba(160,140,90,'},{x:-180,y:80,col:'rgba(80,130,180,'},{x:180,y:80,col:'rgba(130,90,70,'}];
let steamT=0;

// ── Camera sequence ───────────────────────────────────────────────
let camIdx=0, camTimer=0;
const camSeq=[0,1,2,3,4,5];

// ── Feed ─────────────────────────────────────────────────────────
function addLog(room,msg){
  const feed=document.getElementById('feed');
  const el=document.createElement('div'); el.className='log';
  el.style.borderLeftColor=room.bandana;
  el.innerHTML=`<span class="who" style="color:${room.bandana}">${room.name}</span>${msg}`;
  feed.prepend(el);
  while(feed.children.length>3) feed.removeChild(feed.lastChild);
}

// ── Main loop ─────────────────────────────────────────────────────
let frame=0, lastT=0;

// Pre-compute floor crack seeds
const crackSeeds=ROOMS.map(()=>Array.from({length:5},()=>({a:Math.random()*Math.PI*2,r:Math.random(),ox1:(Math.random()-.5)*40,oy1:(Math.random()-.5)*40,ox2:(Math.random()-.5)*40,oy2:(Math.random()-.5)*40})));
const puddleSeeds=ROOMS.map(()=>Array.from({length:3},()=>({ox:(Math.random()-.5),oy:(Math.random()-.5),r:8+Math.random()*18,rot:Math.random()*Math.PI})));

function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min((ts-lastT)/16.67,3); lastT=ts; frame++;

  // Camera
  camTimer+=dt;
  if(camTimer>300){ camIdx=(camIdx+1)%camSeq.length; camTimer=0; }
  const tr=ROOMS[camSeq[camIdx]];
  const tz=camIdx===0?.58:.85;
  cam.tx=tr.cx; cam.ty=tr.cy; cam.tz=tz;
  cam.x+=(cam.tx-cam.x)*.016*dt;
  cam.y+=(cam.ty-cam.y)*.016*dt;
  cam.zoom+=(cam.tz-cam.zoom)*.016*dt;
  document.getElementById('cam-label').textContent=tr.label;

  // Steam & drips
  steamT+=dt;
  if(steamT>15){ steamPts.forEach(s=>steam(s.x,s.y,s.col,3)); steamT=0; }
  if(frame%50===0) drip(ROOMS[Math.floor(Math.random()*ROOMS.length)].cx+(Math.random()-.5)*120,ROOMS[Math.floor(Math.random()*ROOMS.length)].cy-70);

  // Particles
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=p.decay*dt;
    if(p.type==='steam') p.r+=0.06*dt;
    if(p.life<=0) parts.splice(i,1);
  }

  // Turtles
  turtles.forEach(t=>{
    if(t.opacity<1) t.opacity=Math.min(1,t.opacity+.01*dt);
    if(t.state==='idle'){
      if((t.idleTimer-=dt)<=0){
        const a=Math.random()*Math.PI*2, r=Math.random()*t.room.r*.62;
        t.tx=t.room.cx+Math.cos(a)*r; t.ty=t.room.cy+Math.sin(a)*r;
        t.state='walk';
      }
    } else if(t.state==='walk'){
      const dx=t.tx-t.x, dy=t.ty-t.y, d=Math.sqrt(dx*dx+dy*dy);
      if(d<4){ t.x=t.tx; t.y=t.ty; t.state=Math.random()<.5?'build':'idle'; t.idleTimer=70+Math.random()*90; t.buildTimer=80+Math.random()*100; }
      else { t.x+=dx/d*1.6*dt; t.y+=dy/d*1.6*dt; t.walkPhase+=dt*.16; }
    } else {
      t.buildPhase+=dt; t.walkPhase+=dt*.05;
      if((t.buildTimer-=dt)<=0){
        t.state='idle'; t.idleTimer=40; t.buildPhase=0; t.built++;
        spark(t.x,t.y,t.room.bandana);
        addLog(t.room,t.room.tasks[Math.floor(Math.random()*t.room.tasks.length)]);
      }
    }
  });

  // ── DRAW ─────────────────────────────────────────────────────────
  ctx.clearRect(0,0,W,H);

  // Background — deep dark stone
  const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);
  bg.addColorStop(0,'#201a10'); bg.addColorStop(1,'#0c0804');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // Tunnels behind rooms
  TUNNELS.forEach(t=>drawTunnel(t));

  // Rooms
  ROOMS.forEach(r=>drawRoom(r,frame));

  // Particles
  parts.forEach(p=>{
    const {sx,sy}=ws(p.x,p.y);
    ctx.globalAlpha=Math.max(0,p.life);
    if(p.type==='steam'){
      const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,scl(p.r));
      sg.addColorStop(0,p.col+'.12)'); sg.addColorStop(1,p.col+'0)');
      ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sx,sy,scl(p.r),0,Math.PI*2); ctx.fill();
    } else if(p.type==='drip'){
      ctx.fillStyle='#1a3a5a';
      ctx.beginPath(); ctx.ellipse(sx,sy,scl(1.2),scl(2.2),0,0,Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle=p.col; ctx.shadowColor=p.col; ctx.shadowBlur=scl(5);
      ctx.beginPath(); ctx.arc(sx,sy,scl(p.r),0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }
    ctx.globalAlpha=1;
  });

  // Turtles (depth sort)
  turtles.slice().sort((a,b)=>a.y-b.y).forEach(t=>drawTurtle(t.x,t.y,t.room,t.walkPhase,t.buildPhase,t.opacity,t.state==='build'));

  // Cinematic vignette
  const vig=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.22,W/2,H/2,Math.max(W,H)*.85);
  vig.addColorStop(0,'transparent'); vig.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);

  // Subtle film grain
  if(frame%3===0){
    ctx.globalAlpha=.018;
    for(let i=0;i<350;i++){
      ctx.fillStyle=Math.random()>.5?'#fff':'#000';
      ctx.fillRect(Math.random()*W,Math.random()*H,1.5,1.5);
    }
    ctx.globalAlpha=1;
  }
}

addLog(ROOMS.find(r=>r.key==='splinter'),'Entering the lair...');
requestAnimationFrame(loop);
</script>
