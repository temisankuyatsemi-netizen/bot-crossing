<title>Bot Crossing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap">

<style>
  :root { --bg:#060d04; color-scheme:dark; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:var(--bg);overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-family:'VT323',monospace}
  #topbar{
    position:absolute;top:max(14px,env(safe-area-inset-top,0px));
    left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
    display:flex;align-items:center;justify-content:space-between;gap:8px}
  #logo{font-family:'Orbitron',monospace;font-size:clamp(12px,2vw,18px);font-weight:900;
    letter-spacing:.2em;color:#7fff00;text-shadow:0 0 14px #7fff0088}
  #clock{font-family:'Orbitron',monospace;font-size:clamp(10px,1.4vw,13px);color:#ffd54f;
    letter-spacing:.12em;background:rgba(0,0,0,.6);padding:3px 10px;
    border:1px solid rgba(255,213,79,.3);border-radius:4px}
  #pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .pill{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:.06em;padding:3px 8px;
    border-radius:3px;background:rgba(0,0,0,.6);white-space:nowrap}
  #legend{position:absolute;left:max(14px,env(safe-area-inset-left,0px));
    top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px}
  .leg{display:flex;align-items:center;gap:6px;font-size:14px;color:#3a5030;
    background:rgba(0,0,0,.55);padding:3px 8px 3px 5px;border-radius:3px}
  .leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
  #feed{position:absolute;bottom:max(16px,env(safe-area-inset-bottom,0px));
    left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
    display:flex;flex-direction:column;gap:4px;max-height:100px;overflow:hidden}
  .log{font-size:15px;color:#405840;padding:3px 10px;background:rgba(0,8,0,.85);
    border-left:2px solid #1a4a10;border-radius:0 3px 3px 0;
    animation:sl .3s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log .who{font-weight:600;margin-right:6px}
  @keyframes sl{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>

<canvas id="c"></canvas>
<div id="hud">
  <div id="topbar">
    <div id="logo">BOT CROSSING</div>
    <div id="clock">00:00:00</div>
    <div id="pills">
      <div class="pill" id="p-bots" style="border:1px solid rgba(127,255,0,.3);color:#7fff00">TURTLES 0</div>
      <div class="pill" id="p-built" style="border:1px solid rgba(255,213,79,.3);color:#ffd54f">BUILT 0</div>
      <div class="pill" id="p-exp" style="border:1px solid rgba(100,200,50,.3);color:#64c832">WORLD 0%</div>
    </div>
  </div>
  <div id="legend"></div>
  <div id="feed"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, OX, OY;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  OX = W / 2;
  OY = H * 0.42;
}
resize();
window.addEventListener('resize', resize);

// ── Clock ─────────────────────────────────────────────────────────
function tickClock() {
  const d = new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2,'0') + ':' +
    String(d.getMinutes()).padStart(2,'0') + ':' +
    String(d.getSeconds()).padStart(2,'0');
}
tickClock(); setInterval(tickClock, 1000);

// ── Isometric projection ─────────────────────────────────────────
const ISO_SCALE = Math.min(W, H) * 0.045;
function iso(x, y, z) {
  const s = ISO_SCALE;
  return {
    sx: OX + (x - y) * s,
    sy: OY + (x + y) * s * 0.5 - z * s * 0.85
  };
}

// ── Sectors ───────────────────────────────────────────────────────
const SECTORS = [
  { key:'content',  label:'CONTENT HUB',        bandName:'LEONARDO',   bandana:'#1e90ff', angle: 0,
    tasks:['Post AM workout reel','Film healthy meal','Paint timelapse','Cheat day haul','Morning routine','Cook-along video','Sketch session','Recovery prep'] },
  { key:'stocked',  label:'STOCKED',             bandName:'DONATELLO',  bandana:'#b040ff', angle: Math.PI*2/5,
    tasks:['Prototype v2 spec','User research','Pitch deck slide','App wireframe','Backend schema','Supplier outreach','Press kit draft','Demo video'] },
  { key:'athletic', label:'ATHLETIC WEAR',       bandName:'RAPHAEL',    bandana:'#f44336', angle: Math.PI*4/5,
    tasks:['Design drop concept','Sample request','Launch campaign','Fit model shoot','Brand guide','Collab pitch','Website landing','Size run plan'] },
  { key:'creative', label:'CREATIVE COLLECTIVE', bandName:'MICHELANGELO',bandana:'#ff9800', angle: Math.PI*6/5,
    tasks:['Gallery concept','Merch design','Zine layout','Exhibition pitch','Community event','Digital drop','Collab artist DM','Editorial shoot'] },
  { key:'hq',       label:'HQ / OPS',            bandName:'SPLINTER',   bandana:'#4caf50', angle: Math.PI*8/5,
    tasks:['Sprint planning','OKR review','Budget model','Roadmap update','Team stand-up','Metrics dashboard','Risk log','Weekly recap'] },
];

// Legend
const legendEl = document.getElementById('legend');
SECTORS.forEach(s => {
  const el = document.createElement('div'); el.className = 'leg';
  el.innerHTML = `<div class="leg-dot" style="background:${s.bandana}"></div>${s.bandName} · ${s.label}`;
  legendEl.appendChild(el);
});

// ── World state ───────────────────────────────────────────────────
let worldRadius = 0, worldTarget = 3, worldMax = 11;
const grassBlocks = []; // { gx, gy, color }
const structures = []; // { gx, gy, sector, scale, targetScale, age }
const particles = []; // { x, y, z, vx, vy, vz, life, color }
const bots = [];

// ── Grass block grid ──────────────────────────────────────────────
const grassSet = new Set();
function ensureGrass() {
  const r = Math.ceil(worldRadius);
  for (let gx = -r; gx <= r; gx++) {
    for (let gy = -r; gy <= r; gy++) {
      if (gx*gx + gy*gy > worldRadius * worldRadius) continue;
      const k = `${gx},${gy}`;
      if (grassSet.has(k)) continue;
      grassSet.add(k);
      const hue = 110 + Math.random() * 20;
      const light = 12 + Math.random() * 7;
      grassBlocks.push({ gx, gy, color: `hsl(${hue},60%,${light}%)`, h: 0.28 + Math.random() * 0.08 });
    }
  }
}

// ── Draw isometric cube ───────────────────────────────────────────
function drawCube(gx, gy, gz, w, d, h, topColor, leftColor, rightColor, alpha=1) {
  const x = gx, y = gy, z = gz;
  const p = (xx, yy, zz) => iso(x + xx, y + yy, z + zz);

  const tl = p(0,0,h), tr = p(w,0,h), br = p(w,d,h), bl = p(0,d,h);
  const fl = p(0,0,0), fr = p(w,0,0);
  const rl = p(0,d,0);

  ctx.globalAlpha = alpha;

  // Top face
  ctx.fillStyle = topColor;
  ctx.beginPath();
  ctx.moveTo(tl.sx,tl.sy); ctx.lineTo(tr.sx,tr.sy);
  ctx.lineTo(br.sx,br.sy); ctx.lineTo(bl.sx,bl.sy);
  ctx.closePath(); ctx.fill();

  // Left face
  ctx.fillStyle = leftColor;
  ctx.beginPath();
  ctx.moveTo(tl.sx,tl.sy); ctx.lineTo(bl.sx,bl.sy);
  ctx.lineTo(rl.sx,rl.sy); ctx.lineTo(fl.sx,fl.sy);
  ctx.closePath(); ctx.fill();

  // Right face
  ctx.fillStyle = rightColor;
  ctx.beginPath();
  ctx.moveTo(tr.sx,tr.sy); ctx.lineTo(br.sx,br.sy);
  ctx.lineTo(rl.sx,rl.sy); ctx.lineTo(fr.sx,fr.sy);
  ctx.closePath(); ctx.fill();

  ctx.globalAlpha = 1;
}

// ── Draw Ninja Turtle bot (isometric voxel) ───────────────────────
function drawTurtle(gx, gy, bandana, isManager, facing, walkPhase, buildPhase, scale, alpha) {
  if (alpha <= 0) return;
  const bx = gx, by = gy;
  const sc = scale;
  ctx.globalAlpha = alpha;

  // Color palette
  const skin    = '#3a7a20';
  const skinDk  = '#2a5a14';
  const skinDk2 = '#1e4010';
  const shell   = '#4a3a10';
  const shellDk = '#2e2408';
  const shellLt = '#6a5520';
  const bDk     = shadeColor(bandana, -40);
  const bLt     = bandana;
  const white   = '#ddeedd';
  const black   = '#112211';

  const lw = buildPhase > 0 ? 0 : Math.sin(walkPhase) * 0.12 * sc;
  const rw = buildPhase > 0 ? 0 : -Math.sin(walkPhase) * 0.12 * sc;
  const bob = buildPhase > 0 ? 0 : Math.abs(Math.sin(walkPhase)) * 0.04 * sc;
  const bld = buildPhase > 0 ? Math.sin(buildPhase * 0.15) * 0.08 * sc : 0;

  const bz = bob;
  const s = sc;

  // LEGS
  drawCube(bx - 0.18*s, by - 0.06*s, bz + lw, 0.22*s, 0.22*s, 0.45*s, skin, skinDk, skinDk2);
  drawCube(bx + 0.04*s, by - 0.06*s, bz + rw, 0.22*s, 0.22*s, 0.45*s, skin, skinDk, skinDk2);

  // FEET
  drawCube(bx - 0.2*s,  by - 0.1*s,  bz + lw - 0.02*s, 0.28*s, 0.32*s, 0.1*s, '#2a5010', '#1e3a08', '#1a3006');
  drawCube(bx + 0.02*s, by - 0.1*s,  bz + rw - 0.02*s, 0.28*s, 0.32*s, 0.1*s, '#2a5010', '#1e3a08', '#1a3006');

  // BELT (bandana color strip)
  drawCube(bx - 0.22*s, by - 0.14*s, bz + 0.44*s, 0.56*s, 0.38*s, 0.1*s, bDk, shadeColor(bDk,-20), shadeColor(bDk,-30));

  // BODY
  drawCube(bx - 0.22*s, by - 0.12*s, bz + 0.53*s, 0.56*s, 0.36*s, 0.52*s, skin, skinDk, skinDk2);

  // SHELL (back)
  drawCube(bx - 0.2*s, by + 0.14*s, bz + 0.55*s, 0.5*s, 0.14*s, 0.44*s, shell, shellDk, shellDk);
  // shell highlights (segments)
  drawCube(bx - 0.18*s, by + 0.19*s, bz + 0.62*s, 0.2*s, 0.06*s, 0.16*s, shellLt, shell, shell);
  drawCube(bx + 0.06*s, by + 0.19*s, bz + 0.62*s, 0.2*s, 0.06*s, 0.16*s, shellLt, shell, shell);
  drawCube(bx - 0.18*s, by + 0.19*s, bz + 0.82*s, 0.2*s, 0.06*s, 0.14*s, shellLt, shell, shell);
  drawCube(bx + 0.06*s, by + 0.19*s, bz + 0.82*s, 0.2*s, 0.06*s, 0.14*s, shellLt, shell, shell);

  // ARMS
  const armLZ = bld;
  const armRZ = -bld;
  drawCube(bx - 0.42*s, by - 0.1*s, bz + 0.56*s + armLZ, 0.2*s, 0.2*s, 0.42*s, skin, skinDk, skinDk2);
  drawCube(bx + 0.24*s, by - 0.1*s, bz + 0.56*s + armRZ, 0.2*s, 0.2*s, 0.42*s, skin, skinDk, skinDk2);
  // fists
  drawCube(bx - 0.44*s, by - 0.12*s, bz + 0.54*s + armLZ + 0.4*s, 0.24*s, 0.24*s, 0.22*s, skin, skinDk, skinDk2);
  drawCube(bx + 0.22*s, by - 0.12*s, bz + 0.54*s + armRZ + 0.4*s, 0.24*s, 0.24*s, 0.22*s, skin, skinDk, skinDk2);

  // knee pads
  drawCube(bx - 0.2*s,  by - 0.1*s, bz + 0.25*s + lw, 0.26*s, 0.26*s, 0.14*s, bDk, shadeColor(bDk,-20), shadeColor(bDk,-30));
  drawCube(bx + 0.02*s, by - 0.1*s, bz + 0.25*s + rw, 0.26*s, 0.26*s, 0.14*s, bDk, shadeColor(bDk,-20), shadeColor(bDk,-30));

  // NECK
  drawCube(bx - 0.1*s, by - 0.05*s, bz + 1.04*s, 0.22*s, 0.18*s, 0.14*s, skin, skinDk, skinDk2);

  // HEAD
  const headW = isManager ? 0.6*s : 0.54*s;
  const headOX = isManager ? -0.28*s : -0.25*s;
  drawCube(bx + headOX, by - 0.16*s, bz + 1.16*s, headW, 0.46*s, 0.48*s, skin, skinDk, skinDk2);

  // BANDANA across face
  drawCube(bx + headOX - 0.01*s, by - 0.22*s, bz + 1.38*s, headW + 0.02*s, 0.08*s, 0.16*s, bLt, bDk, shadeColor(bDk,-10));
  // bandana knot at back
  drawCube(bx + headOX + 0.18*s, by + 0.22*s, bz + 1.4*s, 0.12*s, 0.1*s, 0.1*s, bDk, shadeColor(bDk,-20), shadeColor(bDk,-30));

  // EYES (square whites + pupils)
  drawCube(bx + headOX + 0.06*s, by - 0.22*s, bz + 1.46*s, 0.14*s, 0.04*s, 0.12*s, white, '#aaddaa', '#99cc99');
  drawCube(bx + headOX + 0.26*s, by - 0.22*s, bz + 1.46*s, 0.14*s, 0.04*s, 0.12*s, white, '#aaddaa', '#99cc99');
  // pupils
  drawCube(bx + headOX + 0.1*s,  by - 0.23*s, bz + 1.5*s,  0.07*s, 0.03*s, 0.07*s, bandana, black, black);
  drawCube(bx + headOX + 0.3*s,  by - 0.23*s, bz + 1.5*s,  0.07*s, 0.03*s, 0.07*s, bandana, black, black);

  // NOSE
  drawCube(bx + headOX + 0.2*s, by - 0.2*s, bz + 1.32*s, 0.1*s, 0.04*s, 0.07*s, '#2a5010', skinDk2, skinDk2);

  // Manager CROWN
  if (isManager) {
    drawCube(bx + headOX - 0.02*s, by - 0.17*s, bz + 1.62*s, headW + 0.04*s, 0.46*s, 0.1*s, '#ffd700', '#c8a000', '#a08000');
    // crown points
    for (let i = 0; i < 3; i++) {
      drawCube(bx + headOX + (i * 0.2 + 0.02)*s, by - 0.17*s, bz + 1.71*s, 0.1*s, 0.1*s, 0.16*s, '#ffee44', '#c8a000', '#a08000');
    }
  }

  ctx.globalAlpha = 1;
}

// ── Draw structure ────────────────────────────────────────────────
function drawStructure(gx, gy, sector, scale) {
  const s = scale;
  const c = sector.bandana;
  const cDk = shadeColor(c, -40);
  const cDk2 = shadeColor(c, -60);

  switch (sector.key) {
    case 'content':
      // Camera tower
      drawCube(gx-.3*s, gy-.3*s, 0, .6*s,.6*s,.5*s, '#334','#223','#112');
      drawCube(gx-.2*s, gy-.2*s, .5*s, .4*s,.4*s,.7*s, '#445','#334','#223');
      drawCube(gx-.25*s,gy-.3*s, 1.1*s,.5*s,.4*s,.35*s, c, cDk, cDk2);
      break;
    case 'stocked':
      // Crate stack
      drawCube(gx-.35*s,gy-.35*s,0,.7*s,.7*s,.5*s,'#6a4a18','#4a3010','#3a2008');
      drawCube(gx-.28*s,gy-.28*s,.5*s,.56*s,.56*s,.44*s,c,cDk,cDk2);
      drawCube(gx-.2*s, gy-.2*s, .9*s,.4*s,.4*s,.35*s,c,cDk,cDk2);
      break;
    case 'athletic':
      // Podium
      drawCube(gx-.4*s, gy-.4*s, 0,.8*s,.8*s,.3*s,'#880000','#550000','#440000');
      drawCube(gx-.3*s, gy-.3*s,.3*s,.6*s,.6*s,.28*s,c,cDk,cDk2);
      drawCube(gx-.18*s,gy-.18*s,.58*s,.36*s,.36*s,.24*s,'#cc3333',c,cDk);
      drawCube(gx-.1*s, gy-.1*s,.82*s,.2*s,.2*s,.2*s,'#ffdd00','#ccaa00','#aa8800');
      break;
    case 'creative':
      // Easel with canvas
      drawCube(gx-.05*s,gy-.05*s,0,.1*s,.1*s,.9*s,'#6a5020','#4a3810','#3a2808');
      drawCube(gx-.3*s, gy+.02*s,.4*s,.6*s,.08*s,.5*s,'#eef0e0','#ccd0c0','#aab0a0');
      drawCube(gx-.25*s,gy+.01*s,.45*s,.5*s,.06*s,.38*s,c,cDk,cDk2);
      break;
    case 'hq':
      // Command block
      drawCube(gx-.4*s,gy-.4*s,0,.8*s,.8*s,.8*s,'#6633aa','#442280','#332060');
      drawCube(gx-.38*s,gy-.38*s,.35*s,.76*s,.08*s,.1*s,c,cDk,cDk2);
      drawCube(gx-.1*s, gy-.38*s,.1*s,.08*s,.08*s,.6*s,c,cDk,cDk2);
      drawCube(gx-.38*s,gy-.1*s, .1*s,.6*s,.08*s,.08*s,c,cDk,cDk2);
      drawCube(gx-.05*s,gy-.05*s,.8*s,.1*s,.1*s,.7*s,'#442280','#332060','#221840');
      drawCube(gx-.12*s,gy-.12*s,1.45*s,.24*s,.24*s,.24*s,c,cDk,cDk2);
      break;
  }
}

// ── Shade color helper ────────────────────────────────────────────
function shadeColor(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, ((n>>16)&0xff) + pct));
  const g = Math.max(0, Math.min(255, ((n>>8)&0xff) + pct));
  const b = Math.max(0, Math.min(255, (n&0xff) + pct));
  return `rgb(${r},${g},${b})`;
}

// ── Stars ─────────────────────────────────────────────────────────
const STARS = Array.from({length:180}, () => ({
  x: Math.random(), y: Math.random() * 0.7,
  r: Math.random() * 1.4, b: Math.random()
}));

// ── Bot class ─────────────────────────────────────────────────────
class TurtleBot {
  constructor(sector, isManager=false) {
    this.sector = sector; this.isManager = isManager;
    const a = sector.angle + (Math.random()-.5)*.5;
    const r = isManager ? 0.8 : 1.4 + Math.random() * 2;
    this.gx = Math.cos(a)*r; this.gy = Math.sin(a)*r;
    this.tx = this.gx; this.ty = this.gy;
    this.speed = isManager ? 0.012 : 0.018 + Math.random()*.012;
    this.state = 'idle';
    this.buildTimer = 0; this.buildPos = null;
    this.idleTimer = Math.floor(Math.random()*80);
    this.t = Math.random()*100;
    this.walkPhase = 0;
    this.buildPhase = 0;
    this.scale = isManager ? 0.75 : 0.55 + Math.random()*.12;
    this.opacity = 0;
    this.name = isManager
      ? `MASTER-${sector.key.toUpperCase().slice(0,4)}`
      : `${sector.bandName.slice(0,3)}-${String(Math.floor(Math.random()*99)).padStart(2,'0')}`;
    this.built = 0;
    this.facing = 1;
    this.sortZ = 0; // for depth sorting
  }

  update(dt) {
    this.t += dt;
    if (this.opacity < 1) this.opacity = Math.min(1, this.opacity + 0.03);

    if (this.state === 'idle') {
      if (--this.idleTimer <= 0) { this.chooseTarget(); this.state = 'walk'; }
      return;
    }
    if (this.state === 'build') {
      this.buildPhase += dt;
      if (--this.buildTimer <= 0) this.finishBuild();
      return;
    }

    const dx = this.tx - this.gx, dy = this.ty - this.gy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 0.05) {
      this.gx = this.tx; this.gy = this.ty;
      const r = Math.sqrt(this.gx**2 + this.gy**2);
      if (r < worldRadius * 0.86 && Math.random() < .55 && !this.isManager) {
        this.state = 'build';
        this.buildTimer = 70 + Math.random()*80;
        this.buildPhase = 0;
        this.buildPos = { gx: this.gx, gy: this.gy };
      } else {
        this.state = 'idle';
        this.idleTimer = 30 + Math.floor(Math.random()*60);
      }
    } else {
      this.gx += dx/dist * this.speed;
      this.gy += dy/dist * this.speed;
      this.walkPhase += dt * 0.25;
    }
    this.sortZ = this.gx + this.gy;
  }

  chooseTarget() {
    const a = this.sector.angle + (Math.random()-.5) * (this.isManager ? .7 : 1.1);
    const r = this.isManager
      ? 0.4 + Math.random() * worldRadius * .35
      : 0.2 + Math.random() * worldRadius * .82;
    this.tx = Math.cos(a)*r; this.ty = Math.sin(a)*r;
  }

  finishBuild() {
    structures.push({ gx: this.buildPos.gx, gy: this.buildPos.gy, sector: this.sector, scale: 0.01, targetScale: 0.7 + Math.random()*.4, sortZ: this.buildPos.gx + this.buildPos.gy });
    // particles
    for (let i = 0; i < 10; i++) {
      const a = Math.random()*Math.PI*2;
      particles.push({ gx: this.buildPos.gx, gy: this.buildPos.gy, z: 0.3,
        vx: Math.cos(a)*.06, vy: Math.sin(a)*.04, vz: .08+Math.random()*.1,
        life: 1, color: this.sector.bandana });
    }
    this.built++;
    this.state = 'idle'; this.idleTimer = 20;
    this.buildPhase = 0;
    const tasks = this.sector.tasks;
    addLog(this.sector, this.name, tasks[Math.floor(Math.random()*tasks.length)]);
    updateStats();
  }

  draw() {
    drawTurtle(this.gx, this.gy, this.sector.bandana, this.isManager, this.facing, this.walkPhase, this.buildPhase, this.scale, this.opacity);
  }
}

// ── Feed & stats ──────────────────────────────────────────────────
function addLog(sector, name, msg) {
  const feed = document.getElementById('feed');
  const el = document.createElement('div'); el.className = 'log';
  el.style.borderLeftColor = sector.bandana;
  el.innerHTML = `<span class="who" style="color:${sector.bandana}">${name}</span>${msg}`;
  feed.prepend(el);
  while (feed.children.length > 3) feed.removeChild(feed.lastChild);
}
function updateStats() {
  document.getElementById('p-bots').textContent = `TURTLES ${bots.length}`;
  document.getElementById('p-built').textContent = `BUILT ${structures.length}`;
  document.getElementById('p-exp').textContent = `WORLD ${Math.round(worldRadius/worldMax*100)}%`;
}

// ── Main loop ─────────────────────────────────────────────────────
let lastTime = 0, frame = 0, spawnTimer = 0, growTimer = 0;

function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min((ts - lastTime) / 16.67, 3); lastTime = ts;
  frame++;

  // Resize ISO scale dynamically
  const s = Math.min(W, H) * 0.045;
  const IS = s;

  // Grow world
  worldRadius += (worldTarget - worldRadius) * 0.015;
  growTimer += dt;
  if (growTimer > 200) { worldTarget = Math.min(worldMax, worldTarget + 0.5 + Math.random()*.8); growTimer = 0; }
  if (frame % 6 === 0) ensureGrass();

  // Spawn
  spawnTimer += dt;
  if (spawnTimer > 260 && bots.length < SECTORS.length * 4 && worldRadius > 2) {
    SECTORS.forEach(s => {
      if (!bots.some(b => b.isManager && b.sector === s)) {
        const b = new TurtleBot(s, true); bots.push(b);
        addLog(s, b.name, `Sensei of ${s.label}`);
        updateStats();
      }
    });
    if (bots.length < SECTORS.length * 4) {
      const s = SECTORS[Math.floor(Math.random()*SECTORS.length)];
      const b = new TurtleBot(s, false); bots.push(b);
      addLog(s, b.name, 'COWABUNGA!');
      updateStats();
    }
    spawnTimer = 0;
  }

  // Update
  bots.forEach(b => {
    const r = Math.sqrt(b.gx**2 + b.gy**2);
    if (r > worldRadius * .9 && b.state === 'walk') { b.tx = b.gx*.35; b.ty = b.gy*.35; }
    b.update(dt);
  });
  structures.forEach(s => { if (s.scale < s.targetScale) s.scale = Math.min(s.targetScale, s.scale + 0.04*dt); });
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.gx += p.vx*dt; p.gy += p.vy*dt; p.z += p.vz*dt;
    p.vz -= 0.003*dt; p.life -= 0.02*dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // ── DRAW ──────────────────────────────────────────────────────
  ctx.clearRect(0, 0, W, H);

  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#020a01'); sky.addColorStop(1, '#0a1508');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // Stars
  STARS.forEach(st => {
    const pulse = Math.sin(frame*.01 + st.b*10) * .25 + .75;
    ctx.fillStyle = `rgba(160,210,140,${st.b*.5*pulse})`;
    ctx.beginPath(); ctx.arc(st.x*W, st.y*H, st.r, 0, Math.PI*2); ctx.fill();
  });

  // Horizon glow
  const hg = ctx.createRadialGradient(OX, OY, 0, OX, OY, Math.min(W,H)*.5);
  hg.addColorStop(0, 'rgba(30,80,10,0.18)'); hg.addColorStop(1, 'transparent');
  ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H);

  // Depth-sort everything by gx+gy (isometric painter's algo)
  const allDrawables = [];
  grassBlocks.forEach(g => allDrawables.push({ sort: g.gx+g.gy, type:'grass', d:g }));
  structures.forEach(s => allDrawables.push({ sort: s.gx+s.gy+0.5, type:'struct', d:s }));
  particles.forEach(p => allDrawables.push({ sort: p.gx+p.gy+0.8, type:'particle', d:p }));
  bots.forEach(b => allDrawables.push({ sort: b.sortZ+1, type:'bot', d:b }));
  allDrawables.sort((a,b) => a.sort - b.sort);

  // World edge glow under ground
  const wr = worldRadius;
  const { sx: cx, sy: cy } = iso(0,0,0);
  const eg = ctx.createRadialGradient(cx, cy, 0, cx, cy, wr * Math.min(W,H)*.045 * 1.8);
  eg.addColorStop(0,'rgba(40,120,10,0.1)'); eg.addColorStop(.7,'rgba(20,80,5,0.06)'); eg.addColorStop(1,'transparent');
  ctx.fillStyle = eg; ctx.fillRect(0,0,W,H);

  allDrawables.forEach(item => {
    const d = item.d;
    switch(item.type) {
      case 'grass':
        drawCube(d.gx, d.gy, 0, 1, 1, d.h, d.color, shadeColor(d.color, -20), shadeColor(d.color, -35));
        break;
      case 'struct':
        drawStructure(d.gx, d.gy, d.sector, d.scale);
        break;
      case 'particle':
        const pp = iso(d.gx, d.gy, d.z);
        ctx.globalAlpha = d.life;
        ctx.fillStyle = d.color;
        ctx.fillRect(pp.sx-3, pp.sy-3, 6, 6);
        ctx.globalAlpha = 1;
        break;
      case 'bot':
        d.draw();
        break;
    }
  });

  // Beacon beam (center)
  const bc = iso(0,0,0);
  const beamGrad = ctx.createLinearGradient(bc.sx, bc.sy, bc.sx, 0);
  beamGrad.addColorStop(0, `rgba(100,255,50,${0.12+Math.sin(frame*.04)*.05})`);
  beamGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = beamGrad;
  ctx.fillRect(bc.sx-6, 0, 12, bc.sy);

  // Center core
  const cp = Math.sin(frame*.05)*.2+.8;
  const cg = ctx.createRadialGradient(bc.sx, bc.sy, 0, bc.sx, bc.sy, 22*cp);
  cg.addColorStop(0, 'rgba(160,255,80,0.9)'); cg.addColorStop(.4,'rgba(80,200,30,0.4)'); cg.addColorStop(1,'transparent');
  ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(bc.sx, bc.sy, 22*cp, 0, Math.PI*2); ctx.fill();

  // Manager check-in logs
  if (frame % 320 === 0) {
    const mgrs = bots.filter(b => b.isManager);
    if (mgrs.length) {
      const m = mgrs[Math.floor(Math.random()*mgrs.length)];
      const lines = ['Turtle power!','Delegating tasks','Shell check clear','Reviewing sector','Syncing the crew'];
      addLog(m.sector, m.name, lines[Math.floor(Math.random()*lines.length)]);
    }
  }
}

setTimeout(() => {
  worldTarget = 3.2;
  addLog(SECTORS[4], 'MASTER-HQ', 'Bot Crossing awakens...');
  requestAnimationFrame(loop);
}, 100);
</script>
